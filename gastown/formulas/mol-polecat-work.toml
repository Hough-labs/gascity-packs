description = """
Polecat work lifecycle — feature-branch variant.

Extends mol-polecat-base with feature-branch workspace setup and
refinery-based submission. The polecat creates a feature branch,
implements the work, then pushes and reassigns to the refinery for
merge review.

## Polecat Contract (Self-Cleaning Model)

1. Receive work (molecule poured with this formula, assigned to you)
2. Follow steps in order (read descriptions, execute, move to next)
3. Submit: push branch, set metadata on work bead, assign to refinery, exit
4. You are GONE — Refinery merges, closes the bead

**No MR beads.** Work beads flow directly: pool → polecat → refinery → closed.
The polecat sets `metadata.branch` and `metadata.target` on the work bead
and reassigns it to the refinery. The refinery merges and closes.

**NEVER CLOSE THE WORK BEAD.** You must not run `gc bd close` or set
status=closed on it. Even if you believe the code is already merged, reassign
to refinery — only the refinery verifies merges and closes beads. The single
exception is your own formula step beads: `submit-and-exit` closes its own
step (resolved with `gc hook current`) before draining, because a step left
claimed is handed back to the pool and re-run.
`{{base_branch}}` may come from the work bead's own `metadata.target` or
be inherited from a parent convoy with `metadata.target` set.

## Variables

| Variable | Source | Description |
|----------|--------|-------------|
| binding_prefix | import binding | Agent identity prefix for bound Gas Town imports. |
| affected_tests_command | rig `formula_vars` | Shell-safe command that reads `git diff --name-only $BASE_REF...HEAD` (`self-review` exports `BASE_REF` from the base recorded by `workspace-setup`) and runs the matching test subset. Must exit non-zero if that diff fails, rather than running zero tests. Empty = run full `test_command`. |

**Rejection-aware.** If the work bead has `metadata.branch` and
`metadata.rejection_reason`, a previous attempt was rejected by the
refinery. Resume the existing branch — don't redo all the work.

## Failure Modes

| Situation | Action |
|-----------|--------|
| Tests fail | Fix them. Do not proceed with failures. |
| Blocked on external | Mail Witness, mark yourself stuck |
| Context filling | `gc runtime request-restart` (blocks until controller kills you) |
| Unsure what to do | Mail Witness, don't guess |"""
formula = "mol-polecat-work"
extends = ["mol-polecat-base"]

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.affected_tests_command]
description = "Shell-safe affected-tests command. Must read `git diff --name-only $BASE_REF...HEAD` (self-review exports BASE_REF from the base recorded by workspace-setup) and run the matching test subset. Must exit non-zero when that diff fails instead of silently running zero tests. From rig `formula_vars` or empty to run full test_command."
default = ""

[[steps]]
id = "workspace-setup"
title = "Set up worktree and feature branch"
needs = ["load-context"]
description = """
Ensure you have an isolated git worktree and a clean feature branch.
Every check is idempotent — safe to re-run after crash/restart.

**Config: base_branch = {{base_branch}}**
**Config: setup_command = {{setup_command}}**

`{{base_branch}}` is resolved by `gc sling` in this order:
1. `metadata.target` on the work bead
2. `metadata.target` on the parent convoy chain
3. the rig repo's default branch

**1. Fetch latest, derive your work bead, and resolve the base ref:**
```bash
git fetch --prune origin
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
if [ -z "$WORK_BEAD_ID" ]; then
  echo "mol-polecat-work requires an input convoy with exactly one tracked member" >&2
  gc runtime drain-ack
  exit 1
fi
# Clear any stale handoff marker before touching the work. A fresh attempt on
# this bead means a prior submit-and-exit step 5 no longer describes it, and a
# leftover marker would let the witness's Step 3a hand un-submitted work to the
# refinery if this attempt also crashes. Unconditional on purpose: a bead can
# arrive here carrying the marker with no rejection_reason (witness pool reset,
# operator re-sling), so clearing only on the rejection path is not enough.
gc bd update "$WORK_BEAD_ID" --unset-metadata handoff_stage
```

Then resolve what `{{base_branch}}` means in this clone, remote-first.
A base that exists on origin is used via its freshly-fetched
remote-tracking ref. A base that exists only locally (an unpushed
integration branch) is still a valid pin — use the local branch. If
neither exists the base configuration is wrong: STOP rather than
substituting a different base, because silently falling back to the
repo default is how a rig pinned to an integration branch got polecats
branched off main (gas-e6r).

When the base exists in both places, the local copy must not carry
local-only commits: a base that has advanced only locally is not the base
the refinery will merge against, and branching from either side silently
picks a different fork point. Ancestry-check, then count the commits the
local copy holds that no remote ref does, instead of guessing. A local
copy that is merely stale — behind a force-pushed origin, with every
commit still on some remote branch — holds nothing that would be lost, so
the step branches from origin rather than halting the pool.

Both arms name fully-qualified refs. Git resolves `refs/tags/<name>`
before `refs/heads/<name>`, so a bare branch name lets a same-named tag
shadow the branch `show-ref --verify` just confirmed — worktree add,
rebase, `checkout -B`, and the recorded `fork_sha` would all pin the
tag's tip.

This order — remote, then local, else stop — is the same contract
`gastown/assets/scripts/worktree-setup.sh` must follow when it grows
base selection of its own; keep the two halves in step, or they will
disagree about what "the base" means.

```bash
# GUARD_BEGIN base-resolve
BASE_REMOTE="refs/remotes/origin/{{base_branch}}"
BASE_LOCAL="refs/heads/{{base_branch}}"
WITNESS_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness"
if git show-ref --verify --quiet "$BASE_REMOTE"; then
    if git show-ref --verify --quiet "$BASE_LOCAL" && ! git merge-base --is-ancestor "$BASE_LOCAL" "$BASE_REMOTE"; then
        LOCAL_ONLY=$(git rev-list --count "$BASE_LOCAL" --not --remotes) || LOCAL_ONLY=err
        if [ "$LOCAL_ONLY" != "0" ]; then
            echo "STOP: local {{base_branch}} has local-only commits that are not on origin or any other remote branch."
            echo "Reconcile or push {{base_branch}} first; do not branch from a stale base."
            gc bd update "$WORK_BEAD_ID" --set-metadata halt_reason=base_branch_diverged
            gc mail send "$WITNESS_TARGET" -s "polecat halted: base_branch_diverged ($WORK_BEAD_ID)" -m "Local {{base_branch}} has local-only commits (count: $LOCAL_ONLY) that are not an ancestor of the copy on origin and are on no remote branch; $WORK_BEAD_ID cannot pick a fork point. Reconcile the branch."
            gc runtime drain-ack
            exit 1
        fi
        echo "note: local {{base_branch}} is stale (0 commits off-remote); branching from origin"
    fi
    BASE_REF="$BASE_REMOTE"    # preferred: freshly fetched, no local drift
elif git show-ref --verify --quiet "$BASE_LOCAL"; then
    BASE_REF="$BASE_LOCAL"     # local-only base (unpushed integration branch)
    echo "note: base branch {{base_branch}} is local-only — it does not exist on origin"
else
    echo "STOP: base branch {{base_branch}} exists neither on origin nor locally."
    echo "Fix the rig/bead base configuration; do not substitute a different base."
    gc bd update "$WORK_BEAD_ID" --set-metadata halt_reason=base_branch_missing
    gc mail send "$WITNESS_TARGET" -s "polecat halted: base_branch_missing ($WORK_BEAD_ID)" -m "Base branch {{base_branch}} exists neither on origin nor locally in this clone. $WORK_BEAD_ID cannot start until the rig/bead base configuration is fixed."
    gc runtime drain-ack
    exit 1
fi
gc bd update "$WORK_BEAD_ID" --set-metadata base_ref="$BASE_REF"
# GUARD_END base-resolve
```

The STOP arms stamp `halt_reason` and mail the witness on the way out —
a base misconfiguration needs a human, and an unrecorded exit just loops
through witness recovery until someone reads session logs.

Every later block in this step uses `$BASE_REF` — never assume
`origin/{{base_branch}}` exists. `$BASE_REF` is a shell variable and
dies with this session, so the resolution is also recorded on the work
bead as `metadata.base_ref`; later steps run in fresh sessions and read
it back from there.

**2. Ensure a safe per-bead artifact worktree exists.**

Task worktrees use the canonical `metadata.artifact_dir` key. The deprecated
task `metadata.work_dir` key may be adopted only after proving that it is an
existing per-bead Git worktree at this city's exact historical Gastown
provider path. A legacy core may already have launched the session inside that
valid task worktree, so current cwd equality is not a rejection criterion.
Adoption migrates the metadata key in place; it does not claim that a legacy
provider-nested directory has physically moved. Never `cd` to either task
metadata path before it passes the city, rig, layout, bead, and Git checks.

Load both task keys and resolve the city-managed artifact root before changing
directories. New task worktrees are siblings of prunable polecat homes, never
children of them:
```bash
BEAD_JSON=$(gc bd show "$WORK_BEAD_ID" --json) || {
  echo "Could not read work bead metadata for $WORK_BEAD_ID." >&2
  gc runtime drain-ack
  exit 1
}
BEAD_META=$(printf '%s' "$BEAD_JSON" | jq -ce '
  if type == "array" and length == 1 and (.[0] | type) == "object" and
     ((.[0].metadata // {}) | type) == "object"
  then .[0].metadata // {}
  else error("expected exactly one work bead object")
  end
') || {
  echo "Invalid work bead response for $WORK_BEAD_ID; refusing to create or adopt an artifact." >&2
  gc runtime drain-ack
  exit 1
}
ARTIFACT_DIR=$(printf '%s' "$BEAD_META" | jq -r '.artifact_dir // empty')
LEGACY_WORK_DIR=$(printf '%s' "$BEAD_META" | jq -r '.work_dir // empty')
if [ -z "${GC_CITY_PATH:-}" ] || [ -z "${GC_RIG:-}" ] ||
   [ -z "${GC_RIG_ROOT:-}" ]; then
  echo "GC_CITY_PATH, GC_RIG, and GC_RIG_ROOT are required for task worktrees." >&2
  gc runtime drain-ack
  exit 1
fi
case "$WORK_BEAD_ID" in
  ""|"."|".."|*[!A-Za-z0-9._-]*)
    echo "Unsafe work bead id for artifact path: $WORK_BEAD_ID" >&2
    gc runtime drain-ack
    exit 1
    ;;
esac
case "$GC_RIG" in
  ""|"."|".."|*[!A-Za-z0-9._-]*)
    echo "Unsafe rig name for artifact path: $GC_RIG" >&2
    gc runtime drain-ack
    exit 1
    ;;
esac
CITY_ROOT=$(CDPATH= cd -- "$GC_CITY_PATH" 2>/dev/null && pwd -P) || {
  echo "City root is missing: $GC_CITY_PATH" >&2
  gc runtime drain-ack
  exit 1
}
RIG_ROOT=$(CDPATH= cd -- "$GC_RIG_ROOT" 2>/dev/null && pwd -P) || {
  echo "Rig root is missing: $GC_RIG_ROOT" >&2
  gc runtime drain-ack
  exit 1
}
```

Use this validator for canonical paths, legacy adoption, and any newly-created
path:
```bash
# BEGIN ARTIFACT_WORKTREE_VALIDATOR
artifact_git_common_dir() {
  local repo_dir=$1 common_dir
  common_dir=$(git -C "$repo_dir" rev-parse --path-format=absolute --git-common-dir 2>/dev/null) ||
    return 1
  (CDPATH= cd -- "$common_dir" 2>/dev/null && pwd -P)
}

validate_artifact_worktree() {
  local candidate=$1 city_root=$2 rig_name=$3 rig_root=$4 bead_id=$5
  local policy=${6:-existing}
  local candidate_real candidate_top candidate_common rig_common
  local rig_namespace rig_namespace_real canonical_path
  local worktrees_parent provider_home provider_root provider_name

  [ -n "$candidate" ] && [ -d "$candidate" ] || return 1
  candidate_real=$(CDPATH= cd -- "$candidate" 2>/dev/null && pwd -P) || return 1

  # Only the exact bead-scoped .../worktrees/<bead-id> shape is reusable.
  [ "$(basename -- "$candidate_real")" = "$bead_id" ] || return 1
  [ "$(basename -- "$(dirname -- "$candidate_real")")" = "worktrees" ] || return 1

  # Same-repository is not an ownership boundary: multiple cities and rigs can
  # share one Git common dir. Require this city's exact canonical path or the
  # one historical provider-nested layout that Gastown actually created.
  rig_namespace="$city_root/.gc/worktrees/$rig_name"
  rig_namespace_real=$(CDPATH= cd -- "$rig_namespace" 2>/dev/null && pwd -P) ||
    return 1
  [ "$rig_namespace_real" = "$rig_namespace" ] || return 1
  canonical_path="$rig_namespace_real/artifacts/worktrees/$bead_id"
  if [ "$candidate_real" = "$canonical_path" ]; then
    [ "$policy" != legacy-only ] || return 1
  else
    [ "$policy" != canonical-only ] || return 1
    worktrees_parent=$(dirname -- "$candidate_real")
    provider_home=$(dirname -- "$worktrees_parent")
    provider_root=$(dirname -- "$provider_home")
    provider_name=$(basename -- "$provider_home")
    [ "$provider_root" = "$rig_namespace_real/polecats" ] || return 1
    case "$provider_name" in
      ""|"."|".."|*[!A-Za-z0-9._-]*) return 1 ;;
    esac
  fi

  # Reject a plain subdirectory of a worktree and worktrees from another repo.
  candidate_top=$(git -C "$candidate_real" rev-parse --show-toplevel 2>/dev/null) ||
    return 1
  candidate_top=$(CDPATH= cd -- "$candidate_top" 2>/dev/null && pwd -P) || return 1
  [ "$candidate_top" = "$candidate_real" ] || return 1
  candidate_common=$(artifact_git_common_dir "$candidate_real") || return 1
  rig_common=$(artifact_git_common_dir "$rig_root") || return 1
  [ "$candidate_common" = "$rig_common" ] || return 1

  printf '%s\n' "$candidate_real"
}
# END ARTIFACT_WORKTREE_VALIDATOR
```

Canonical metadata wins. If it is absent, a valid legacy path can be adopted
in place. A stale, missing, provider-root, wrong-city, wrong-rig, wrong-bead,
or foreign-repo legacy path is ignored and a new canonical artifact worktree
is created:
```bash
WORKTREE=
if [ -n "$ARTIFACT_DIR" ]; then
  if WORKTREE=$(validate_artifact_worktree \
      "$ARTIFACT_DIR" "$CITY_ROOT" "$GC_RIG" "$RIG_ROOT" \
      "$WORK_BEAD_ID" existing); then
    echo "Reusing artifact_dir=$WORKTREE"
  else
    echo "Canonical artifact_dir is missing or unsafe: $ARTIFACT_DIR" >&2
    echo "STOP. Preserve it for manual recovery; only an absent canonical key may fall back or create." >&2
    gc runtime drain-ack
    exit 1
  fi
elif [ -n "$LEGACY_WORK_DIR" ]; then
  if WORKTREE=$(validate_artifact_worktree \
      "$LEGACY_WORK_DIR" "$CITY_ROOT" "$GC_RIG" "$RIG_ROOT" \
      "$WORK_BEAD_ID" legacy-only); then
    echo "Adopting validated in-place legacy work_dir=$WORKTREE as artifact_dir."
    echo "It remains provider-nested until terminal cleanup; new artifacts are always canonical."
  else
    echo "Ignoring unsafe legacy work_dir=$LEGACY_WORK_DIR; creating a new per-bead worktree." >&2
  fi
fi

if [ -z "$WORKTREE" ]; then
  ARTIFACT_HOME="$CITY_ROOT/.gc/worktrees/$GC_RIG/artifacts"
  if [ -L "$ARTIFACT_HOME" ] ||
     { [ -e "$ARTIFACT_HOME" ] && [ ! -d "$ARTIFACT_HOME" ]; }; then
    echo "Task artifact root is redirected or is not a directory: $ARTIFACT_HOME" >&2
    gc runtime drain-ack
    exit 1
  fi
  mkdir -p -- "$ARTIFACT_HOME"
  ARTIFACT_HOME_REAL=$(CDPATH= cd -- "$ARTIFACT_HOME" 2>/dev/null && pwd -P) || {
    echo "Cannot resolve task artifact root." >&2
    gc runtime drain-ack
    exit 1
  }
  if [ "$ARTIFACT_HOME_REAL" != "$ARTIFACT_HOME" ]; then
    echo "Task artifact root is redirected outside the city/rig namespace." >&2
    gc runtime drain-ack
    exit 1
  fi
  WORKTREE_PARENT="$ARTIFACT_HOME/worktrees"
  if [ -L "$WORKTREE_PARENT" ] ||
     { [ -e "$WORKTREE_PARENT" ] && [ ! -d "$WORKTREE_PARENT" ]; }; then
    echo "Task worktree parent is redirected or is not a directory: $WORKTREE_PARENT" >&2
    gc runtime drain-ack
    exit 1
  fi
  mkdir -p -- "$WORKTREE_PARENT"
  WORKTREE_PARENT=$(CDPATH= cd -- "$WORKTREE_PARENT" 2>/dev/null && pwd -P) || {
    echo "Cannot resolve task worktree parent under the city artifact root." >&2
    gc runtime drain-ack
    exit 1
  }
  if [ "$WORKTREE_PARENT" != "$ARTIFACT_HOME/worktrees" ]; then
    echo "Task worktree parent is redirected outside the city artifact root." >&2
    gc runtime drain-ack
    exit 1
  fi
  WORKTREE_PATH="$WORKTREE_PARENT/$WORK_BEAD_ID"

  if [ -e "$WORKTREE_PATH" ]; then
    # Recover the narrow crash window after git worktree add but before the
    # metadata write. Never reuse an unrelated directory at this path.
    if WORKTREE=$(validate_artifact_worktree \
        "$WORKTREE_PATH" "$CITY_ROOT" "$GC_RIG" "$RIG_ROOT" \
        "$WORK_BEAD_ID" canonical-only); then
      echo "Recovering existing validated per-bead worktree=$WORKTREE"
    else
      echo "Canonical artifact path already exists but is not this bead's validated worktree: $WORKTREE_PATH" >&2
      echo "STOP. Preserve and resolve the collision manually; do not create an alternate artifact." >&2
      gc runtime drain-ack
      exit 1
    fi
  fi

  if [ -z "$WORKTREE" ]; then
    git -C "$RIG_ROOT" worktree prune
    : "${BASE_REF:?base ref not resolved — run step 1 first}"
    git -C "$RIG_ROOT" worktree add "$WORKTREE_PATH" --detach "$BASE_REF"
    WORKTREE=$(validate_artifact_worktree \
      "$WORKTREE_PATH" "$CITY_ROOT" "$GC_RIG" "$RIG_ROOT" \
      "$WORK_BEAD_ID" canonical-only) || {
        echo "New task worktree failed validation: $WORKTREE_PATH" >&2
        gc runtime drain-ack
        exit 1
      }
  fi
fi

# Record the canonical key immediately, then retire any legacy task key.
gc bd update "$WORK_BEAD_ID" \
  --set-metadata artifact_dir="$WORKTREE" \
  --unset-metadata work_dir || {
    echo "Could not record artifact_dir; refusing to enter an untracked task worktree." >&2
    gc runtime drain-ack
    exit 1
  }
cd -- "$WORKTREE" || {
  echo "Validated task worktree disappeared: $WORKTREE" >&2
  gc runtime drain-ack
  exit 1
}
```

Worktrees are scoped to the work bead (not the agent name) so that:
- An agent can pick up new work even if an old worktree is being recovered
- Multiple orphaned worktrees can coexist without collision
- The witness cleans them independently per-bead

**3. Ensure branch exists.**

Check if `metadata.branch` already records a branch:
```bash
BRANCH=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.branch // empty')
```

**If branch exists in metadata** — treat it as authoritative. This
metadata may come from rejection recovery or from a caller that wants
work applied to an existing branch. Fetch the named remote branch first.
If `origin/$BRANCH` exists, make the local branch fast-forward to that
remote tip or stop on divergence:
```bash
# --- branch-resolution:begin ---
git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || \
    echo "Could not fetch metadata.branch=$BRANCH from origin. Checking local refs before stopping."
if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
    if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
        git checkout "$BRANCH" || exit 1
        git merge --ff-only "origin/$BRANCH" || {
            echo "Local branch $BRANCH diverged from origin/$BRANCH."
            echo "STOP. Reconcile the branch before continuing."
            gc runtime drain-ack
            exit 1
        }
    else
        git checkout --track -b "$BRANCH" "origin/$BRANCH" || exit 1
    fi
elif git show-ref --verify --quiet "refs/heads/$BRANCH"; then
    git checkout "$BRANCH" || exit 1
else
    echo "metadata.branch=$BRANCH was set but no local or origin branch exists."
    echo "STOP. Do not create a different branch."
    gc runtime drain-ack
    exit 1
fi
# --- branch-resolution:end ---
```
If resuming a rejected branch, rebase onto latest base:
```bash
REJECTION=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.rejection_reason // empty')
if [ -n "$REJECTION" ]; then
    : "${BASE_REF:?base ref not resolved — run step 1 first}"
    git rebase "$BASE_REF"
    # If conflicts: resolve them (this is likely the rejection reason)
    # After resolving: git rebase --continue
    gc bd update "$WORK_BEAD_ID" \
      --unset-metadata rejection_reason \
      --set-metadata fork_sha="$(git rev-parse "$BASE_REF")"
fi
```

**If no branch** — preserve the narrow interruption case where this worktree
is already on the expected branch and only the metadata write was missed.
Every other non-pristine state fails closed; never delete or reset a ref to
repair empty metadata. New branches always start from the resolved
`$BASE_REF`, never from whatever branch happens to be checked out. When the
base exists on origin, `$BASE_REF` is its freshly-fetched remote-tracking ref;
when the base is local-only, the local branch IS the tip:
```bash
: "${BASE_REF:?base ref not resolved — run step 1 first}"
EXPECTED_BRANCH="polecat/$WORK_BEAD_ID"
CURRENT_BRANCH=$(git branch --show-current)
if [ "$CURRENT_BRANCH" = "$EXPECTED_BRANCH" ]; then
  BRANCH="$EXPECTED_BRANCH"
  FORK_SHA=$(git merge-base "$BRANCH" "$BASE_REF") || {
    echo "Cannot derive fork point for recovered branch $BRANCH." >&2
    gc runtime drain-ack
    exit 1
  }
  gc bd update "$WORK_BEAD_ID" \
    --set-metadata branch="$BRANCH" \
    --set-metadata fork_sha="$FORK_SHA" || {
      echo "Could not record recovered branch metadata." >&2
      gc runtime drain-ack
      exit 1
    }
elif [ -n "$CURRENT_BRANCH" ] ||
     [ -n "$(git status --porcelain)" ] ||
     git show-ref --verify --quiet "refs/heads/$EXPECTED_BRANCH" ||
     git show-ref --verify --quiet "refs/remotes/origin/$EXPECTED_BRANCH" ||
     ! git merge-base --is-ancestor HEAD "$BASE_REF"; then
  echo "artifact_dir contains branch/work not recorded in metadata.branch." >&2
  echo "STOP. Recover and record it manually; do not reset or delete refs." >&2
  gc runtime drain-ack
  exit 1
else
  # A clean detached checkout at or behind the base has no unique work.
  if [ "$BASE_REF" = "refs/heads/{{base_branch}}" ]; then
    :  # local-only base: nothing on origin to refresh
  elif ! git fetch origin {{base_branch}} >/dev/null 2>&1; then
    # Step 1 already resolved this base on origin, so a failure here is
    # either transient or the base disappearing mid-run. Ask origin rather
    # than silently branching from a stale remote-tracking ref.
    if git ls-remote --exit-code --heads origin "refs/heads/{{base_branch}}" >/dev/null 2>&1; then
      echo "warning: could not refresh {{base_branch}}; using the ref fetched in step 1"
    else
      echo "STOP: {{base_branch}} no longer resolves on origin (deleted, renamed, or unreachable)." >&2
      echo "Re-run workspace-setup to re-resolve the base; do not branch from a stale ref." >&2
      gc runtime drain-ack
      exit 1
    fi
  fi
  BRANCH="$EXPECTED_BRANCH"
  git checkout -b "$BRANCH" "$BASE_REF" || {
    echo "Could not create $BRANCH from $BASE_REF." >&2
    gc runtime drain-ack
    exit 1
  }
  gc bd update "$WORK_BEAD_ID" \
    --set-metadata branch="$BRANCH" \
    --set-metadata fork_sha="$(git rev-parse "$BASE_REF")" || {
      echo "Could not record new branch metadata." >&2
      gc runtime drain-ack
      exit 1
    }
fi
```

Existing expected refs with missing metadata are left untouched for manual
recovery rather than force-deleted.

Recording the branch early means:
- Witness can find and salvage your work if you crash
- Rejection-aware resume knows which branch to check out
- The submit step updates the metadata (branch may change after rebase)

`fork_sha` is the base commit this branch was cut from. The refinery uses it to
tell a genuine already-merged branch (>=1 commit since fork) from a starved
0-commit branch (tip still at the fork point) when both look like ancestors of
the target.

**4. Ensure clean working state:**
```bash
git status                  # Should be clean
```

**5. Run project setup (if configured):**
```bash
{{setup_command}}
```
Empty setup_command → skip.

**Exit criteria:** In your worktree, on a clean feature branch, rebased
on latest {{base_branch}}, deps installed, worktree and branch recorded
on the bead."""

[[steps]]
id = "preflight-tests"
title = "Verify pre-flights pass on base branch"
needs = ["workspace-setup"]
description = """
Check if the codebase is healthy BEFORE starting your work. Override of
mol-polecat-base `preflight-tests`: every phase runs through one gate log, and
the pack's `known-red` matcher (`assets/scripts/known-red`) reads that log
against the rig's base-red ledger. A red an open base-red bead already carries
is cited, not re-diagnosed and not re-filed (gc-cgxps).

**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**

Tests do not run here. A test red on base is attributed at self-review, which
re-runs every NEW failing test id on a detached worktree of the base (§3), so
a full test sweep of the unchanged base would repeat that work (gcp-zhbyb).

**Skip this step if resuming a rejected branch** — pre-flights were
already verified on the prior attempt. Close this step and proceed.

**1. Run pre-flights (skip empty commands silently).** Run the block below as
ONE Bash call, exactly as written. It runs the pack's gates script
(`assets/scripts/polecat-gates.sh`), which prints what §2 and §3 act on. Do not
retype the script or read it first.

A phase that an open base-red bead already covers is not re-run on base: all
that run could do is confirm a red the ledger already holds. A NEW typecheck
or lint red in that phase is still caught at self-review, which runs every
phase and re-runs each new failure on base. The skip fails closed: when
`known-red list` errors or its answer does not parse, the phase runs.

A phase is named after the formula var that holds its command: `setup`,
`typecheck`, `lint`, `build`, `test`, `affected-tests`. A configured command's
red is never filed under any other name, because the skip keys on the name: a
pytest red filed as `phase=test` would silently skip `go test` on a rig whose
test_command is `go test` (gcp-98gh).

Run it in the FOREGROUND, with the Bash tool's timeout parameter set to 3600000
(60 minutes). Do not set run_in_background and do not poll: the call returns
when every gate has finished, with the verdict. A gate prints nothing until it
ends, so a quiet wait is normal.

```bash
PG_SRC=$(gc formula list --json 2>/dev/null | jq -r '.formulas[]? | select(.name == "mol-polecat-work") | .source // empty' | head -1)
PG="${PG_SRC:+$(dirname "$(dirname "$PG_SRC")")/assets/scripts/polecat-gates.sh}"
if [ -z "$PG" ] || [ ! -f "$PG" ]; then
    echo "STOP: gates script not found (resolved '${PG:-}'); the pack is broken. Do not run gates by hand."
    gc runtime drain-ack
    exit 1
fi
PG_BASE_BRANCH='{{base_branch}}' PG_BINDING_PREFIX='{{binding_prefix}}' PG_CONVOY_ID='{{convoy_id}}' PG_TYPECHECK_COMMAND='{{typecheck_command}}' PG_LINT_COMMAND='{{lint_command}}' bash "$PG" preflight
```

**2. If pre-flights pass:** proceed. The block prints `PRE-FLIGHTS GREEN`
when `$GATE_LOG` has no `gate(...): FAIL` line. A phase it skipped as known
red does not count as a failure.

**3. If pre-flights fail on {{base_branch}}:** the end of the block has already
run `known-red match` on the log and acted on its exit code:

- **0 or 3** — every red is KNOWN. It notes the KNOWN bead ids on your work
  bead, plus, for 3, the FIXED-UPSTREAM ids the next rebase picks up. It files
  nothing.
- **1** — some red is NEW. `known-red file` records it (a new base-red bead, or
  a refreshed last-seen on a known one), and the witness NOTICE names the bead
  id it filed.
- **2** — the ledger lookup failed. Nothing is filed, and the witness NOTICE
  says "known-red lookup failed; not filed".

Every branch proceeds. Do NOT fix pre-existing failures — that's not your
assignment.

FORBIDDEN: Pushing to {{base_branch}}. FORBIDDEN: Fixing pre-existing failures.

Only when the block printed `WARN known-red not found`, file by hand as
before:

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
gc bd create --title "Pre-existing failure: <description>" --type bug --priority 1
gc mail send <rig>/witness -s "NOTICE: {{base_branch}} has failing pre-flights" \\
  -m "Filed: <bead-id>. Proceeding with $WORK_BEAD_ID."
```

**Exit criteria:** Pre-flights pass (or pre-existing bug filed), ready to implement."""

[[steps]]
id = "self-review"
title = "Self-review and run tests"
needs = ["implement"]
description = """
Review your changes and verify they work. Override of mol-polecat-base
`self-review` to support affected-test detection — when the rig configures
`affected_tests_command`, only the tests touched by your diff run, instead
of the full suite. Saves polecat time and reduces CI clog from PRs whose
locally-runnable failures should have been caught before push.

**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**
**Config: test_command = {{test_command}}**
**Config: affected_tests_command = {{affected_tests_command}}**

**1. Read back the resolved base ref, then review the diff.**

`workspace-setup` recorded the base it actually branched from as
`metadata.base_ref`. This step runs in a fresh session, so read it back
rather than assuming `origin/{{base_branch}}` exists — for a local-only
base it does not, and every command below would die on a bad revision.
If it is missing or no longer resolves, STOP: reviewing against a
guessed base reviews the wrong commit set.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
BASE_REF=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.base_ref // empty')
if [ -z "$BASE_REF" ] || ! git rev-parse --verify --quiet "$BASE_REF^{commit}" >/dev/null; then
    echo "STOP: base ref unresolved (metadata.base_ref='$BASE_REF')."
    echo "Re-run workspace-setup to resolve and record the base; do not substitute a different one."
    gc runtime drain-ack
    exit 1
fi
export BASE_REF
git diff "$BASE_REF"...HEAD
git log --oneline "$BASE_REF"..HEAD
git diff --stat "$BASE_REF"...HEAD
```

Check for: bugs, security issues, style violations, missing error handling,
debug cruft, unintended file changes. Fix anything you find.

**2. Run quality checks, then tests (skip empty commands).** One block, in ONE
shell: every check and the test run append to the same gate log, which
`known-red` reads in §3. Tests are the rig's `affected_tests_command` when it
sets one, else its `test_command` as configured (which may itself select by
diff). Each phase is named after the formula var that holds its command.

Run it in the FOREGROUND, with the Bash tool's timeout parameter set to 3600000
(60 minutes). Do not set run_in_background and do not poll: the call returns
when every gate has finished, with the verdict. A gate prints nothing until it
ends, so a quiet wait is normal.

```bash
: "${BASE_REF:?base ref not resolved — run step 1 of this step first}"
export BASE_REF
PG_SRC=$(gc formula list --json 2>/dev/null | jq -r '.formulas[]? | select(.name == "mol-polecat-work") | .source // empty' | head -1)
PG="${PG_SRC:+$(dirname "$(dirname "$PG_SRC")")/assets/scripts/polecat-gates.sh}"
if [ -z "$PG" ] || [ ! -f "$PG" ]; then
    echo "STOP: gates script not found (resolved '${PG:-}'); the pack is broken. Do not run gates by hand."
    gc runtime drain-ack
    exit 1
fi
PG_SETUP_COMMAND='{{setup_command}}' PG_TYPECHECK_COMMAND='{{typecheck_command}}' PG_LINT_COMMAND='{{lint_command}}' PG_BUILD_COMMAND='{{build_command}}' PG_TEST_COMMAND='{{test_command}}' PG_AFFECTED_TESTS_COMMAND='{{affected_tests_command}}' bash "$PG" self-review
```

**3. ALL CHECKS MUST PASS.** If your change caused the failure, fix it. A red
is only "not yours" when it is red on {{base_branch}} too, and the block above
has already asked `known-red` about every red in the log. Act on the match exit
it printed. Blocks in this section run in a fresh shell, so each one sets
`GATE_LOG` again; where one needs `KR`, paste the path the block printed after
`known-red:`.

- **0 or 3** — every red is KNOWN on {{base_branch}} (3: some are fixed
  upstream, and the refinery's rebase picks the fix up). Not yours. Name the
  KNOWN bead ids in a note on your work bead and proceed:
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
gc bd note "$WORK_BEAD_ID" --stdin <<'KNOWN_RED_NOTE'
Self-review red is KNOWN on {{base_branch}}: <the KNOWN / FIXED-UPSTREAM bead ids known-red printed>.
KNOWN_RED_NOTE
```
- **1** — some id is NEW. Re-run each NEW id on the resolved base ref
  (`metadata.base_ref`, never a guessed `origin/{{base_branch}}`), one id per
  run, in a detached worktree. The block maps the id to the narrowest
  re-run: `go:<pkg>.<Test>` runs `go test ./<pkg> -run '^<Test>$' -count=1`,
  `bats:<file>::<name>` runs `bats -f '<name>' <file>`, `pytest:<nodeid>` runs
  `python3 -m pytest '<nodeid>'`, and any other id (`raw:` included) re-runs
  that phase's whole command from the Config lines above:
```bash
ID='<one NEW id, exactly as known-red printed it>'
PHASE_CMD='<the red phase command, for an id that is not go:, bats: or pytest:>'
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
BASE_REF=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.base_ref // empty')
: "${BASE_REF:?base ref not resolved — re-run workspace-setup; do not guess a base}"
git fetch origin {{base_branch}} 2>/dev/null || true   # refreshes a remote base; a local-only base has nothing to fetch
T=$(mktemp -d "${TMPDIR:-/tmp}/base-rerun.XXXXXX")
git worktree add --detach "$T" "$BASE_REF"
case "$ID" in
go:*.Test*) GO_REST=${ID#go:}; GO_PKG=${GO_REST%%.Test*}; ( cd "$T" && go test "./$GO_PKG" -run "^${GO_REST#"$GO_PKG".}$" -count=1 ) ;;
bats:*::*) BATS_REST=${ID#bats:}; ( cd "$T" && bats -f "${BATS_REST#*::}" "${BATS_REST%%::*}" ) ;;
pytest:*) ( cd "$T" && python3 -m pytest "${ID#pytest:}" ) ;;
*) ( cd "$T" && eval "$PHASE_CMD" ) ;;
esac
echo "re-run on base exit $? for $ID"
git worktree remove --force "$T"
```
  Exit 0 means **green on base: the red is yours.** Fix it and re-run
  self-review from §2. A go re-run that printed `[no tests to run]` did not
  map the id: re-run the whole phase through `PHASE_CMD` instead. Non-zero
  means red on base; read the output to confirm it is the same failure and not
  a re-run that could not start. Once every
  NEW id that remains is red on base too, record them, then proceed:
```bash
KR='<the known-red path the §2 block printed>'
GATE_LOG="$(git rev-parse --git-dir)/self-review-gate.log"
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
"$KR" file "$GATE_LOG" --summary "<one line: what is red on {{base_branch}}>" --from "$WORK_BEAD_ID"
```
  `file` takes each id's phase from the log's gate headers. Never pass
  `--phase` for a configured command's red: the preflight skip keys on the
  phase name.
- **2, or known-red not found** — the ledger could not answer. Attribute each
  red with the same re-run on base, then file only the ones that are really
  pre-existing, by hand:
  `gc bd create --title "Pre-existing failure: <id> — <summary>" --type bug --priority 1`.

Refusing to push on local failure is a feature: a change that fails locally
fails again downstream, at the refinery gate or in CI — wasting reviewer
attention and gate time. Fix before submitting.

**4. Ensure everything is committed:**
```bash
: "${BASE_REF:?base ref not resolved — run step 1 of this step first}"
git status                  # Must be clean
git log "$BASE_REF"..HEAD --oneline  # Must show your commits
```

If uncommitted changes exist, commit them with a body explaining what
slipped through the `implement` step (typically a self-review touch-up,
test addition, or formatter run):
```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
git add -A
git commit -m "<type>: <imperative subject> ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<Explain what these residual changes are: a self-review fix,
test-only addition, formatter run, etc. Be specific.>
BODY
)"
```

NEVER discard implementation changes with `git checkout -- .`

**Exit criteria:** All checks pass (affected subset OR full suite), all
changes committed, working tree clean."""

[[steps]]
id = "submit-and-exit"
title = "Submit work to refinery and exit"
needs = ["self-review"]
description = """
Hand off your work and self-clean. You cease to exist after this step.

**0. Already-submitted guard (idempotent re-entry).**

A re-entered submit-and-exit must not re-write bead state. Step 6 sets the
assignee and clears `gc.routed_to`; run a second time on a bead the refinery
has since parked, it silently pulls that bead back out of an escalation
(gcp-rz8a). Bail out before touching anything when all three marks of a
completed handoff are present — target recorded, branch on origin at this
commit, and the bead held by the refinery itself:

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
# Resolved with the exact expression step 6 writes, so the mark this guard reads
# and the handoff it stands for can never disagree.
REFINERY_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
SUBMITTED_JSON=$(gc bd show "$WORK_BEAD_ID" --json)
SUBMITTED_TARGET=$(printf '%s' "$SUBMITTED_JSON" | jq -r '.[0].metadata.target // empty')
SUBMITTED_BRANCH=$(printf '%s' "$SUBMITTED_JSON" | jq -r '.[0].metadata.branch // empty')
SUBMITTED_ASSIGNEE=$(printf '%s' "$SUBMITTED_JSON" | jq -r '.[0].assignee // empty')
SUBMITTED_REMOTE=""
if [ -n "$SUBMITTED_BRANCH" ]; then
    SUBMITTED_REMOTE=$(git ls-remote origin "refs/heads/$SUBMITTED_BRANCH" 2>/dev/null | awk '{print $1}')
fi
if [ -n "$SUBMITTED_TARGET" ] && [ -n "$SUBMITTED_REMOTE" ] &&
   [ "$SUBMITTED_REMOTE" = "$(git rev-parse HEAD)" ] &&
   [ "$SUBMITTED_ASSIGNEE" = "$REFINERY_TARGET" ]; then
    echo "ALREADY_SUBMITTED $WORK_BEAD_ID target=$SUBMITTED_TARGET branch=$SUBMITTED_BRANCH assignee=$SUBMITTED_ASSIGNEE"
    echo "Handoff already completed. Closing this step and draining without re-writing bead state."
    STEP_BEAD_ID=$(gc hook current --id-only) || exit 1  # drain-ack gives back every claim this session still holds, so close this step first
    STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
    printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".submit-and-exit"))' >/dev/null || { echo "submit-and-exit: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
    gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=pass --status=closed || exit 1
    gc runtime drain-ack
    exit 0
fi
```

All three marks are required together on purpose. `metadata.target` alone
proves nothing — a caller may set it before dispatch to choose the base branch
— and an unassigned bead with the branch on origin is the shape a witness
salvage push leaves behind (gcp-7bo9), which is not a handoff this step
performed.

The assignee mark is an IDENTITY test against `$REFINERY_TARGET`, never
a "not this session" comparison. "Somebody who is not me" is satisfied by every third party a
work bead can end up on — an operator parking it on a crew seat, a witness
re-routing it, a reviewer taking it — and none of those is this step's handoff.
Read as evidence, they make a resuming polecat announce ALREADY_SUBMITTED and
drain while the refinery never receives the work and the branch strands on
origin unmerged (gcp-0pa4; observed live on winnow-zgr2y.8, parked on
`winnow/specialists.thomas`). The blast radius scales with parked seats holding
open beads, so the check has to name the one assignee that means "handed off"
rather than enumerate the ones that do not.

**1. Branch-shape gate (fails closed — non-negotiable).**

Before anything else, verify you are on a per-bead branch. The refinery
merges the branch recorded in your bead's `metadata.branch`, which must
follow the `polecat/<bead-id>` convention; if you push from a different
branch (your agent home branch, a stray local checkout, etc.), the
handoff contract is broken and the bead is permanently stranded as
"assigned to refinery, no merge target". See gastownhall/gascity#2082.

```bash
CONVOY_STATUS=$(gc convoy status {{convoy_id}} --json)
WORK_BEAD_ID=$(printf '%s' "$CONVOY_STATUS" | jq -r 'if (.children | length) == 1 then .children[0].id else empty end')
BASE_REF=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.base_ref // empty')
CURRENT_BRANCH=$(git branch --show-current)
EXPECTED_BRANCH="polecat/$WORK_BEAD_ID"
if [ "$CURRENT_BRANCH" != "$EXPECTED_BRANCH" ]; then
    echo "BRANCH SHAPE GATE FAILED"
    echo "  current branch:  $CURRENT_BRANCH"
    echo "  expected branch: $EXPECTED_BRANCH"
    echo ""
    echo "Refinery handoff merges metadata.branch, which must be 'polecat/<bead-id>'."
    echo "Pushing this commit and reassigning to refinery would strand the work."
    echo ""
    echo "Recover by re-running the workspace-setup step:"
    echo "  - Let workspace-setup validate or create metadata.artifact_dir"
    echo "  - Preserve the existing branch/commits; never create a worktree under the provider home"
    echo "  - Reconcile them onto '$EXPECTED_BRANCH', based on the recorded base ref '$BASE_REF'"
    echo "    (metadata.base_ref, resolved by workspace-setup — not a re-guessed base),"
    echo "    without deleting either ref"
    echo "  - Re-run submit-and-exit"
    echo ""
    echo "Do NOT proceed past this gate."
    STEP_BEAD_ID=$(gc hook current --id-only) || exit 1  # drain-ack gives back every claim this session still holds, so close this step first
    STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
    printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".submit-and-exit"))' >/dev/null || { echo "submit-and-exit: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
    gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=hard --set-metadata gc.failure_reason=branch_shape_gate --status=closed || exit 1
    gc runtime drain-ack
    exit 1
fi
```

Also confirm `metadata.branch` reflects this branch (workspace-setup
recorded it, but a divergent local state would be invisible to the
refinery without this re-check):
```bash
METADATA_BRANCH=$(gc bd show "$WORK_BEAD_ID" --json | jq -r '.[0].metadata.branch // empty')
if [ "$METADATA_BRANCH" != "$EXPECTED_BRANCH" ]; then
    gc bd update "$WORK_BEAD_ID" --set-metadata branch="$EXPECTED_BRANCH"
fi
```

**2. Final clean-state verification (safeguard):**
```bash
git status --porcelain
```
If ANY output (untracked files, uncommitted changes):
```bash
git add -A
git commit -m "chore: capture remaining work ($WORK_BEAD_ID)" -m "$(cat <<'BODY'
<Explain the remaining changes discovered by final clean-state
verification and why they are safe to hand off.>
BODY
)"
```
This is a belt-and-suspenders check — self-review should have caught this,
but we never push with untracked work left behind.

**2b. Branch-content gate (fails closed — non-negotiable).**

The branch-shape gate proves the branch is *named* right; it does not prove
it *contains* anything. A branch created at the base tip and never committed
to passes every other gate here: the name matches, the tree is clean, and
`git push` of zero commits succeeds and creates the ref, so push verification
sees origin == HEAD. The handoff is then stamped and the bead moves forward
looking like success — a phantom handoff. Only the refinery's own
no-work-on-branch check catches it, one gate slot later; without that check
it merges as a no-op and the bead closes with the work undone. An idle worker
is visible, this is not.

The predicate is deliberately commit-count-only, measured against the resolved
`$BASE_REF` tip: it catches the phantom handoff — a branch with
nothing on it — at the cheapest point, before any push. It is weaker than the
refinery's canonical `branch_has_real_change`, which also requires a non-empty
`git diff` against the merge-base and therefore additionally catches a net-zero
branch (commit plus revert). That split is intentional: the refinery stays the
backstop for net-zero work. Do not "fix" only one side of the pair.

`$BASE_REF` is the base this bead was actually branched from, read back from
`metadata.base_ref` by the branch-shape gate above — the same block this gate
already takes `$EXPECTED_BRANCH` from, so it is in scope here for exactly the
same reason. Counting against a bare `origin/{{base_branch}}` instead would
report a local-only base as an *unmeasurable* count and halt a perfectly good
branch under `content_gate_error`. An unresolved `$BASE_REF` still lands in
that same arm, so reading the resolved base fixes the false halt without
opening the gate.

`git rev-list` failing is not the same answer as "zero commits", and neither is
a licence to hand off: a count that is not a plain number halts under its own
`halt_reason=content_gate_error` rather than falling through to the push. That
is why the count is matched with `case` instead of `[ "$COMMITS_AHEAD" -eq 0 ]`,
which evaluates false — and so fails open — on an empty value.

```bash
COMMITS_AHEAD=$(git rev-list --count "$BASE_REF..HEAD" 2>/dev/null)
HALT_REASON=""
case "$COMMITS_AHEAD" in
    ''|*[!0-9]*) HALT_REASON=content_gate_error ;;
    0) HALT_REASON=no_commits ;;
esac
if [ -n "$HALT_REASON" ]; then
    echo "BRANCH CONTENT GATE FAILED ($HALT_REASON)"
    echo "  branch:  $EXPECTED_BRANCH"
    if [ "$HALT_REASON" = content_gate_error ]; then
        echo "  commits ahead of $BASE_REF: could not be measured"
        echo ""
        echo "The count could not be taken (unresolved, missing or corrupt base ref"
        echo "'$BASE_REF', a concurrent prune). A tool error is a suspect, not a licence"
        echo "to merge: an unmeasurable branch is not pushed and no handoff is stamped."
    else
        echo "  commits ahead of $BASE_REF: 0"
        echo ""
        echo "There is nothing to hand off. Do NOT push and do NOT reassign to the"
        echo "refinery — an empty branch is a phantom handoff, not a completion."
        echo ""
        echo "Uncommitted leftovers are not the cause: the clean-state check above"
        echo "already committed them. Either the work is sitting on another branch,"
        echo "or no change was produced at all."
        echo ""
        echo "If the honest answer is that no code change is warranted (an"
        echo "investigation that concluded 'no', a bead already satisfied by main),"
        echo "that is a legitimate outcome — but it is reported, not handed off."
    fi
    echo ""
    echo "The bead goes back to the pool with this halt recorded; do not re-run"
    echo "submit-and-exit from this session, whose claim is released below."
    gc bd update "$WORK_BEAD_ID" \
      --status=open --assignee="" \
      --set-metadata gc.routed_to="" \
      --set-metadata halt_reason="$HALT_REASON" \
      --append-notes "Halted at submit ($HALT_REASON): no handoff stamped.
$(cat <<'BODY'
<State what you investigated and why no code change is warranted, what blocked
you from producing one, or — for content_gate_error — what left the branch
unmeasurable. A coordinator reads this to decide next steps.>
BODY
)"
    for ESCALATE_TARGET in mayor "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness"; do
      gc session nudge "$ESCALATE_TARGET" "POLECAT HANDOFF HALT ($HALT_REASON): $WORK_BEAD_ID on $EXPECTED_BRANCH — no handoff stamped; bead returned to the pool open and unassigned. Needs a coordinator decision." \
        || echo "WARNING: could not nudge $ESCALATE_TARGET about $WORK_BEAD_ID; escalate by hand."
    done
    STEP_BEAD_ID=$(gc hook current --id-only) || exit 1  # drain-ack gives back every claim this session still holds, so close this step first
    STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
    printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".submit-and-exit"))' >/dev/null || { echo "submit-and-exit: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
    gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=hard --set-metadata gc.failure_reason="$HALT_REASON" --status=closed || exit 1
    gc runtime drain-ack
    exit 1
fi
```

The halt parks the bead `open` + unassigned + unrouted, which no dispatcher
tier serves and which witness orphan recovery skips (it filters for beads that
*have* an assignee). Left at that, this gate would silently displace the
refinery's `halt_false_completion`, which escalates the same failure class to
mayor and witness. The nudges above keep that escalation, so moving the catch
one gate earlier does not make it quieter.

**3. Push gate — FAIL CLOSED, then push:**

Absent metadata is not consent. A rail expressed only in prose is enforced by
nothing: a bead whose DESCRIPTION says "no push — the mayor publishes" but
which carries no `auto_push` key used to fall straight through to `git push`,
because an absent key yielded the empty string and the empty string is not
`"false"`. Two of the affected rigs are customer repos, and an unintended push
to a customer repo has already caused an unintended prod deploy once. So the
gate reads the bead's prose as well as its metadata, and halts rather than
guess.

The metadata itself is read through a shape-normalising probe, because the one
thing worse than an unenforced rail is a *recorded* rail the gate silently
fails to read: `jq`'s `has()` errors on a string, so on a ledger that serves
`metadata` as a JSON string the explicit `auto_push=false` opt-out used to
evaluate to the empty string and the bead was pushed (gci-to0l). Object, null
and JSON-string payloads are all read; anything else halts.

The `auto_push` VOCABULARY is closed and case-folded: `false`/`no`/`0` are the
opt-out, `true`/`yes`/`1` are consent, a key present with a JSON `null` value is
"nothing recorded". Anything else is an unreadable decision, not consent — the
key is hand-written by humans following the mayor prompt, and reading `False`
or `no` as "push" would fail open on exactly the beads that tried hardest to
say no.

Five outcomes, evaluated in order:

| `auto_push` | Bead prose | Outcome |
|---|---|---|
| unreadable payload, or a value outside the vocabulary | not read | halt at branch-ready **and escalate** — a decision that cannot be read or understood cannot be shown to lack the opt-out |
| `false`, `no`, `0` (any case) | not read | halt at branch-ready — the explicit opt-out |
| absent, or present with a null value | asserts a no-push rail | halt at branch-ready **and escalate** — ambiguous, a human owns the call |
| absent, or present with a null value | no rail | push + refinery handoff — the normal path |
| `true`, `yes`, `1` (any case) | not read | push + refinery handoff — explicit consent |

Run the block below as ONE Bash call, exactly as written. It runs the pack's
submit script (`assets/scripts/polecat-submit.sh push-gate`), which reads the
bead, applies the five outcomes above in that order, and only then pushes and
verifies the push. Do not retype the script or read it first.

```bash
PS_SRC=$(gc formula list --json 2>/dev/null | jq -r '.formulas[]? | select(.name == "mol-polecat-work") | .source // empty' | head -1)
PS="${PS_SRC:+$(dirname "$(dirname "$PS_SRC")")/assets/scripts/polecat-submit.sh}"
if [ -z "$PS" ] || [ ! -f "$PS" ]; then
    echo "STOP: submit script not found (resolved '${PS:-}'); the pack is broken. Do not push or hand off by hand."
    STEP_BEAD_ID=$(gc hook current --id-only) || exit 1  # drain-ack gives back every claim this session still holds, so close this step first
    STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
    printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".submit-and-exit"))' >/dev/null || { echo "submit-and-exit: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
    gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=hard --set-metadata gc.failure_reason=submit_script_missing --status=closed || exit 1
    gc runtime drain-ack
    exit 1
fi
PS_CONVOY_ID='{{convoy_id}}' PS_BASE_BRANCH='{{base_branch}}' PS_BINDING_PREFIX='{{binding_prefix}}' bash "$PS" push-gate
```

**4. Clean up local branch (prevent stale branch accumulation):**
```bash
BRANCH=$(git branch --show-current)
git checkout --detach                 # Detach so we can delete the branch
git branch -D "$BRANCH"              # Branch is pushed; refinery owns it now
```

**5. Update metadata on the work bead:**
```bash
# --append-notes, NEVER --notes — see the note under this block.
gc bd update "$WORK_BEAD_ID" \
  --set-metadata target={{base_branch}} \
  --set-metadata handoff_stage=target_recorded \
  --unset-metadata artifact_source_sha \
  --unset-metadata artifact_cleanup_state \
  --append-notes "Implemented: <brief summary>"
```
Branch was recorded in workspace-setup and is already in metadata.
This adds the target for the refinery and clears any pre-rebase artifact proof
left by a rejected refinery attempt; refinery captures the freshly-published
source SHA on its next handoff. If an existing pull request was provided by
the caller, `metadata.existing_pr` is preserved for refinery validation. The
refinery records canonical `pr_url` only after verifying the PR is open and
matches the branch, base, and origin repository.

**Every `gc bd update` call in this step uses `--append-notes`. Never use
`--notes`.** The two flags do not differ in emphasis: `--notes` REPLACES the
whole notes field, `--append-notes` appends to it with a newline separator. The
bead you are finishing is not yours — it carries the requester's instructions,
and on a rig it may carry an operator's hold or a prior polecat's handover. A
closing note written with `--notes` deletes all of it, in one call, with no
warning and no diff. That is bead-history destruction by the normal happy path,
which is why it went unnoticed twice.

The rule binds the two halt writes in item 3 hardest, not least. Both of them
tell the reader to go and act on what the bead says — the ambiguity halt asks
whoever owns the rail to resolve a rail that is, in the usual case, written in
the very notes a bare `--notes` would have just deleted. The identity-stamped
bead record is also the city's anchor against nudge-text spoofing, so a rail
that silently erases it is a P1, not a formatting nit. The same rule holds
anywhere a formula writes a note onto a bead it did not create: append.

`handoff_stage=target_recorded` is the stage marker the witness's Step 3a
uses to recognize a polecat that crashed between this step and step 6 and to
complete the handoff instead of respinning the work. It must be written here
and nowhere else: `target` cannot carry that meaning because `gc sling`
accepts it as a mint-time input, nothing ever unsets it, and it survives
refinery rejection. Every path that invalidates "step 5 completed" clears the
marker — `workspace-setup` on each fresh attempt, and both `mol-refinery-patrol`
rejection paths. Every branch-ready halt in the push gate above
(`auto_push_false`, `metadata_unreadable`, `no_push_rail_unresolved`) returns
before this step, as do the push-failure paths, so an unpushed branch never
carries the marker.

**6. Reassign to refinery:**

Run the block below as ONE Bash call, exactly as written. It runs the pack's
submit script (`assets/scripts/polecat-submit.sh reassign`), which refuses to
touch a bead routed to `human`, then hands the work bead to the refinery in one
write. Do not retype the script or read it first.

```bash
PS_SRC=$(gc formula list --json 2>/dev/null | jq -r '.formulas[]? | select(.name == "mol-polecat-work") | .source // empty' | head -1)
PS="${PS_SRC:+$(dirname "$(dirname "$PS_SRC")")/assets/scripts/polecat-submit.sh}"
if [ -z "$PS" ] || [ ! -f "$PS" ]; then
    echo "STOP: submit script not found (resolved '${PS:-}'); the pack is broken. Do not hand off by hand."
    STEP_BEAD_ID=$(gc hook current --id-only) || exit 1  # drain-ack gives back every claim this session still holds, so close this step first
    STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
    printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".submit-and-exit"))' >/dev/null || { echo "submit-and-exit: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
    gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=fail --set-metadata gc.failure_class=hard --set-metadata gc.failure_reason=submit_script_missing --status=closed || exit 1
    gc runtime drain-ack
    exit 1
fi
PS_CONVOY_ID='{{convoy_id}}' PS_BINDING_PREFIX='{{binding_prefix}}' bash "$PS" reassign
```

`${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery` resolves to
`$GC_RIG/{{binding_prefix}}refinery` when running inside a rig session,
or `{{binding_prefix}}refinery` when running in an HQ-only city where
the workspace is the rig. Writing a rendered empty rig prefix produces
`/{{binding_prefix}}refinery` and strands beads outside the refinery pool.

Set `assignee` to the configured refinery named-session identity and clear
`gc.routed_to` because the direct assignment is the handoff. Generic pool
demand is represented by unassigned work with `gc.routed_to=<target>`, so
named-session work should not retain pool-demand metadata.

If step 6 prints `HANDOFF_FAILED`, stop there: do not run steps 7 and 8, do not
drain-ack, and escalate as it says. The write was refused, so the bead is still
held where it was and the refinery has not been told.

The refinery will pick this up, rebase onto {{base_branch}}, run tests,
merge, and close the bead. If there's a conflict, the refinery puts the
bead back in the pool with `rejection_reason` metadata — a new polecat
picks it up and resumes from the existing branch.

**7. Signal refinery to check for work immediately (belt-and-suspenders):**
```bash
REFINERY_TARGET="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
gc session wake "$REFINERY_TARGET" || true
gc session nudge "$REFINERY_TARGET" "Run 'gc prime' to check merge queue and begin processing." || true
```

The `gc bd update` in step 6 generates a `bead.updated` event the refinery's
event-watch will see, but that can take up to `event_timeout` seconds. Wake
starts a stopped on_demand session; nudge leaves a visible prompt for a running
one as soon as it is ready for input. Failure is non-fatal: the refinery finds
the work on its next poll.

**8. Signal reconciler and exit.**
```bash
STEP_BEAD_ID=$(gc hook current --id-only) || exit 1  # drain-ack gives back every claim this session still holds, so close this step first
STEP_BEAD=$(gc bd show "$STEP_BEAD_ID" --json) || exit 1
printf '%s' "$STEP_BEAD" | jq -e '(if type == "array" then .[0] else . end) | .status == "in_progress" and ((.metadata["gc.step_ref"] // "") | endswith(".submit-and-exit"))' >/dev/null || { echo "submit-and-exit: current claim $STEP_BEAD_ID is not this in-progress step; not acknowledging drain" >&2; exit 1; }
gc bd update "$STEP_BEAD_ID" --set-metadata gc.outcome=pass --status=closed || exit 1
gc runtime drain-ack
exit
```

`gc runtime drain-ack` tells the reconciler to kill this session. The
reconciler only restarts you if the pool check command finds more work.
You are GONE. Done means gone. There is no idle state.

**Exit criteria:** Branch pushed, metadata set, bead reassigned, refinery signaled, this step closed, drain acknowledged, session exited."""
