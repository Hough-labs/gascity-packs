description = """
Refinery patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}}
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check for work, merge one branch, pour
the next iteration. On crash, re-read the formula steps and determine
where you left off from context (git state, bead state, last action).

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: every exit path (happy or early) pours the next
wisp before burning this one. The prompt only bootstraps the first wisp.

Work beads flow directly: pool → polecat → refinery → closed.
No separate MR beads. The polecat sets metadata (branch, target) on
the work bead and assigns it to the refinery. On rejection, the
refinery puts the bead back in the pool with rejection metadata.

Merge strategy is per-work-bead metadata:
- `direct` (default): fast-forward merge to target and push
- `mr` / `pr`: publish a GitHub pull request instead of landing directly

In `mr` mode, PR publication is not completion. Refinery records the
verified PR identity and head on the work bead, then leaves the bead
blocked until the PR is merged. Each patrol reconciles one pending PR
and closes its bead only after the merge commit is verified on the
recorded target branch. This preserves dependency ordering: downstream
beads cannot become ready against code that has not landed.

Rigs that require review set `require_merge_approval = "true"` in their
`formula_vars`. That promotes `direct` to `mr` and turns PR publication into
the start of review rather than the handoff: nothing lands until a reviewer
records an approval signal on the work bead naming the PR and the exact head
SHA. See the merge-push step for the full lane. Default is off, so rigs that
do not require review behave exactly as before.

Read each step's description before acting — Config values override defaults."""
formula = "mol-refinery-patrol"

[requires]
formula_compiler = ">=2.0.0"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.run_tests]
description = "Whether to run tests before merging"
default = "true"

[vars.setup_command]
description = "Setup/install command (e.g., pnpm install). Empty = skip."
default = ""

[vars.typecheck_command]
description = "Type check command (e.g., tsc --noEmit). Empty = skip."
default = ""

[vars.lint_command]
description = "Lint command (e.g., eslint .). Empty = skip."
default = ""

[vars.test_command]
description = "Test command to run (if run_tests is true)"
default = ""

[vars.build_command]
description = "Build command (e.g., go build ./...). Empty = skip."
default = ""

[vars.target_branch]
description = "Default target branch for merges"
default = "main"

[vars.delete_merged_branches]
description = "Deprecated compatibility setting; successful artifact handoffs retain source branches for recovery"
default = "true"

[vars.require_merge_approval]
description = """
Opt-in review gate. When true, no branch lands without a gc-native approval
signal on the work bead naming this PR and the exact head SHA the reviewer
read (see the merge-push step). Default false, so rigs that do not require
review are unaffected. Set it in the rig's `formula_vars`. Turning it on
implies the pull-request lane: a reviewed merge needs a PR to review, so
merge_strategy=direct is promoted to mr."""
default = "false"

[vars.review_agent]
description = """
Optional agent address to nudge when the approval gate parks a bead awaiting
review, e.g. `specialists.iris`. A bare name is tried rig-scoped first and then
town-level, so both a rig-local reviewer and a town agent such as
`gastown.mayor` are reachable without the operator having to know which scope
owns the session. Write `rig/agent` to pin another rig, or a leading `/`
(`/gastown.mayor`) to force town-level and skip the rig attempt. Empty = no
nudge, and the reviewer is expected to find the parked bead another way.
From rig `formula_vars`."""
default = ""

[vars.integration_branch_auto_land]
description = "Auto-create work beads to land completed integration branches"
default = "false"

[vars.event_timeout]
description = "Seconds to sleep before re-checking for work. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[vars.restart_after_iterations]
description = """
Patrol iterations one conversation completes before check-inbox requests a
restart at the clean seam. 2 fits the refinery's 200k window: a conversation
starts at ~64k and grows ~55k per bead. 1 restarts after every bead; 0 disables
the counter. A non-integer value is treated as 0 with a WARN line. Inert under
wake_mode = "fresh": the controller already starts a new conversation after
every burn, so the count never passes 1."""
default = "2"

[[steps]]
id = "validate-identity"
title = "Validate canonical agent identity"
description = """
**Fail fast if `$GC_AGENT` is not set.**

The refinery uses `$GC_AGENT` (not `$GC_ALIAS`) as its canonical mailbox
identity. The session harness
(`internal/session/lifecycle.go:RuntimeEnvWithSessionContext`) guarantees
`$GC_AGENT` is populated for every live session — it falls back to the
session name when the alias is empty. `$GC_ALIAS` can legitimately be
empty, which is how a refinery once self-polled for 13h42m with seven
queued beads while looking healthy-idle (upstream #1833).

Verify at startup:
```bash
if [ -z "${GC_AGENT:-}" ]; then
    echo "GC_AGENT is empty — session harness did not inject the canonical identity."
    echo "Refusing to self-poll with an empty filter; escalate before proceeding."
    gc mail send mayor/ -s "ESCALATION: refinery started with empty GC_AGENT [HIGH]" \\
        -m "Session has no canonical agent identity. Investigate session harness."
    gc runtime drain-ack
    exit 1
fi
```

Close this step only when `$GC_AGENT` is confirmed non-empty."""

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
needs = ["validate-identity"]
description = """
**1. Context check (FIRST — before any work):**

Run the restart cadence check first. It counts the patrol iterations this
conversation has already completed and prints exactly one verdict line:
```bash
# --- restart-cadence-check:begin ---
# The count rides the wisp chain. Every successor wisp poured without a restart
# is stamped with this conversation's GC_CONTINUATION_EPOCH and the running
# iteration count (see the session-iteration-stamp blocks). gc bumps the epoch
# exactly when the conversation is reset, and keeps it across a resume wake, so
# a wisp stamped under another epoch was poured by an earlier conversation and
# this one has completed none yet.
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=open,in_progress --type=molecule --include-infra --limit=0 --json | jq -r '.[0].id // empty')
fi
CADENCE_N="{{restart_after_iterations}}"
case "$CADENCE_N" in
  ''|*[!0-9]*)
    echo "WARN: restart_after_iterations='$CADENCE_N' is not a non-negative integer; treating it as 0."
    CADENCE_N=0
    ;;
esac
CADENCE_EPOCH=${GC_CONTINUATION_EPOCH:-}
if [ "$CADENCE_N" -eq 0 ]; then
  echo "restart cadence: off (restart_after_iterations=0)"
elif [ -z "$CADENCE_EPOCH" ]; then
  echo "restart cadence: off (GC_CONTINUATION_EPOCH is unset, so this conversation cannot be told from the last)"
elif [ -z "$CURRENT_WISP" ]; then
  echo "restart cadence: off (could not resolve the current refinery wisp)"
elif ! CADENCE_JSON=$(gc bd show "$CURRENT_WISP" --json 2>/dev/null); then
  echo "restart cadence: off (could not read $CURRENT_WISP)"
else
  CADENCE_STAMPED_EPOCH=$(printf '%s' "$CADENCE_JSON" | jq -r '.[0].metadata.session_epoch // empty' 2>/dev/null)
  CADENCE_K=$(printf '%s' "$CADENCE_JSON" | jq -r '.[0].metadata.session_iterations // empty' 2>/dev/null)
  case "$CADENCE_K" in ''|*[!0-9]*) CADENCE_K=0 ;; esac
  if [ "$CADENCE_STAMPED_EPOCH" != "$CADENCE_EPOCH" ]; then
    CADENCE_K=0
  fi
  if [ "$CADENCE_K" -ge "$CADENCE_N" ]; then
    echo "RESTART DUE: $CADENCE_K iterations in conversation epoch $CADENCE_EPOCH (restart_after_iterations=$CADENCE_N)"
  else
    echo "restart cadence: $CADENCE_K/$CADENCE_N in epoch $CADENCE_EPOCH"
  fi
fi
# --- restart-cadence-check:end ---
```

Then pour and assign the next wisp, burn the current wisp, and request a
restart with the block below when ANY of these holds:
- the cadence check printed `RESTART DUE`;
- gc's context advisory has told this session to plan a handoff;
- context feels heavy (multi-hour session, large recent diffs, or you notice
  yourself taking shortcuts or summarizing prematurely).

Otherwise skip the block and go to step 2.
```bash
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=open,in_progress --type=molecule --include-infra --limit=0 --json | jq -r '.[0].id // empty')
fi
if [ -z "$CURRENT_WISP" ]; then
  echo "ERROR: could not resolve the current refinery wisp: GC_BEAD_ID is unset and no open/in_progress patrol wisp is assigned to $GC_AGENT."
  echo "ERROR: refusing to continue. With CURRENT_WISP empty this cycle would pour a successor and never burn the wisp it is running, leaking one wisp every cycle, while every command still exits 0."
  gc runtime drain-ack
  exit 1
fi
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next refinery wisp; not requesting restart."
  gc runtime drain-ack
  exit 1
fi
if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
  echo "Could not assign next refinery wisp; not requesting restart."
  gc runtime drain-ack
  exit 1
fi
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "ERROR: could not resolve the current refinery wisp; not requesting restart. The patrol loop cannot advance — this wisp leaks and no successor runs."
  gc runtime drain-ack
  exit 1
fi
gc runtime request-restart
RESTART_STATUS=$?
echo "Restart request returned with status $RESTART_STATUS; stop this session now."
exit "$RESTART_STATUS"
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks until the
controller stops this session; on controller fault it can return nonzero after
a bounded timeout. If the command returns for any reason, stop immediately. Do
not check mail, close this step, or process merge work from this old session
after burning the current wisp. On the normal path, the controller kills and
restarts the session on the next reconcile tick. The new session wakes on the
wisp you just assigned and re-reads formula steps with fresh context.

**2. Check mail:**
```bash
gc mail inbox
```

Archive a message once you have handled it, or once what it asks for is
represented by durable tracked work — a bead, or a line in your standing
instructions. Never archive to clear a count. Anything still owed becomes a
bead, or goes back in your inbox with `gc mail mark-unread <id>`:
`gc mail inbox` lists unread mail only, so a message left read and open is
not listed again. Note any context relevant to upcoming merge work: a
priority override or hold request you intend to honor on a later cycle is
exactly the case that needs a bead rather than an archive.

Close this step and proceed."""

[[steps]]
id = "find-work"
title = "Find next work bead assigned to me or wait"
needs = ["check-inbox"]
description = """
**Config: event_timeout = {{event_timeout}}**

Every time this open step is entered or re-entered after an idle wake, first
reconcile the least-recently-checked `merge_strategy=mr` handoff in this rig:

```bash
if ! gc gastown pr-merge-reconcile; then
  echo "Pending PR reconciliation failed safely; its work bead remains blocked."
fi
```

The command handles at most one reconciliation marker per work scan:

- an unchanged open PR stays blocked;
- any handoff owned by an earlier refinery session is adopted to `$GC_AGENT`;
- an interrupted open record with complete `pull_request_pending` metadata
  finishes its blocked dependency gate before lookup;
- an incomplete open record clears stale partial PR evidence and its retry
  marker, retains the validated `existing_pr` reuse hint, then returns to this
  refinery for full validation without removing work or artifacts;
- an open PR whose head changed is reopened and assigned to this refinery so
  its quality gates run again, with the marker cleared in the same transition;
- before lookup, blocked records must be exact `pull_request_pending`, or
  complete `mr_merged` evidence retained after a verified close failure;
  unknown, incomplete, obsolete, or contradictory lifecycle states are
  quarantined and escalated;
- a merged PR closes its work bead only after the recorded head matches and
  the merge commit is reachable from the recorded `origin/<target>`;
- a closed-unmerged PR, contradictory metadata, or a merged unvalidated head
  stays blocked and is escalated to mayor.

A lookup or fetch failure is retryable and never closes the work bead. Do not
manually close a pending PR bead because reconciliation was unavailable.

Next, before looking for new work, retry at most one closed artifact whose
durable cleanup marker is still pending. This closes the crash window after the
merge or bead close but before the immediate cleanup command:

```bash
if ! gc gastown task-artifact-cleanup; then
  echo "Pending task-artifact cleanup failed safely; the worktree was preserved for retry or inspection."
fi
```

Search for work beads assigned to you — unclaimed, or already claimed by you —
then for work merely routed to you:
```bash
# --- find-work-query:begin ---
REFINERY_SELF="${GC_RIG:+$GC_RIG/}{{binding_prefix}}refinery"
WORK=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --assignee=$GC_AGENT --status=open,in_progress \
  --exclude-type=epic --has-metadata-key=branch --limit=0 --json |
  jq -r 'sort_by(.priority, (.metadata.first_submitted_at // .created_at)) | .[0].id // empty')
if [ -z "$WORK" ]; then
  ROUTED=$(gc bd list ${GC_RIG:+--rig="$GC_RIG"} --no-assignee --status=open,in_progress \
    --exclude-type=epic --has-metadata-key=branch \
    --metadata-field gc.routed_to="$REFINERY_SELF" --limit=0 --json |
    jq -r 'sort_by(.priority, (.metadata.first_submitted_at // .created_at)) | .[0].id // empty')
  if [ -n "$ROUTED" ]; then
    gc bd update "$ROUTED" --assignee="$GC_AGENT" --status=in_progress \
      --set-metadata gc.routed_to=""
    CLAIMED=$(gc bd show "$ROUTED" --json | jq -r '.[0].assignee // empty')
    if [ "$CLAIMED" = "$GC_AGENT" ]; then
      WORK=$ROUTED
    else
      echo "SKIP $ROUTED: routed to me, but the claim read back as '$CLAIMED'. Not mine; leaving it."
    fi
  fi
fi
# --- find-work-query:end ---
```

`${GC_RIG:+--rig="$GC_RIG"}` scopes the query to this refinery's rig
database. Without it, `gc bd list` routes to the HQ database and never
sees rig-scoped work beads — the `assignee` field alone does not route
by namespace. For HQ-only refineries `$GC_RIG` is empty and the flag
expands to nothing.

**Order: priority first, then earliest first handoff (gcp-et7g).** Each query
fetches every candidate (`--limit=0`) and picks in jq, never `--limit=1`. The
store's default order is priority ascending, then created_at DESCENDING, so a
server-side limit of one serves every priority band newest-first and old merge
requests starve while new same-priority work keeps arriving (winnow, 2026-09-24:
47 same-band overtakes, one bead waited ~9h). `--sort` cannot fix it: it takes a
single key, and every single key drops priority. `first_submitted_at` is
stamped by the polecat's refinery handoff and kept across rejections, so a
resubmitted bead goes back to its original place in line rather than the back
of the band. A bead handed over without the stamp — before the stamp existed,
or by hand — falls back to `created_at`.

`--status=open,in_progress` is what makes this query survive its own claim.
Claiming a bead moves it to `in_progress`, so a filter of `open` alone can
never see the work this patrol just took: the bead strands in `in_progress`
with its branch metadata intact and nothing merged, while this step truthfully
reports an empty queue. It is a leak with a rate — one stranded bead per
claim, in every rig running this pack (measured in a production rig: the
stranded count went 1 -> 2 in 30 minutes, with `--status=open` returning
nothing the whole time and the branches provably unmerged rather than lost).

Both statuses stay narrowed by `--assignee=$GC_AGENT`, so this widens the
query to *your own* claims only — it never picks up another agent's in-flight
work. Wisp roots are `ephemeral=true` and this query does not pass
`--include-infra`, so widening the status cannot make the refinery adopt its
own patrol wisp. Use the comma-separated form: repeating `-s/--status`
silently overwrites the previous value instead of unioning them.

Re-finding your own claim is the intended resume path, not a duplicate: a bead
you claimed but did not land is unfinished work, and the merge-state gate in
merge-push already closes it as `already_merged` if a previous pass landed it.

**The second query — `gc.routed_to=<self>` with no assignee (gcp-mi9t).** A
bead carrying `gc.routed_to=<rig>/{{binding_prefix}}refinery` and no assignee
is real merge work that the assignee scan cannot see, and nothing else in the
town converts it. For a POOL role that shape is correct and self-healing: the
supervisor's scale check spawns a claimer, which assigns the bead to itself.
The refinery is a singleton patrol with no such path, so a routed-unassigned
bead sits until a human names its id in a nudge (observed: th-lm5n ~72min,
th-albz ~31min — rescued by hand, which is not a mechanism). This query is
that missing conversion.

It is deliberately narrow, because a widened find-work scan is how a merge
queue starts stealing live work:

- **`--no-assignee`.** A bead routed to the refinery but assigned to somebody
  else — an operator parking it, a polecat mid-implementation — is not yours.
  The assignee field, not the routing hint, decides ownership.
- **It runs only when the assignee scan came back empty.** Assigned work
  always wins, and the common path pays no extra query.
- **The claim is verified by read-back, not assumed.** The write is followed
  by a `gc bd show` that must report `$GC_AGENT`; anything else means another
  writer got there first and the candidate is dropped for this pass, not
  merged.

**Claim by writing `--assignee="$GC_AGENT"`, NOT with the `--claim` flag.**
`gc bd update --claim` sets the assignee to `$BEADS_ACTOR`, which is the runtime *session
name* (`gastown__refinery-gc-xxxx`), not the canonical role identity every
other query in this formula and in the refinery prompt scans on. Claiming that
way would hand the bead an assignee the primary query above cannot match, so a
crash mid-merge would re-hide the bead behind a dead session's name — the exact
invisibility this step exists to remove. Clearing `gc.routed_to` in the same
write completes the conversion: the bead is now assigned work, and the routed
scan must not keep offering it.

If found: read the bead metadata to confirm it has a branch:
```bash
gc bd show $WORK --json | jq '.[0].metadata'
```
The bead MUST have `metadata.branch`. If `metadata.target` is missing,
use {{target_branch}} as default. Note the work bead ID and close this step.

If NO work found:
Write exactly:
```
IDLE: no work, exiting turn.
```
Then stop immediately. Do NOT sleep, call ScheduleWakeup, or use Monitor.
The session_sleep policy will restart this session after the configured idle interval.
When restarted, re-read formula steps — this step stays open until a work bead is found.

**Do not close this step until you have a work bead with branch metadata.**"""

[[steps]]
id = "rebase"
title = "Rebase branch on target"
needs = ["find-work"]
description = """
**Config: target_branch = {{target_branch}}**

Read the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

Before any rebase can rewrite the source branch, durably capture the
published pre-rebase source SHA as task-artifact cleanup proof and arm the
cleanup retry marker. This is a separate block from the rebase guard below:
it mutates only the artifact-proof metadata, and a STOP here happens before
any branch is materialized.
```bash
REFINERY_WORK_JSON=$(gc bd show "$WORK" --json) || {
  echo "Cannot read work metadata before capturing artifact cleanup proof. STOP."
  gc runtime drain-ack
  exit 1
}
REFINERY_WORK_META=$(printf '%s' "$REFINERY_WORK_JSON" | jq -ce '
  if type == "array" and length == 1 and (.[0] | type) == "object" and
     ((.[0].metadata // {}) | type) == "object"
  then .[0].metadata // {}
  else error("expected exactly one work bead object")
  end
') || {
  echo "Invalid work metadata response; refusing to overwrite artifact cleanup proof. STOP."
  gc runtime drain-ack
  exit 1
}
ARTIFACT_SOURCE_SHA=$(printf '%s' "$REFINERY_WORK_META" |
  jq -r '.artifact_source_sha // empty')
ARTIFACT_CLEANUP_STATE=$(printf '%s' "$REFINERY_WORK_META" |
  jq -r '.artifact_cleanup_state // empty')
if [ -z "$ARTIFACT_SOURCE_SHA" ]; then
  if ! git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
    echo "Cannot refresh origin/$BRANCH to capture artifact cleanup proof. STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
  fi
  ARTIFACT_SOURCE_SHA=$(git rev-parse --verify "refs/remotes/origin/$BRANCH^{commit}") || {
    echo "Cannot capture the published source SHA for artifact cleanup. STOP."
    gc runtime drain-ack
    exit 1
  }
  gc bd update "$WORK" \
    --set-metadata artifact_source_sha="$ARTIFACT_SOURCE_SHA" \
    --set-metadata artifact_cleanup_state=pending || {
      echo "Cannot durably record the pre-rebase source SHA. STOP."
      gc runtime drain-ack
      exit 1
    }
elif [ "$ARTIFACT_CLEANUP_STATE" != pending ]; then
  gc bd update "$WORK" \
    --set-metadata artifact_cleanup_state=pending || {
      echo "Cannot arm the artifact cleanup retry marker. STOP."
      gc runtime drain-ack
      exit 1
    }
fi
```

Do not overwrite an existing `artifact_source_sha` on a retry: MR mode may
already have rewritten the remote branch before a refinery restart, while the
original artifact still correctly points at the first captured SHA. A polecat
returning from a rejected attempt clears this proof during its next successful
submission, so the next refinery handoff captures a fresh value.

Fetch and attempt mechanical rebase. Confirm the target resolves on
origin *before* rebasing: `git rebase` reports a missing upstream with the
same non-zero exit as a conflict, and the rejection path below would then
delete the workflow, reopen the bead, and bounce a configuration error
back to a polecat that hits the same wall. A target that does not exist
on origin is not a conflict, and no polecat can resolve it — park the bead
for a human, escalate, and keep the patrol running. Parking is the part
that makes the halt safe: `find-work` selects open beads assigned to this
refinery that carry `metadata.branch`, so a bead left assigned here is
re-selected on the next cycle and one misconfigured `target` head-of-line
blocks every other merge in the rig. Same shape as `block_existing_pr` in
the merge step — the other invalid-configuration halt in this formula.
The same block also decides whether a rebase is needed at all: when
`origin/$TARGET` is already an ancestor of `origin/$BRANCH`, the source is a
pure fast-forward candidate and rebasing it would only destroy merge topology.
Run this block as one script that shares shell state: the probe's status is
captured into `ANCESTOR_RC` on the very next line, so a split at the probe reads
`0` in a fresh shell and fires the skip arm on a genuinely diverged source, and
every STOP arm's `exit` must end the step.
```bash
git fetch --prune origin
if ! git show-ref --verify --quiet "refs/remotes/origin/$TARGET"; then
  REASON="Target branch $TARGET does not exist on origin; there is nothing to rebase onto. This is an invalid upstream, not a merge conflict, so the rejection path is wrong: no polecat can rebase onto a branch that is not there. Fix metadata.target on $WORK, or push $TARGET, then route the bead back to the refinery."
  echo "STOP: $REASON"
  # Take the bead out of find-work's candidate set. Clearing the assignee is
  # what deselects it; gc.routed_to=human is what keeps it inside a
  # work-query tier instead of stranding it open+unassigned+unrouted. The
  # branch, metadata.branch, and metadata.target are all left untouched —
  # this is not the destructive delete-source/reopen-source path.
  gc bd update $WORK \
    --assignee="" \
    --set-metadata merge_result=blocked \
    --set-metadata gc.routed_to=human \
    --set-metadata halt_reason=target_branch_missing \
    --set-metadata blocked_reason="$REASON"
  gc mail send mayor/ -s "ESCALATION: invalid target branch for $WORK" -m "$REASON
Work bead: $WORK
Branch: $BRANCH
Target: $TARGET"
  # Pour the next patrol iteration before burning this one: a halt on one
  # bead must not end the merge lane.
  CURRENT_WISP=${GC_BEAD_ID:-}
  if [ -z "$CURRENT_WISP" ]; then
    CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=in_progress --type=molecule --limit=1 --json | jq -r '.[0].id // empty')
  fi
  NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
  if [ -z "$NEXT" ]; then
    echo "Could not pour next refinery wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  if ! gc bd update "$NEXT" --assignee="$GC_AGENT"; then
    echo "Could not assign next refinery wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  if [ -n "$CURRENT_WISP" ]; then
    gc bd mol burn "$CURRENT_WISP" --force
  else
    echo "Could not resolve current wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  gc runtime drain-ack
  exit 1
fi
# Guarded ancestry decision (issue 374). Pin exactly the two tracking refs the
# decision reads: the prune fetch above is best-effort with an unchecked exit,
# and a decision read off stale refs would skip (or force) a rebase the source
# does not need. Refspecs deliberately unbraced — string-distinct from the
# braced merge-push fetch so the inference-gate pin witnesses this site
# uniquely. Fail closed here: no probe, no rebase, no bead mutation.
if ! git fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" "+refs/heads/$TARGET:refs/remotes/origin/$TARGET"; then
  echo "git fetch of $BRANCH/$TARGET tracking refs failed (unreachable origin or missing branch); cannot evaluate rebase ancestry. STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi
# Already-based source (origin/$TARGET an ancestor of origin/$BRANCH) is a pure
# fast-forward candidate: rebasing it drops merge commits and their recorded
# conflict resolutions — artificial conflicts on an unchanged SHA (the
# rejection treadmill) or silent flattening that merge-push then force-pushes
# over the source branch. Probe BEFORE any branch exists so every STOP leaves
# the worktree clean for the next patrol cycle.
git merge-base --is-ancestor "origin/$TARGET" "origin/$BRANCH"
ANCESTOR_RC=$?
case "$ANCESTOR_RC" in
  0)
    # The materialization itself is exit-checked: over a stranded `temp` (the
    # pre-existing merge-push STOP wedge) this checkout fails, and proceeding
    # would mis-report a skip while downstream consumes the stale branch.
    if ! git checkout -b temp origin/$BRANCH; then
      echo "cannot materialize temp at origin/$BRANCH for the skip path (a stale temp branch may be stranded from a previous merge-push STOP). STOP. Do not mutate bead state."
      gc runtime drain-ack
      exit 1
    fi
    echo "SKIP-REBASE: origin/$TARGET ($(git rev-parse --short "origin/$TARGET")) is already an ancestor of origin/$BRANCH ($(git rev-parse --short "origin/$BRANCH")); temp materialized at origin/$BRANCH with merge topology preserved. Proceed to run-tests; do not rebase, amend, or reset."
    ;;
  1)
    # Genuinely diverged: the rebase this step has always run, behind the same
    # exit-checked materialization as the skip arm. Unchecked, a stranded temp
    # (a merge-push STOP wedge, or an `mr` lease failure re-entered without the
    # cleanup below) fails this checkout and leaves HEAD on the STALE branch, so
    # the rebase rewrites the wrong commits. The damage is worse here than on the
    # skip arm: merge-push then force-pushes the result over $BRANCH, and
    # --force-with-lease does not stop it because the guard fetch above already
    # advanced the remote-tracking ref the lease is compared against.
    if ! git checkout -b temp origin/$BRANCH; then
      echo "cannot materialize temp at origin/$BRANCH for the rebase path (a stale temp branch may be stranded from a previous merge-push STOP or mr lease failure); rebasing it would rewrite the wrong commits and merge-push would force-push them over $BRANCH. STOP. Do not mutate bead state."
      gc runtime drain-ack
      exit 1
    fi
    git rebase origin/$TARGET
    ;;
  *)
    # A probe error is never "not an ancestor" (same idiom as merge-push's
    # already-merged gate error arm).
    echo "git merge-base --is-ancestor errored (status $ANCESTOR_RC); cannot evaluate rebase ancestry. STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac
```

If the ancestry decision SKIPPED the rebase (`SKIP-REBASE` printed, probe
rc=0): `temp` is already materialized at `origin/$BRANCH` with merge topology
intact — treat this step as succeeded without a rebase and proceed to run-tests
exactly as a successful rebase does. Do not abort, amend, reset, or re-run a
rebase on it. Nothing was rewritten; merge-push consumes `temp` unchanged.

If rebase SUCCEEDED (exit 0): close this step, proceed to run-tests.

If rebase FAILED (conflicts) — and only then: the guards above have already
ruled out an unresolvable target, an already-based source, and fetch/probe tool
errors, so what reaches a failed rebase is a genuine content conflict with
`$TARGET`:

1. Abort: `git rebase --abort`
2. Clean up the existing workflow and reopen the source bead:
```bash
gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
```
3. Put the work bead back in the pool with rejection metadata:
```bash
gc bd update $WORK \
  --status=open \
  --assignee="" \
  --unset-metadata handoff_stage \
  --set-metadata rejection_reason="Conflicts with $TARGET at $(git rev-parse origin/$TARGET)" \
  --set-metadata gc.routed_to="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat"
```
Clearing `handoff_stage` is required, not cosmetic: rejection invalidates the
polecat's "submit completed" marker, and leaving it set would let the witness's
Step 3a hand this already-rejected tip straight back here on the next crash.
4. Do NOT delete the branch (new polecat needs it for conflict resolution).
5. Clean up temp branch: `git checkout {{target_branch}} && git branch -D temp`
6. Pour next patrol iteration before burning:
```bash
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=open,in_progress --type=molecule --include-infra --limit=0 --json | jq -r '.[0].id // empty')
fi
if [ -z "$CURRENT_WISP" ]; then
  echo "ERROR: could not resolve the current refinery wisp: GC_BEAD_ID is unset and no open/in_progress patrol wisp is assigned to $GC_AGENT."
  echo "ERROR: refusing to continue. With CURRENT_WISP empty this cycle would pour a successor and never burn the wisp it is running, leaking one wisp every cycle, while every command still exits 0."
  gc runtime drain-ack
  exit 1
fi
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
# --- session-iteration-stamp:begin ---
# Carry the conversation's iteration count onto NEXT in the same write that
# assigns it, so check-inbox can restart at restart_after_iterations. The count
# continues only while CURRENT was stamped under this GC_CONTINUATION_EPOCH;
# any other epoch was an earlier conversation, so NEXT starts again at 1. With
# the epoch unset nothing is stamped and the cadence check reads "off".
set -- --assignee="$GC_AGENT"
if [ -n "${GC_CONTINUATION_EPOCH:-}" ]; then
  if ! STAMP_JSON=$(gc bd show "$CURRENT_WISP" --json 2>/dev/null); then
    echo "WARN: could not read $CURRENT_WISP; the next wisp's iteration count restarts at 1."
    STAMP_JSON=""
  fi
  STAMP_EPOCH=$(printf '%s' "$STAMP_JSON" | jq -r '.[0].metadata.session_epoch // empty' 2>/dev/null)
  STAMP_K=$(printf '%s' "$STAMP_JSON" | jq -r '.[0].metadata.session_iterations // empty' 2>/dev/null)
  case "$STAMP_K" in ''|*[!0-9]*) STAMP_K=0 ;; esac
  if [ "$STAMP_EPOCH" = "$GC_CONTINUATION_EPOCH" ]; then
    STAMP_K=$((STAMP_K + 1))
  else
    STAMP_K=1
  fi
  set -- "$@" --set-metadata session_epoch="$GC_CONTINUATION_EPOCH" --set-metadata session_iterations="$STAMP_K"
fi
if ! gc bd update "$NEXT" "$@"; then
  echo "Could not assign next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
# --- session-iteration-stamp:end ---
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "ERROR: could not resolve the current refinery wisp; not burning. The patrol loop cannot advance — this wisp leaks and no successor runs."
  gc runtime drain-ack
  exit 1
fi
```
7. Close this step after the current wisp is burned.

**A new polecat will pick up the bead, see the branch and rejection,
rebase, and reassign to refinery.**"""

[[steps]]
id = "run-tests"
title = "Run quality checks and tests"
needs = ["rebase"]
description = """
**Config: run_tests = {{run_tests}}**
**Config: test_command = {{test_command}}**
**Config: setup_command = {{setup_command}}**
**Config: typecheck_command = {{typecheck_command}}**
**Config: lint_command = {{lint_command}}**
**Config: build_command = {{build_command}}**

Run each configured check in order through `gate_run`, in ONE shell (empty
commands are skipped silently). Every gate runs even after one FAILs, and the
tests run only when run_tests = "true". Each gate writes a segment of one gate
log, named after the formula var that holds its command (setup, typecheck,
lint, build, test), and handle-failures reads that log with the pack's
`known-red`. A configured command's red is never logged under any other name:
known-red files a red under its gate's phase, and a polecat's preflight skips a
phase that an open base-red bead covers.

```bash
# --- gate-run:begin ---
# gate_run <phase> '<command>' appends one segment known-red can read to
# $GATE_LOG: a `gate(<phase>): RUN` header, the command's output, then
# `gate(<phase>): PASS` or `gate(<phase>): FAIL`. An empty command is a phase
# the rig does not configure: it writes nothing and returns 0. The command is
# passed single-quoted and eval'd, so double quotes and $(...) in it work.
gate_run() {
    gr_phase="$1"
    gr_cmd="$2"
    [ -n "${gr_cmd//[[:space:]]/}" ] || return 0
    echo "gate($gr_phase): RUN $(printf '%s' "$gr_cmd" | tr -s '[:space:]' ' ')" | tee -a "$GATE_LOG"
    if ( eval "$gr_cmd" ) </dev/null >>"$GATE_LOG" 2>&1; then
        echo "gate($gr_phase): PASS" | tee -a "$GATE_LOG"
        return 0
    fi
    echo "gate($gr_phase): FAIL" >>"$GATE_LOG"
    tail -n 40 "$GATE_LOG"
    return 1
}
# --- gate-run:end ---
# --- refinery-gates:begin ---
# One log per merge attempt: truncated first, so a FAIL from an earlier
# attempt is never read as this one's.
GATE_LOG="$(git rev-parse --git-dir)/refinery-gate.log"
: > "$GATE_LOG"
gate_run setup '{{setup_command}}' || true
gate_run typecheck '{{typecheck_command}}' || true
gate_run lint '{{lint_command}}' || true
gate_run build '{{build_command}}' || true
if [ "{{run_tests}}" = "true" ]; then gate_run test '{{test_command}}' || true; fi
grep -E '^gate\\([A-Za-z0-9_-]*\\): (PASS|FAIL)$' "$GATE_LOG"
# --- refinery-gates:end ---
```

**Fallback when this wisp has no quality-gate commands configured** (all of
setup_command, typecheck_command, lint_command, build_command, test_command
empty): do not silently skip. Read the repo's project-instructions file
(CLAUDE.md or AGENTS.md — whichever the configured provider expects; your
agent prompt lists the exact filename) and run the quality gates it
documents. Treat their failures the same way you would treat failures
from configured commands. The fallback preserves the quality-gate intent
when pack-specific guidance is missing. Run those gates through `gate_run` in
the same shell as the block above, after it has truncated `$GATE_LOG`, each
named after the var it stands in for (setup, typecheck, lint, build, test).

The gate log at `"$(git rev-parse --git-dir)/refinery-gate.log"` is the record
handle-failures reads.
Close this step when all checks complete (pass or fail)."""

[[steps]]
id = "handle-failures"
title = "Handle quality check or test failures"
needs = ["run-tests"]
description = """
If all checks and tests PASSED: close this step, proceed to merge-push.

If any check or test FAILED:

Read the current branch and target again:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
```

0. Classify through known-red. Run this whole block in ONE shell, with `$WORK`
   and `$TARGET` set as above. It reads the gate log run-tests wrote and asks
   the pack's `known-red` whether each red is already carried by an open
   base-red bead. Only exit 0, every red KNOWN, merges past without a
   diagnosis. Exit 3 (nothing NEW, some FIXED-UPSTREAM) is diagnosed like exit
   1 here, unlike at a polecat's preflight: this branch is already rebased
   onto `$TARGET`, so a FIXED-UPSTREAM row means no commit citing the fix bead
   is on `$TARGET` at all. A rebase cannot clear that, and the red may be this
   branch regressing a fixed test.

```bash
# --- resolve-known-red:begin ---
# resolve_known_red <formula> prints the path of the pack's known-red and
# returns 0, or returns 1. Located the way mol-refinery-patrol's
# resolve_approval_gate is: the named formula's own source anchors the pack, so
# the matcher is always the copy shipped beside the formula being run.
# GC_PACK_DIR is only a fallback, because gc exports it to pack commands and
# not to agent shells.
resolve_known_red() {
    rkr_rel="assets/scripts/known-red"
    rkr_city="${GC_CITY:-${GC_CITY_PATH:-}}"
    if [ -n "$rkr_city" ]; then
        rkr_json=$(gc formula list --city "$rkr_city" --json 2>/dev/null)
    else
        rkr_json=$(gc formula list --json 2>/dev/null)
    fi
    rkr_src=$(printf '%s' "$rkr_json" |
        jq -r --arg f "$1" '.formulas[]? | select(.name == $f) | .source // empty' 2>/dev/null |
        head -1)
    if [ -n "$rkr_src" ]; then
        # <pack>/formulas/<formula>.toml -> <pack>
        rkr_pack=$(dirname "$(dirname "$rkr_src")")
        if [ -x "$rkr_pack/$rkr_rel" ]; then
            echo "$rkr_pack/$rkr_rel"
            return 0
        fi
    fi
    if [ -n "${GC_PACK_DIR:-}" ] && [ -x "$GC_PACK_DIR/$rkr_rel" ]; then
        echo "$GC_PACK_DIR/$rkr_rel"
        return 0
    fi
    return 1
}
# --- resolve-known-red:end ---
# --- refinery-known-red-match:begin ---
KR=$(resolve_known_red mol-refinery-patrol) || KR=""
GATE_LOG="$(git rev-parse --git-dir)/refinery-gate.log"
# §3 runs in a later fence, after the diagnosis, and shell state does not
# survive between fences. This file hands it the known-red that ran here, so
# §3 needs no resolve of its own. Empty means known-red did not run.
KR_PATH_FILE="$(git rev-parse --git-dir)/refinery-known-red.path"
: > "$KR_PATH_FILE"
if [ -z "$KR" ] || [ ! -s "$GATE_LOG" ]; then
    echo "WARN known-red unavailable; diagnose and file by hand (§1-§3 without known-red)"
else
    printf '%s\\n' "$KR" > "$KR_PATH_FILE"
    KR_OUT=$("$KR" match "$GATE_LOG" 2>&1)
    KR_CODE=$?
    printf '%s\\n' "$KR_OUT"
    case "$KR_CODE" in
    0)
        KNOWN_IDS=$(printf '%s\\n' "$KR_OUT" | awk '$1 == "KNOWN" { print $2 }' | sort -u | paste -sd ' ' -)
        gc bd note "$WORK" --stdin <<KNOWN_RED_NOTE
Refinery merge onto $TARGET: every red is already known (known-red match exit 0). Filed nothing.
KNOWN: $KNOWN_IDS
KNOWN_RED_NOTE
        echo "ALL REDS KNOWN: $KNOWN_IDS. Filed nothing. Close this step and proceed to merge-push."
        ;;
    1|3)
        echo "DIAGNOSE these reds (branch versus $TARGET):"
        printf '%s\\n' "$KR_OUT" | awk '$1 == "NEW" || $1 == "FIXED-UPSTREAM"'
        echo "KNOWN reds in the same log need no diagnosis."
        ;;
    *)
        echo "WARN known-red lookup failed (exit $KR_CODE); diagnose every red"
        ;;
    esac
fi
# --- refinery-known-red-match:end ---
```

1. Diagnose ONLY the reds step 0 listed under DIAGNOSE; when it printed a
   WARN, diagnose every red. Is each one a branch regression or pre-existing
   on target?

2. If branch caused it:
   - Clean up the existing workflow and reopen the source bead:
     ```bash
     gc workflow delete-source $WORK --apply && gc workflow reopen-source $WORK
     ```
   - Put the work bead back in the pool with rejection metadata:
     ```bash
     gc bd update $WORK \
       --status=open \
       --assignee="" \
       --unset-metadata handoff_stage \
       --set-metadata rejection_reason="<failure summary>" \
       --set-metadata gc.routed_to="${GC_RIG:+$GC_RIG/}{{binding_prefix}}polecat"
     ```
     `handoff_stage` must be cleared here too: rejection invalidates the
     polecat's completed submit, and a stale marker would point the witness's
     Step 3a at this rejected tip as if it were a finished handoff.
   - Branch disposition and local cleanup. The rejected branch MUST survive:
     ```bash
     # --- reject-branch-disposition:begin ---
     # Do NOT delete $BRANCH. The pool-return above leaves metadata.branch
     # set, and mol-polecat-work's workspace-setup treats that value as
     # AUTHORITATIVE: the next polecat fetches origin/$BRANCH and resumes from
     # it. Deleting it here does not merely cost the resuming polecat its work
     # -- it BRICKS the bead. With the remote ref gone and no local ref (that
     # one lived in the previous polecat's worktree), the resume falls through
     # to "STOP. Do not create a different branch." and drain-acks, so every
     # polecat that claims the bead exits on sight until a human clears
     # metadata.branch by hand. The same-worktree re-claim hides it: that one
     # still has refs/heads/$BRANCH locally and resumes, which is why the
     # symptom reads as intermittent. Only the merged path deletes a branch,
     # and only when delete_merged_branches says to.
     git checkout "$TARGET" && git branch -D temp
     # --- reject-branch-disposition:end ---
     ```
   - Pour next patrol iteration before burning:
     ```bash
     CURRENT_WISP=${GC_BEAD_ID:-}
     if [ -z "$CURRENT_WISP" ]; then
       CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=open,in_progress --type=molecule --include-infra --limit=0 --json | jq -r '.[0].id // empty')
     fi
     if [ -z "$CURRENT_WISP" ]; then
       echo "ERROR: could not resolve the current refinery wisp: GC_BEAD_ID is unset and no open/in_progress patrol wisp is assigned to $GC_AGENT."
       echo "ERROR: refusing to continue. With CURRENT_WISP empty this cycle would pour a successor and never burn the wisp it is running, leaking one wisp every cycle, while every command still exits 0."
       gc runtime drain-ack
       exit 1
     fi
     NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
     if [ -z "$NEXT" ]; then
       echo "Could not pour next refinery wisp; not burning."
       gc runtime drain-ack
       exit 1
     fi
     # --- session-iteration-stamp:begin ---
     # Carry the conversation's iteration count onto NEXT in the same write that
     # assigns it, so check-inbox can restart at restart_after_iterations. The count
     # continues only while CURRENT was stamped under this GC_CONTINUATION_EPOCH;
     # any other epoch was an earlier conversation, so NEXT starts again at 1. With
     # the epoch unset nothing is stamped and the cadence check reads "off".
     set -- --assignee="$GC_AGENT"
     if [ -n "${GC_CONTINUATION_EPOCH:-}" ]; then
       if ! STAMP_JSON=$(gc bd show "$CURRENT_WISP" --json 2>/dev/null); then
         echo "WARN: could not read $CURRENT_WISP; the next wisp's iteration count restarts at 1."
         STAMP_JSON=""
       fi
       STAMP_EPOCH=$(printf '%s' "$STAMP_JSON" | jq -r '.[0].metadata.session_epoch // empty' 2>/dev/null)
       STAMP_K=$(printf '%s' "$STAMP_JSON" | jq -r '.[0].metadata.session_iterations // empty' 2>/dev/null)
       case "$STAMP_K" in ''|*[!0-9]*) STAMP_K=0 ;; esac
       if [ "$STAMP_EPOCH" = "$GC_CONTINUATION_EPOCH" ]; then
         STAMP_K=$((STAMP_K + 1))
       else
         STAMP_K=1
       fi
       set -- "$@" --set-metadata session_epoch="$GC_CONTINUATION_EPOCH" --set-metadata session_iterations="$STAMP_K"
     fi
     if ! gc bd update "$NEXT" "$@"; then
       echo "Could not assign next refinery wisp; not burning."
       gc runtime drain-ack
       exit 1
     fi
     # --- session-iteration-stamp:end ---
     if [ -n "$CURRENT_WISP" ]; then
       gc bd mol burn "$CURRENT_WISP" --force
     else
       echo "ERROR: could not resolve the current refinery wisp; not burning. The patrol loop cannot advance — this wisp leaks and no successor runs."
       gc runtime drain-ack
       exit 1
     fi
     ```
   - Close this step after the current wisp is burned.

3. If pre-existing on target (every diagnosed red is on `$TARGET` too):
   - File through known-red FIRST, in a fence of its own. It reads the
     known-red path step 0 left in the git dir and never resolves one itself.
     known-red dedups by exact failure id: it refreshes last-seen on a KNOWN
     id, files every NEW id with a stable id as ONE base-red bead under its
     gate's phase, and files nothing for a FIXED-UPSTREAM id. That red
     reproduces on `$TARGET` although its bead is closed, so the witness is
     told.
     ```bash
     # --- refinery-known-red-file:begin ---
     GATE_LOG="$(git rev-parse --git-dir)/refinery-gate.log"
     KR=$(cat "$(git rev-parse --git-dir)/refinery-known-red.path" 2>/dev/null)
     if [ -z "$KR" ]; then
         echo "known-red did not run in step 0: use the DUP_KEYWORD block below for every red."
     else
         FILE_OUT=$("$KR" file "$GATE_LOG" --summary "red on $TARGET at refinery merge of $WORK" --from "$WORK" 2>&1)
         FILE_CODE=$?
         printf '%s\\n' "$FILE_OUT"
         case "$FILE_CODE" in
         0|1)
             FIXED=$(printf '%s\\n' "$FILE_OUT" |
                 sed -nE 's/^known-red: (.+) is fixed upstream by ([^;]+);.*/\\1 (\\2)/p' | paste -sd ' ' -)
             if [ -n "$FIXED" ]; then
                 gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" \\
                     "$(printf 'KNOWN-RED: %s reproduce on %s although the bead is closed' "$FIXED" "$TARGET" | cut -c1-200)"
             fi
             if [ "$FILE_CODE" -eq 0 ]; then
                 FILED=$(printf '%s\\n' "$FILE_OUT" | awk '$1 == "known-red:" && $2 == "filed" { print $3 }' | paste -sd ' ' -)
                 echo "FILED: ${FILED:-none}. Proceed with merge."
             else
                 printf '%s\\n' "$FILE_OUT" | awk '$1 ~ /^raw:/'
                 echo "These reds have no stable id: run the DUP_KEYWORD block below for them only."
             fi
             ;;
         *)
             # FAIL CLOSED, as the DUP_KEYWORD block does: a failed file may
             # still have created a bead, so never fall through to filing.
             gc mail send mayor/ -s "ESCALATION: refinery known-red file failed, not filing [HIGH]" -m "Work bead: $WORK
     Exit code: $FILE_CODE
     Output: $FILE_OUT
     Refused to file a pre-existing-failure bead: known-red file failed, and a create can land and still fail."
             gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "KNOWN-RED HALT: $WORK — known-red file exited $FILE_CODE; refused to file. Merge not attempted."
             echo "STOP. known-red file failed. NEVER fall through to filing."
             gc runtime drain-ack
             exit 1
             ;;
         esac
     fi
     # --- refinery-known-red-file:end ---
     ```
   - The DUP_KEYWORD block below, its two `DUP_COUNT` bullets and "Proceed
     with merge" now apply only to the raw lines the known-red block printed
     at its exit 1, and to every red when it printed `known-red did not run in
     step 0`.
   - Check for duplicates FIRST, and run the whole block — the check has to
     fail closed. `gc bd list` has no `--search` flag; it exits non-zero with
     `unknown flag: --search`, which piped to jq yields empty output that reads
     exactly like "no duplicate exists". That is how one pre-existing failure
     becomes ten identical open bug beads. `gc bd search` is the verb that
     actually queries titles.
     ```bash
     # Search a DISTINCTIVE KEYWORD, not the failure sentence: `gc bd search`
     # matches against titles, so a whole summary matches nothing and returns
     # [] — indistinguishable from a genuine miss. Use the failing test name,
     # the tool name, the CVE id (e.g. test_no_bare_bd_commands, govulncheck).
     #
     # NO `--status` FILTER, deliberately (gcp-h98d). `gc bd search` already
     # excludes closed issues, so its default is exactly the wanted set: open
     # + in_progress. Do not "fix" this by narrowing it — both narrowings lie,
     # and neither trips the fail-closed branch below because both exit 0:
     #   --status=open              drops in_progress, and a duplicate someone
     #                              already STARTED is still a duplicate
     #   --status=open,in_progress  returns [] — the comma form is a
     #                              `gc bd list` feature, not a search one
     DUP_KEYWORD="<distinctive keyword from the failure>"
     DUP_ERR=$(mktemp)
     DUP_JSON=$(gc bd search "$DUP_KEYWORD" --type=bug --json 2>"$DUP_ERR")
     DUP_CODE=$?
     DUP_MSG=$(cat "$DUP_ERR"); rm -f "$DUP_ERR"
     DUP_COUNT=$(printf '%s' "$DUP_JSON" | jq 'length' 2>/dev/null)
     if [ "$DUP_CODE" -ne 0 ] || [ -z "$DUP_COUNT" ]; then
       # FAIL CLOSED. An errored or unparseable duplicate check is NOT
       # "no duplicate found" — filing here is the exact shape that produced
       # the duplicate pile-ups. Halt and escalate; do NOT create a bead.
       gc mail send mayor/ -s "ESCALATION: refinery duplicate check failed, not filing [HIGH]" -m "Work bead: $WORK
     Keyword: $DUP_KEYWORD
     Exit code: $DUP_CODE
     Stderr: $DUP_MSG
     Refused to file a pre-existing-failure bead on an unverified duplicate check."
       gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "DUP-CHECK HALT: $WORK — gc bd search failed (code $DUP_CODE); refused to file. Merge not attempted."
       echo "STOP. Duplicate check did not run. NEVER fall through to filing."
       gc runtime drain-ack
       exit 1
     fi
     if [ "$DUP_COUNT" -gt 0 ]; then
       printf '%s' "$DUP_JSON" | jq -r '.[] | "DUPLICATE \\(.id)  \\(.title)"'
     fi
     ```
   - If `DUP_COUNT` > 0: note the matching bead ID and proceed with merge. Do
     not file.
   - If `DUP_COUNT` is 0 — a check that ran and genuinely found nothing — file
     a new bead. Put `$DUP_KEYWORD` in the title verbatim, or the next patrol's
     search cannot find what you just filed:
     ```bash
     gc bd create --type=bug --priority=1 --title="Pre-existing failure: $DUP_KEYWORD — <summary>"
     ```
   - Proceed with merge (failure not caused by this branch)

**GATE**: Cannot merge without all checks passing, OR every red KNOWN (step 0
exit 0), OR every pre-existing red filed or found.
**FORBIDDEN**: Writing code to fix failures. You are a merge processor."""

[[steps]]
id = "merge-push"
title = "Merge and push"
needs = ["handle-failures"]
description = """
**Config: target_branch = {{target_branch}}**
**Config (deprecated; no effect on successful handoffs):
delete_merged_branches = {{delete_merged_branches}}**

Read the merge target and merge strategy from the work bead metadata:
```bash
BRANCH=$(gc bd show $WORK --json | jq -r '.[0].metadata.branch')
TARGET=$(gc bd show $WORK --json | jq -r '.[0].metadata.target // "{{target_branch}}"')
MERGE_STRATEGY=$(gc bd show $WORK --json | jq -r '.[0].metadata.merge_strategy // "direct"')
EXISTING_PR=$(gc bd show $WORK --json | jq -r '.[0].metadata.existing_pr // empty')
# --- origin-repo-resolution:begin ---
# The repository that matters here is the one this worktree PUSHES to: origin.
# `gh repo view` answers with gh's own base-repo heuristic, which on a fork that
# also carries an `upstream` remote resolves to the PARENT — so a fork-based rig
# would create and look up its pull requests in a repo its branches were never
# pushed to (gastownhall/gascity-packs#... — the mr lane could not see PR #1 on
# the fork). Parse origin directly; gh is a fallback only for remotes this
# parser cannot read (GitHub Enterprise hosts, ssh config aliases).
ORIGIN_REPO=""
ORIGIN_REPO_ERROR=""
ORIGIN_URL=$(git remote get-url origin 2>/dev/null || true)
case "$ORIGIN_URL" in
  git@github.com:*|https://github.com/*|ssh://git@github.com/*)
    ORIGIN_REPO=$(printf '%s\n' "$ORIGIN_URL" \
      | sed -E 's#^ssh://git@github.com/##; s#^git@github.com:##; s#^https://github.com/##; s#\\.git$##')
    ;;
esac
if [ -z "$ORIGIN_REPO" ]; then
  if command -v gh >/dev/null 2>&1; then
    if ! ORIGIN_REPO=$(gh repo view --json nameWithOwner -q '.nameWithOwner' 2>&1); then
      ORIGIN_REPO_ERROR="gh repo view failed while resolving origin repository: $ORIGIN_REPO"
      ORIGIN_REPO=""
    fi
  elif [ -z "$ORIGIN_URL" ]; then
    ORIGIN_REPO_ERROR="Could not read the origin remote (git remote get-url origin failed); cannot resolve the repository for pull-request handoff."
  else
    ORIGIN_REPO_ERROR="GitHub REST fallback supports only github.com origin remotes; install gh for $ORIGIN_URL."
  fi
fi
# --- origin-repo-resolution:end ---
if [ "$MERGE_STRATEGY" = "pr" ]; then
  MERGE_STRATEGY="mr"
fi
if [ -n "$EXISTING_PR" ] && [ "$MERGE_STRATEGY" = "direct" ]; then
  echo "metadata.existing_pr requires pull-request handoff; using merge_strategy=mr."
  MERGE_STRATEGY="mr"
fi

# Approval gate opt-in. Only the recognized off values disable it; anything
# unrecognized (a typo in the rig's formula_vars) turns it ON, because the
# failure mode of a mis-read switch must be "review required", never "review
# silently skipped".
case "$(printf '%s' "{{require_merge_approval}}" | tr '[:upper:]' '[:lower:]')" in
  ''|false|0|no|off) APPROVAL_REQUIRED=0 ;;
  *) APPROVAL_REQUIRED=1 ;;
esac
if [ "$APPROVAL_REQUIRED" -eq 1 ] && [ "$MERGE_STRATEGY" = "direct" ]; then
  # A reviewed merge needs something to review. Without this promotion the
  # gate would refuse every direct-mode bead forever (fail-closed, but
  # permanently deadlocked) because no PR would ever exist to approve.
  echo "require_merge_approval is on; a reviewed merge needs a pull request — using merge_strategy=mr."
  MERGE_STRATEGY="mr"
fi
# >>> merge-approval-gate-wiring >>>
# Everything between these markers is executed verbatim by
# gastown/tests/test_merge_approval_gate.sh, so the resolution and refusal
# behaviour asserted there is the behaviour the refinery actually runs. Keep
# the block self-contained: its only inputs are APPROVAL_REQUIRED, WORK, and
# the formula vars.
#
# Locate merge-approval-gate.sh from the context this formula actually runs in:
# the agent's own shell, not a `gc` pack-command invocation.
#
# The primary anchor is this formula's own resolved source path. The gate ships
# beside the formula in the same pack tree, so that path is the one candidate
# guaranteed to be (a) present whenever the formula itself is and (b) version-
# coherent with it — a formula from pin X can never reach a gate from pin Y.
# `gc formula list --json` reports it for every formula gc can see, including
# packs pinned to a SHA (gc checks the pin out into the pack cache and reports
# the cache path), and it needs no environment beyond the city.
#
# The env-var and city-scripts candidates stay as fallbacks for cities that do
# materialize checks into `.gc/scripts/checks/`, but none of them can be the
# primary: GC_PACK_DIR is exported only when gc invokes a *pack command* and is
# unset in every agent process, and nothing materializes pack check scripts
# into the city scripts dir today. Depending on them alone made the gate
# permanently unresolvable, which turned fail-closed into fail-forever
# (gcp-amo).
resolve_approval_gate() {
  rag_rel="assets/scripts/checks/merge-approval-gate.sh"
  rag_city="${GC_CITY:-${GC_CITY_PATH:-}}"
  if [ -n "$rag_city" ]; then
    rag_json=$(gc formula list --city "$rag_city" --json 2>/dev/null)
  else
    rag_json=$(gc formula list --json 2>/dev/null)
  fi
  rag_src=$(printf '%s' "$rag_json" \
    | jq -r '.formulas[]? | select(.name == "mol-refinery-patrol") | .source // empty' 2>/dev/null \
    | head -1)
  if [ -n "$rag_src" ]; then
    # <pack>/formulas/mol-refinery-patrol.toml -> <pack>
    rag_pack=$(dirname "$(dirname "$rag_src")")
    if [ -f "$rag_pack/$rag_rel" ]; then
      printf '%s\n' "$rag_pack/$rag_rel"
      return 0
    fi
  fi
  for rag_cand in \
    "${GC_PACK_DIR:-}/$rag_rel" \
    "${GC_CITY:-}/.gc/scripts/checks/merge-approval-gate.sh" \
    "${GC_CITY_PATH:-}/.gc/scripts/checks/merge-approval-gate.sh" \
    ".gc/scripts/checks/merge-approval-gate.sh"
  do
    if [ -f "$rag_cand" ]; then
      printf '%s\n' "$rag_cand"
      return 0
    fi
  done
  return 1
}
APPROVAL_GATE=""
if [ "$APPROVAL_REQUIRED" -eq 1 ]; then
  APPROVAL_GATE=$(resolve_approval_gate)
  if [ -z "$APPROVAL_GATE" ]; then
    echo "require_merge_approval is on but merge-approval-gate.sh was not found. STOP. Do not mutate bead state."
    echo "An unreadable gate is not an approval."
    gc runtime drain-ack
    exit 1
  fi
fi

run_approval_gate() {
  # $1 = the commit the refinery is about to land. Passing it closes the gap
  # where the local rebased tip has drifted from the reviewed PR head.
  ag_sha="${1:-}"
  set -- --bead "$WORK" --required "{{require_merge_approval}}"
  if [ -n "$ag_sha" ]; then
    set -- "$@" --merge-sha "$ag_sha"
  fi
  bash "$APPROVAL_GATE" "$@"
}

# Reviewer addressing. review_agent is written unqualified in the rig's
# formula_vars (`specialists.iris`, `gastown.mayor`) and the rig prefix used to
# be pasted on unconditionally. That is right for a rig-scoped reviewer and
# wrong for a town-level one: gascity-packs names `gastown.mayor`, whose only
# session address is the bare name, so every park nudged
# `gascity-packs/gastown.mayor`, got "session not found", and — fire-and-forget,
# with no retry and no marker — never told the reviewer anything. On a rig whose
# whole point is a review gate, that turns "reviewed merges" into "merges that
# wait forever" (gcp-a22).
#
# So resolve rather than assume. A bare name is tried rig-scoped first and then
# town-level: the rig attempt stays first so a rig-local reviewer is never
# shadowed by a town agent that happens to share its name. An address the
# operator already qualified (`otherrig/agent`) is taken verbatim, and a leading
# `/` forces town-level and skips the rig attempt.
nudge_review_agent() {
  # $1 = message. Echoes the address that accepted it, or — on return 1 — a
  # flattened diagnostic naming every scope that refused.
  nra_msg="$1"
  nra_addr="{{review_agent}}"
  case "$nra_addr" in
    /*) set -- "${nra_addr#/}" ;;
    */*) set -- "$nra_addr" ;;
    *)
      if [ -n "${GC_RIG:-}" ]; then
        set -- "$GC_RIG/$nra_addr" "$nra_addr"
      else
        set -- "$nra_addr"
      fi
      ;;
  esac
  nra_errors=""
  for nra_try in "$@"; do
    if nra_out=$(gc session nudge "$nra_try" "$nra_msg" 2>&1); then
      printf '%s' "$nra_try"
      return 0
    fi
    nra_errors="${nra_errors:+$nra_errors; }$nra_try: $(printf '%s' "$nra_out" | tr '\n' ' ')"
  done
  printf '%s' "$nra_errors"
  return 1
}

park_awaiting_review() {
  # A refused merge is not a failure and not an incident: the branch is fine,
  # the reviewer simply has not approved THIS commit. Leave the bead open and
  # assigned to the refinery with the refusal recorded, nudge the reviewer if
  # the rig named one, and let the next patrol iteration re-check. Never
  # close, never escalate, never retry the merge in this iteration.
  # The gate reports on stderr and can emit more than one line; metadata is a
  # single-line store, so flatten before writing.
  ag_reason=$(printf '%s' "$1" | tr '\n' ' ')
  if ! gc bd update "$WORK" \
    --set-metadata merge_approval_state=awaiting_review \
    --set-metadata merge_approval_gate_reason="$ag_reason"; then
    echo "WARN could not record the gate refusal on $WORK; the bead stays open and unmerged regardless."
  fi
  if [ -n "{{review_agent}}" ]; then
    # The nudge is the only thing that tells the reviewer this bead is waiting,
    # so its outcome goes into durable state either way — a failure visible only
    # in a patrol transcript is exactly how gcp-a22 stayed invisible. One field,
    # rewritten on every park, so a later delivery cannot leave a stale failure
    # standing behind it.
    if ag_nudge=$(nudge_review_agent "REVIEW NEEDED: $WORK — ${PR_URL:-$BRANCH} awaiting merge approval. Record a verdict with record-merge-approval.sh (--pr + --sha of the live head)."); then
      gc bd update "$WORK" --set-metadata merge_approval_nudge="delivered: $ag_nudge" ||
        echo "WARN could not record the review nudge delivery on $WORK."
    else
      echo "WARN review nudge for $WORK reached no reviewer session: $ag_nudge"
      gc bd update "$WORK" --set-metadata merge_approval_nudge="failed: $ag_nudge" ||
        echo "WARN could not record the review nudge failure on $WORK; it is visible only in this transcript."
    fi
  fi
  echo "APPROVAL GATE REFUSED: $WORK — $1"
  echo "Bead left open and assigned to the refinery; skip the merge and run patrol-summary + next-iteration."
}
# <<< merge-approval-gate-wiring <<<

block_existing_pr() {
  reason="$1"
  gc bd update $WORK \
    --assignee="" \
    --set-metadata merge_result=blocked \
    --set-metadata gc.routed_to=human \
    --set-metadata blocked_reason="$reason"
  gc mail send mayor/ -s "ESCALATION: invalid existing_pr for $WORK" -m "$reason
Work bead: $WORK
Existing PR: $EXISTING_PR
Branch: $BRANCH
Target: $TARGET"
  CURRENT_WISP=${GC_BEAD_ID:-}
  if [ -z "$CURRENT_WISP" ]; then
    CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=open,in_progress --type=molecule --include-infra --limit=0 --json | jq -r '.[0].id // empty')
  fi
  if [ -z "$CURRENT_WISP" ]; then
    echo "ERROR: could not resolve the current refinery wisp; not burning. The patrol loop cannot advance — this wisp leaks and no successor runs."
    echo "$reason"
    echo "STOP. Existing PR metadata needs human correction."
    gc runtime drain-ack
    exit 1
  fi
  NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
  if [ -z "$NEXT" ]; then
    echo "Could not pour next refinery wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  # --- session-iteration-stamp:begin ---
  # Carry the conversation's iteration count onto NEXT in the same write that
  # assigns it, so check-inbox can restart at restart_after_iterations. The count
  # continues only while CURRENT was stamped under this GC_CONTINUATION_EPOCH;
  # any other epoch was an earlier conversation, so NEXT starts again at 1. With
  # the epoch unset nothing is stamped and the cadence check reads "off".
  set -- --assignee="$GC_AGENT"
  if [ -n "${GC_CONTINUATION_EPOCH:-}" ]; then
    if ! STAMP_JSON=$(gc bd show "$CURRENT_WISP" --json 2>/dev/null); then
      echo "WARN: could not read $CURRENT_WISP; the next wisp's iteration count restarts at 1."
      STAMP_JSON=""
    fi
    STAMP_EPOCH=$(printf '%s' "$STAMP_JSON" | jq -r '.[0].metadata.session_epoch // empty' 2>/dev/null)
    STAMP_K=$(printf '%s' "$STAMP_JSON" | jq -r '.[0].metadata.session_iterations // empty' 2>/dev/null)
    case "$STAMP_K" in ''|*[!0-9]*) STAMP_K=0 ;; esac
    if [ "$STAMP_EPOCH" = "$GC_CONTINUATION_EPOCH" ]; then
      STAMP_K=$((STAMP_K + 1))
    else
      STAMP_K=1
    fi
    set -- "$@" --set-metadata session_epoch="$GC_CONTINUATION_EPOCH" --set-metadata session_iterations="$STAMP_K"
  fi
  if ! gc bd update "$NEXT" "$@"; then
    echo "Could not assign next refinery wisp; not burning."
    gc runtime drain-ack
    exit 1
  fi
  # --- session-iteration-stamp:end ---
  if [ -n "$CURRENT_WISP" ]; then
    gc bd mol burn "$CURRENT_WISP" --force
  else
    echo "ERROR: could not resolve the current refinery wisp; not burning. The patrol loop cannot advance — this wisp leaks and no successor runs."
    echo "$reason"
    echo "STOP. Existing PR metadata needs human correction."
    gc runtime drain-ack
    exit 1
  fi
  echo "$reason"
  echo "STOP. Existing PR metadata needs human correction."
  gc runtime drain-ack
  exit 1
}

# --- merge-state-helpers:begin ---
branch_has_real_change() {
  # Shared false-completion predicate (0-diff/0-commit guard). Does
  # <branch-ref> introduce a real change vs its merge-base with
  # <target-ref>? Diff is authoritative — commit-count alone is a weaker
  # proxy because a branch can carry commits that net-zero — so we use
  # `git diff --quiet` and ALSO require >=1 commit beyond the base.
  #   exit 0 = real change (safe to merge / open PR)
  #   exit 1 = empty: no diff, or no commits, vs base (REFUSE close-as-merged)
  #   exit 2 = base/diff could not be computed: merge-base failed OR `git diff`
  #           itself errored (exit >1). Fail closed — a tool error is a suspect,
  #           not a licence to merge — so the caller halts, never improvises.
  bhrc_target="$1"
  bhrc_branch="$2"
  bhrc_base=$(git merge-base "$bhrc_target" "$bhrc_branch" 2>/dev/null) || return 2
  git diff --quiet "$bhrc_base" "$bhrc_branch"
  case "$?" in
    0) return 1 ;;  # no diff -> empty -> refuse
    1) : ;;         # diff present -> fall through to the commit-count check
    *) return 2 ;;  # git diff errored -> suspect -> refuse (fail closed)
  esac
  [ "$(git rev-list --count "$bhrc_base..$bhrc_branch" 2>/dev/null || echo 0)" -ge 1 ] || return 1
  return 0
}

branch_already_landed() {
  # Rebase-aware already-merged predicate: has <branch-ref> already landed on
  # <target-ref>, judged by CONTENT rather than by reachability?
  #
  # Ancestor-ness is a SUFFICIENT condition for already-merged, never a
  # necessary one. This lane lands work by rebasing `temp` onto the target and
  # ff-merging, which REWRITES every commit — so after a successful merge
  # `origin/$BRANCH` is not an ancestor of `origin/$TARGET`; its pre-rebase sha
  # is nowhere on the target. The ancestor arm can therefore essentially never
  # fire here, which made a crash between `git push` and `gc bd close` fall
  # through to the 0-diff guard: the rebase correctly drops the already-applied
  # commit, the guard correctly sees 0 commits / 0 diff, and a genuinely merged
  # bead got halted to a human as a false completion (winnow-zgr2y.6, refiled
  # gcp-a4e7). Patch-id equality is the axis that survives the rewrite.
  #   exit 0 = every commit introduced since <fork-sha> is already upstream by
  #            patch-id -> already merged, safe to close
  #   exit 1 = NOT already merged. Either the branch still carries a commit the
  #            target does not have, or it introduced nothing of its own — the
  #            starved 0-commit polecat, and gcp-duy's branch that was merely
  #            rebased/reset onto newer target so its "commits since fork" are
  #            other beads'. Both belong to the false-completion guard.
  #   exit 2 = cannot evaluate: no fork_sha recorded, the fork commit is not in
  #            this repo, or a git invocation errored. Fail closed and let the
  #            false-completion guard decide, exactly as a missing fork_sha
  #            already does on the ancestor arm.
  bal_target="$1"
  bal_branch="$2"
  bal_fork="$3"
  [ -n "$bal_fork" ] || return 2
  git rev-parse --verify --quiet "$bal_fork^{commit}" >/dev/null 2>&1 || return 2
  # The branch must have introduced something OF ITS OWN since the fork point.
  # Both halves are load-bearing: a non-empty diff against the fork rules out
  # the starved 0-commit polecat, and requiring commits the target does not
  # already contain rules out the rebased zero-change branch whose counted
  # commits arrived via the rebase (gcp-duy's false positive — do not let this
  # arm reintroduce it on the content axis).
  git diff --quiet "$bal_fork" "$bal_branch" 2>/dev/null
  case "$?" in
    0) return 1 ;;  # nothing since the fork -> nothing of its own was merged
    1) : ;;         # real change since the fork -> keep checking
    *) return 2 ;;  # git diff errored -> suspect -> fail closed
  esac
  [ "$(git rev-list --count "$bal_branch" --not "$bal_target" 2>/dev/null || echo 0)" -ge 1 ] || return 1
  # `git cherry <target> <branch> <fork>` marks each commit since the fork '-'
  # when an equivalent patch is already upstream and '+' when it is not. All
  # '-' with no '+' is the rebasing rig's already-merged fingerprint.
  bal_cherry=$(git cherry "$bal_target" "$bal_branch" "$bal_fork" 2>/dev/null) || return 2
  [ -n "$bal_cherry" ] || return 1
  printf '%s\n' "$bal_cherry" | grep -q '^+' && return 1
  return 0
}

upstream_equivalent_sha() {
  # Name the commit ON <target-ref> that carries <branch-ref>'s work, so a
  # rebase-aware close writes a `merged_sha` that is actually reachable from
  # the target — the field's whole purpose as the breadcrumb tying a closed
  # bead to its merge commit. The pre-rebase branch tip is NOT on the target
  # after a rewrite, so it cannot serve here.
  #
  # Scans the bounded range merge-base(target, branch)..target, which on a
  # crash-after-push is the merge that just landed plus whatever raced it.
  #   stdout = the matching target commit; exit 0
  #   exit 1 = no match in the scanned range; the caller falls back rather than
  #            inventing a sha.
  ues_target="$1"
  ues_branch="$2"
  ues_id=$(git show "$ues_branch" 2>/dev/null | git patch-id --stable 2>/dev/null | cut -d' ' -f1)
  [ -n "$ues_id" ] || return 1
  ues_base=$(git merge-base "$ues_target" "$ues_branch" 2>/dev/null) || return 1
  for ues_commit in $(git rev-list --max-count=500 "$ues_base..$ues_target" 2>/dev/null); do
    if [ "$(git show "$ues_commit" 2>/dev/null | git patch-id --stable 2>/dev/null | cut -d' ' -f1)" = "$ues_id" ]; then
      printf '%s\n' "$ues_commit"
      return 0
    fi
  done
  return 1
}

halt_false_completion() {
  # branch_has_real_change tripped: a close-as-merged would assert "work was
  # merged" for a branch that merges to a no-op, which is definitionally
  # false. Halt-and-escalate (NEVER silent retry): leave the bead blocked
  # with a structured note, hand to human, nudge mayor + witness, then stop.
  # This surfaces the transient cause (e.g. session starvation -> 0-commit
  # polecat) instead of masking it.
  fc_branch="$1"
  fc_base="$2"
  gc bd update $WORK \
    --status=blocked \
    --assignee="" \
    --set-metadata merge_result=refused_false_completion \
    --set-metadata gc.routed_to=human \
    --set-metadata false_completion_suspected="branch $fc_branch no verified change vs $fc_base; refused merge-close"
  gc session nudge mayor "FALSE-COMPLETION HALT: $WORK — branch $fc_branch no verified change vs $fc_base; refused close-as-merged. Bead left blocked; NEVER silent retry."
  gc session nudge "${GC_RIG:+$GC_RIG/}{{binding_prefix}}witness" "FALSE-COMPLETION HALT: $WORK — branch $fc_branch no verified change vs $fc_base; refused close-as-merged."
  echo "REFUSED close-as-merged: $WORK branch $fc_branch introduces no real change vs $fc_base."
  echo "STOP. Bead left blocked + escalated to mayor/witness. NEVER silent retry."
  gc runtime drain-ack
  exit 1
}

close_already_merged() {
  # Shared already-merged close, used by BOTH arms of the merge-state gate (the
  # ancestor short-circuit and the rebase-aware content check) so the two can
  # never drift on what a merged close records.
  #   $1 = merged_sha — a commit on $TARGET that carries this bead's work
  #   $2 = already_merged_via — how it was established: ancestor | rebase_patch_id
  #   $3 = human-readable evidence for the close reason and the log line
  # Both the metadata write and the close must land. A partial write would
  # report merged with the bead still open, so on failure this STOPS and a
  # later patrol retries instead.
  cam_sha="$1"
  cam_via="$2"
  cam_evidence="$3"
  cam_short=$(git rev-parse --short "$cam_sha" 2>/dev/null || printf '%s' "$cam_sha")
  if gc bd update "$WORK" \
       --set-metadata merge_result=already_merged \
       --set-metadata merged_sha="$cam_sha" \
       --set-metadata merged_target="$TARGET" \
       --set-metadata already_merged_via="$cam_via" \
       --set-metadata merged_source_sha="$(git rev-parse "origin/$BRANCH" 2>/dev/null || printf '%s' unknown)" \
       --unset-metadata rejection_reason && \
     gc bd close "$WORK" --reason "Already merged to $TARGET at $cam_short ($cam_evidence; closed instead of halting)"; then
    echo "ALREADY_MERGED: $cam_evidence — closed $WORK as merged at $cam_short. Skip the merge script; run Cleanup, then patrol-summary + next-iteration."
    exit 0
  fi
  # The update/close did not land (transient API failure). Do NOT report
  # merged with the bead still open; STOP so a later patrol retries.
  echo "ALREADY_MERGED close failed for $WORK; bead still open. STOP; a later patrol will retry."
  gc runtime drain-ack
  exit 1
}
# --- merge-state-helpers:end ---

pr_lookup_missing() {
  case "$1" in
    *"Could not resolve to a PullRequest"*|*"could not resolve to a PullRequest"*|*"no pull requests found"*|*"Not Found"*|*"not found"*|*"404"*) return 0 ;;
    *) return 1 ;;
  esac
}

pr_lookup_repo_mismatch() {
  case "$1" in
    *" belongs to repo "*", want "*) return 0 ;;
    *) return 1 ;;
  esac
}

resolve_github_token() {
  TOKEN="${GH_TOKEN:-${GITHUB_TOKEN:-${GIT_TOKEN:-}}}"
  if [ -n "$TOKEN" ]; then
    printf '%s\n' "$TOKEN"
    return
  fi
  printf 'protocol=https\nhost=github.com\n\n' \
    | GIT_TERMINAL_PROMPT=0 git credential fill 2>/dev/null \
    | sed -n 's/^password=//p' \
    | head -n 1
}

init_github_rest() {
  if [ -n "${API:-}" ] && [ -n "${TOKEN:-}" ]; then
    return 0
  fi
  if [ -n "$ORIGIN_REPO_ERROR" ]; then
    echo "$ORIGIN_REPO_ERROR" >&2
    return 1
  fi
  TOKEN=$(resolve_github_token)
  if [ -z "$TOKEN" ]; then
    echo "GitHub PR mode requires gh or a GitHub token available from env/git credential fill." >&2
    return 1
  fi
  case "$ORIGIN_REPO" in
    */*)
      OWNER=${ORIGIN_REPO%%/*}
      REPO=${ORIGIN_REPO#*/}
      ;;
    *)
      echo "Could not resolve standard github.com origin repository for REST fallback." >&2
      return 1
      ;;
  esac
  API="https://api.github.com/repos/$OWNER/$REPO"
}

curl_gh_api() {
  err_file="$1"
  shift
  curl -fsS \
    -H "Accept: application/vnd.github+json" \
    -H "Authorization: Bearer $TOKEN" \
    -H "Content-Type: application/json" \
    -H "X-GitHub-Api-Version: 2022-11-28" \
    "$@" 2>"$err_file"
}

lookup_pr_info() {
  ref="$1"
  err_file="$2"
  # An unscoped lookup is what let this lane read the wrong repository in the
  # first place. Without a resolved origin there is nothing safe to scope to,
  # so refuse rather than fall back to gh's base-repo guess.
  if [ -z "$ORIGIN_REPO" ]; then
    {
      [ -n "$ORIGIN_REPO_ERROR" ] && echo "$ORIGIN_REPO_ERROR"
      echo "Could not resolve the origin repository; refusing an unscoped pull request lookup for $ref."
    } >"$err_file"
    return 1
  fi
  if command -v gh >/dev/null 2>&1; then
    gh pr view --repo "$ORIGIN_REPO" --json url,number,state,headRefName,headRefOid,baseRefName,headRepositoryOwner,headRepository -- "$ref" 2>"$err_file"
    return $?
  fi
  if ! init_github_rest 2>"$err_file"; then
    return 1
  fi
  PR_REF_REPO=$(printf '%s\n' "$ref" | sed -nE 's#^[Hh][Tt][Tt][Pp][Ss]://github.com/([^/]+/[^/]+)/pull/[0-9]+/?$#\\1#p' | head -n 1)
  if [ -n "$PR_REF_REPO" ] && [ "$PR_REF_REPO" != "$ORIGIN_REPO" ]; then
    echo "Pull request $ref belongs to repo $PR_REF_REPO, want $ORIGIN_REPO." >"$err_file"
    return 1
  fi
  PR_NUMBER=$(printf '%s\n' "$ref" | sed -nE 's#^[Hh][Tt][Tt][Pp][Ss]://github.com/[^/]+/[^/]+/pull/([0-9]+)/?$#\\1#p; s|^#([0-9]+)$|\\1|p; s|^([0-9]+)$|\\1|p' | head -n 1)
  if [ -z "$PR_NUMBER" ]; then
    PR_MATCHES=$(curl_gh_api "$err_file" \
      --get "$API/pulls" \
      --data-urlencode "state=open" \
      --data-urlencode "head=$OWNER:$ref" \
      --data-urlencode "base=$TARGET") || return 1
    PR_NUMBER=$(printf '%s\n' "$PR_MATCHES" | jq -r '.[0].number // empty')
  fi
  if [ -z "$PR_NUMBER" ]; then
    echo "Pull request $ref was not found." >"$err_file"
    return 1
  fi
  PR_RAW=$(curl_gh_api "$err_file" "$API/pulls/$PR_NUMBER") || return 1
  printf '%s\n' "$PR_RAW" \
    | jq '{url:.html_url, number, state:(.state | ascii_upcase), headRefName:.head.ref, headRefOid:.head.sha, baseRefName:.base.ref, headRepositoryOwner:{login:.head.repo.owner.login}, headRepository:{name:.head.repo.name}}'
}

if [ "$MERGE_STRATEGY" = "mr" ] && [ -n "$EXISTING_PR" ]; then
  if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then
    block_existing_pr "metadata.existing_pr is set but metadata.branch is missing."
  fi

  if [ -z "$ORIGIN_REPO" ]; then
    [ -n "$ORIGIN_REPO_ERROR" ] && echo "$ORIGIN_REPO_ERROR"
    echo "Could not resolve origin repository for existing PR validation. STOP. Debug and retry without mutating bead state."
    gc runtime drain-ack
    exit 1
  fi

  EXISTING_PR_ERR=$(mktemp)
  EXISTING_PR_INFO=$(lookup_pr_info "$EXISTING_PR" "$EXISTING_PR_ERR")
  EXISTING_PR_STATUS=$?
  EXISTING_PR_ERROR=$(cat "$EXISTING_PR_ERR")
  rm -f "$EXISTING_PR_ERR"
  if [ "$EXISTING_PR_STATUS" -ne 0 ] || [ -z "$EXISTING_PR_INFO" ]; then
    if pr_lookup_repo_mismatch "$EXISTING_PR_ERROR"; then
      block_existing_pr "Existing PR $EXISTING_PR is not in $ORIGIN_REPO. $EXISTING_PR_ERROR"
    fi
    if pr_lookup_missing "$EXISTING_PR_ERROR"; then
      block_existing_pr "Existing PR $EXISTING_PR was not found or is not accessible."
    fi
    echo "Could not resolve existing PR $EXISTING_PR. STOP. Debug and retry without mutating bead state."
    [ -n "$EXISTING_PR_ERROR" ] && echo "$EXISTING_PR_ERROR"
    gc runtime drain-ack
    exit 1
  fi

  EXISTING_PR_STATE=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.state')
  EXISTING_PR_HEAD=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.headRefName')
  EXISTING_PR_BASE=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.baseRefName')
  EXISTING_PR_URL=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.url')
  EXISTING_PR_REPO=$(printf '%s\n' "$EXISTING_PR_URL" | sed -E 's#^https://github.com/([^/]+/[^/]+)/pull/[0-9]+$#\\1#')
  EXISTING_PR_HEAD_REPO=$(printf '%s\n' "$EXISTING_PR_INFO" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')

  if [ "$EXISTING_PR_STATE" != "OPEN" ]; then
    block_existing_pr "Existing PR $EXISTING_PR is $EXISTING_PR_STATE, want OPEN."
  fi
  if [ "$EXISTING_PR_HEAD" != "$BRANCH" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets branch $EXISTING_PR_HEAD, want $BRANCH."
  fi
  if [ "$EXISTING_PR_BASE" != "$TARGET" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets base $EXISTING_PR_BASE, want $TARGET."
  fi
  if [ "$EXISTING_PR_REPO" != "$ORIGIN_REPO" ]; then
    block_existing_pr "Existing PR $EXISTING_PR belongs to repo $EXISTING_PR_REPO, want $ORIGIN_REPO."
  fi
  if [ "$EXISTING_PR_HEAD_REPO" != "$ORIGIN_REPO" ]; then
    block_existing_pr "Existing PR $EXISTING_PR head repo $EXISTING_PR_HEAD_REPO, want $ORIGIN_REPO."
  fi
fi

if [ "$MERGE_STRATEGY" = "mr" ] && [ -z "$ORIGIN_REPO" ]; then
  [ -n "$ORIGIN_REPO_ERROR" ] && echo "$ORIGIN_REPO_ERROR"
  echo "Could not resolve origin repository for pull-request handoff. STOP. Debug and retry without mutating bead state."
  gc runtime drain-ack
  exit 1
fi
```

**Approval-gated merge lane (`require_merge_approval = {{require_merge_approval}}`)**

Off by default; when the rig turns it on, the refinery may not land anything
without a gc-native approval signal recorded on the work bead. The signal lives
in `merge_approval.*` metadata — verdict, PR number, head SHA, reviewer,
timestamp — written by a reviewer agent via
`assets/scripts/record-merge-approval.sh` and read here by
`assets/scripts/checks/merge-approval-gate.sh`, resolved from this formula's
own pack tree (see `resolve_approval_gate` above).

The head SHA is the whole point. An approval authorizes one commit, not a
branch: the gate re-reads the live PR head and refuses anything else, so
commits pushed after review do not inherit the approval. It refuses just as
hard when it cannot tell — unreadable bead, PR lookup failure, missing head
SHA. A tool error is a suspect, not a licence to merge.

Because the gate is keyed to a PR, `direct` was promoted to `mr` above. The
lane runs: publish/verify the PR, record its metadata, then gate. Approved for
the live head -> land it with the same ff-only merge script the direct path
uses. Refused -> park the bead awaiting review and let the next patrol
iteration re-check. A rebase that moves the branch changes the PR head and
therefore invalidates a prior approval — that is intended, since what would be
merged is no longer what was read. For the same reason the merge script's
lost-race retry is disabled under this gate: it parks instead of re-rebasing.

**If MERGE_STRATEGY = "direct" (default):**

**0. Merge-state gate (already-merged short-circuit + false-completion guard):**

Two failure modes share this gate, so evaluate them in one script that shares
shell state — an early `exit` in the already-merged branch below then provably
prevents the false-completion guard in this same script from running on a
closed bead. That `exit` does NOT drain: an already-merged close is a real
completion, so it skips the merge script and joins the normal path's
Cleanup -> patrol-summary -> next-iteration tail (pour next wisp, burn this
one), exactly like a normal merge. Only genuine errors drain-ack.

- **Already merged (close, do NOT halt):** a previous refinery pass merged this
  branch and the polecat crashed before the bead closed. That is a real
  completion, so close it as merged with `merged_sha` forensics rather than let
  the 0-diff guard escalate a done bead to a human. Two arms detect it, because
  one predicate cannot cover both merge shapes:
  - **Reachability (`already_merged_via=ancestor`).** `origin/$BRANCH` is an
    ancestor of `origin/$TARGET`. Ancestry alone is not enough — a 0-commit
    branch is trivially an ancestor (its tip is still the fork point) — so
    gate the close on the branch also carrying >=1 commit since its recorded
    `metadata.fork_sha`.
  - **Content (`already_merged_via=rebase_patch_id`).** Ancestry is a
    *sufficient* condition for already-merged, never a necessary one, and on
    this lane it is essentially unreachable: the merge script rebases `temp`
    onto the target and ff-merges, which REWRITES the commits, so after a
    successful merge the pre-rebase `origin/$BRANCH` sha is nowhere on
    `$TARGET`. A crash between `git push` and `gc bd close` therefore used to
    fall straight through to the 0-diff guard — the rebase correctly drops the
    already-applied commit, the guard correctly sees 0 commits / 0 diff, and a
    genuinely merged bead got halted to a human (winnow-zgr2y.6, refiled
    gcp-a4e7). So when the rebase collapses to nothing, ask `git cherry`
    whether every commit since `fork_sha` is already upstream by patch-id
    before halting.

  Without `fork_sha` recorded, neither arm can fire: stay conservative and fall
  through to the false-completion guard.
- **False completion (halt):** a branch that introduces no change vs its
  merge-base is definitionally not a merge. Refuse it before touching `$TARGET`.
  Legit no-op resolutions use wontfix/duplicate/not-planned, never merged — so
  this never blocks a real merge. The fork point is what keeps the content arm
  above from swallowing this case: a genuinely empty branch has no diff against
  its own `fork_sha`, and a branch merely rebased onto newer target carries no
  commit the target lacks (gcp-duy), so neither reaches the already-merged
  close.

```bash
# --- merge-state-gate:begin ---
FORK_SHA=$(gc bd show "$WORK" --json | jq -r '.[0].metadata.fork_sha // empty')
if ! git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"; then
  echo "git fetch failed; cannot evaluate merge state. STOP. Do not mutate bead state."
  gc runtime drain-ack
  exit 1
fi
git merge-base --is-ancestor "origin/$BRANCH" "origin/$TARGET"
ANCESTOR_STATUS=$?
case "$ANCESTOR_STATUS" in
  0)
    REAL_COMMITS=0
    if [ -n "$FORK_SHA" ]; then
      REAL_COMMITS=$(git rev-list --count "$FORK_SHA..origin/$BRANCH" 2>/dev/null || echo 0)
    fi
    if [ -n "$FORK_SHA" ] && [ "$REAL_COMMITS" -ge 1 ]; then
      close_already_merged "$(git rev-parse "origin/$BRANCH")" ancestor \
        "origin/$BRANCH is an ancestor of origin/$TARGET with $REAL_COMMITS commit(s) since fork"
    fi
    # Ancestor but no recorded real commits: a 0-commit branch. Fall through to
    # the false-completion guard, which refuses to close it as merged.
    ;;
  1) : ;;  # not an ancestor -> a normal merge candidate; fall through
  *)
    echo "git merge-base --is-ancestor errored (status $ANCESTOR_STATUS); cannot evaluate already-merged. STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac

branch_has_real_change "origin/$TARGET" temp
BHRC_STATUS=$?
case "$BHRC_STATUS" in
  0) : ;;  # verified real change -> continue to the merge script below
  1)
    # The rebase collapsed `temp` to nothing. Two opposite states look
    # identical from here, and the branch's own fork point is what separates
    # them: work that already landed (the rebase reports its commits as
    # previously applied) versus a polecat that produced nothing. Ask the
    # content-based predicate before halting — on this rebasing lane the
    # ancestor arm above cannot fire, so this is the ONLY arm that can catch a
    # crash between `git push` and `gc bd close`.
    branch_already_landed "origin/$TARGET" "origin/$BRANCH" "$FORK_SHA"
    BAL_STATUS=$?
    if [ "$BAL_STATUS" -eq 0 ]; then
      # merged_sha must name a commit ON the target; the pre-rebase branch tip
      # is not one after the rewrite. Fall back to the verified target tip only
      # if the carrying commit cannot be localized — never to the branch tip.
      ALREADY_SHA=$(upstream_equivalent_sha "origin/$TARGET" "origin/$BRANCH") ||
        ALREADY_SHA=$(git rev-parse "origin/$TARGET")
      close_already_merged "$ALREADY_SHA" rebase_patch_id \
        "every commit on origin/$BRANCH since $FORK_SHA is already upstream in origin/$TARGET by patch-id, and its rebase is empty"
    fi
    # Not already landed (status 1), or not evaluable (status 2): a branch that
    # merges to a no-op and has no evidence of having landed is a false
    # completion. Halt.
    halt_false_completion "$BRANCH" "$(git merge-base "origin/$TARGET" temp 2>/dev/null || printf '%s' "origin/$TARGET")"
    ;;
  *)
    echo "branch_has_real_change could not evaluate temp vs origin/$TARGET (tool error, status $BHRC_STATUS). STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac
# --- merge-state-gate:end ---
```
If this block closed the bead as already-merged, the merge is already done:
SKIP the merge script (step 1 below) and go straight to **2. Cleanup**, then
let this step complete so **patrol-summary** and **next-iteration** run (they
pour the next wisp and burn this one) — the same tail a normal merge takes. Do
NOT drain-ack here; that would strand the loop and leak the current patrol
wisp. The merged source branch is deliberately retained as recovery evidence.
Otherwise the branch has a verified real change and you continue to the merge.

**1. Merge, push, verify, and close work bead:**

Run this as one script. It uses a temporary detached worktree for the
target branch because the real target branch may already be checked out in
the rig's main worktree. Do not replace this with `git checkout $TARGET`.
The metadata write happens only after the remote target ref is verified to
have advanced, by this branch.

`merge_ff_push` replaces a lane that reported `merged` while nothing was
pushed (gcp-p87, live case winnow-ksyp). Two defects produced that, and both
are structural rather than incidental — read them before touching this block:

- **The abort depended solely on `set -e`.** The old script opened with
  `set -e` and relied on it to stop after a failed `git merge --ff-only`. It
  did not propagate through the refinery's execution harness, so execution
  continued into the metadata write and `gc bd close`. A step that mutates
  bead state must never depend on shell-option inheritance across a harness
  boundary. Every command below is checked on its own exit status, and
  `set -e` is deliberately NOT set — its absence must not change behaviour.
- **The push verification was TAUTOLOGICAL on exactly that path.** After a
  failed ff-merge the worktree HEAD is still the target tip; pushing an
  unchanged HEAD is a successful no-op; and the old guard — MERGED_SHA read
  from that HEAD, compared against a REMOTE re-read of the same target ref —
  then compared the old tip to itself and passed. It never asserted the
  target ADVANCED, nor that it advanced BY THIS BRANCH. The false
  `merged_sha` it wrote is a real, reachable commit on the target, so
  reachability-based audits cannot detect it.

Three properties are therefore asserted before any bead state is written,
each against state re-read after the push, never against the pre-merge
snapshot:

1. the ff-merge SUCCEEDED — checked on its exit status;
2. `origin/$TARGET` ADVANCED — the freshly fetched post-push tip differs
   from the tip the merge was actually performed on (`BEFORE_SHA`, captured
   as a SHA and used as the worktree base, so there is no ref-vs-SHA gap);
3. it advanced BY THIS BRANCH — `$TEMP_SHA` is reachable from that post-push
   tip.

`merged_sha` is `$TEMP_SHA`, the branch tip that carried the bead — never a
target tip. That is the second half of the same evidence: winnow-rp57 was
closed with a `merged_sha` naming a different bead's commit while its own
work landed elsewhere. Both known bad records share one shape — merge
bookkeeping recording a target TIP rather than the commit that carried the
bead — so the ff invariant `MERGED_SHA = TEMP_SHA` is asserted explicitly
rather than assumed.

**Losing the race is expected, not an incident.** A rig whose CI pushes to
the target after every merge (a deploy-overlay bump, a version stamp) races
its own refinery on every cycle. On "Not possible to fast-forward" the lane
re-rebases `temp` onto the new tip and retries, bounded at three attempts —
it does not fall through, and it does not escalate. The retry rebases
mechanically only: a conflicting re-rebase is aborted and the lane stops
without mutating bead state, so the next patrol iteration re-runs the whole
path and the **rebase** step's rejection handling deals with the conflict.

Re-rebasing moves the branch, so the commit that lands is not byte-identical
to the one **run-tests** checked. That is accepted for the mechanical case
above and capped by the retry bound. It is NOT accepted under the approval
gate: an approval authorizes one commit, so when `APPROVAL_REQUIRED` is 1 the
lane refuses to re-rebase and returns the park status instead, and the next
patrol iteration re-tests, re-publishes the head, and re-gates it.

**A rejected push is not evidence of a race — measure it.** The lane used to
attribute every push rejection to target movement and retry on that assumption.
Rejections have a second, more common cause: the rig's pre-push gate
(`scripts/gate-slot-run`) does a NON-BLOCKING slot acquire by default
(`PUSH_GATE_MAX_WAIT_SECONDS=0`) and vetoes the push when both test lanes are
busy. Under the old lane that veto was reported as movement and then retried
three times, and every retry re-ran the pre-push hook — so the diagnosis was
wrong AND the response was to add load to the very gate that was saturated
(gcp-ileo, twin gascity-mfac; a measured 28.2-minute slot queue is what those
retries queue behind). Two changes follow from that. The push carries its own
wait budget, exported for that one command, so the refinery queues for a slot
instead of being refused one. And on a rejection the lane re-reads
`origin/$TARGET` and compares it to `BEFORE_SHA` — the same comparison the
success path already makes — so it retries only when the target measurably
moved, and returns the distinct refusal status when it did not.

```bash
# --- merge-ff-push:begin ---
# Land `temp` on $TARGET and prove it landed. Reads BRANCH, TARGET,
# APPROVAL_REQUIRED; sets TEMP_SHA, MERGED_SHA, MERGED_SHORT on success.
#
# Exit status:
#   0 = landed and verified (MERGED_SHA is $TEMP_SHA, reachable on the target)
#   2 = hard stop; do not mutate bead state
#   3 = the re-rebase onto the new tip conflicted
#   4 = approval-gated and the branch must move; park awaiting review
#   5 = no-op: origin/$TARGET already contains temp; nothing to land here
#   6 = retries exhausted while losing the race (measured: the target moved
#       under every attempt)
#   7 = the remote REFUSED the push while $TARGET stood still — a push-gate
#       veto, a receive hook, or permissions. Not a race; retrying cannot help.
merge_ff_push_cleanup_wt() {
  if [ -n "${mfp_wt:-}" ]; then
    git worktree remove --force "$mfp_wt" >/dev/null 2>&1 || true
  fi
  if [ -n "${mfp_parent:-}" ]; then
    rmdir "$mfp_parent" 2>/dev/null || echo "WARN left temp dir $mfp_parent: git worktree remove did not empty it."
  fi
  mfp_wt=""
  mfp_parent=""
}

merge_ff_push() {
  mfp_wt=""
  mfp_parent=""
  mfp_max=3
  mfp_attempt=0
  # Wait budget for the merge push, and for nothing else in this patrol. The
  # rig's pre-push gate (scripts/gate-slot-run) reads PUSH_GATE_MAX_WAIT_SECONDS
  # and defaults it to 0 — a NON-BLOCKING slot acquire that vetoes the push
  # outright whenever the lane is busy. The refinery IS a queue: waiting for a
  # slot is what it is for, and a measured 28.2-minute queue (gc-wisp-wt5u) is
  # cheaper than a refused merge. Overridable per rig, exported per push.
  # A budget long enough to outlive the remote's idle timeout is a DIFFERENT
  # failure — the push dies mid-flight rather than being refused — so if raising
  # this starts producing torn pushes instead of merges, that interaction is
  # what to look at, not the refusal status below.
  mfp_push_wait="${REFINERY_PUSH_GATE_MAX_WAIT_SECONDS:-3000}"

  while [ "$mfp_attempt" -lt "$mfp_max" ]; do
    mfp_attempt=$((mfp_attempt + 1))

    if ! git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"; then
      echo "merge-ff-push: fetch of $TARGET failed on attempt $mfp_attempt; cannot establish the pre-merge tip."
      return 2
    fi
    # BEFORE_SHA is resolved once and then used as the worktree base, so the
    # advance check below compares against the commit the merge was really
    # performed on rather than re-reading a ref that may have moved since.
    if ! BEFORE_SHA=$(git rev-parse "origin/$TARGET"); then
      echo "merge-ff-push: could not resolve origin/$TARGET."
      return 2
    fi
    if ! TEMP_SHA=$(git rev-parse temp); then
      echo "merge-ff-push: could not resolve the rebased temp branch."
      return 2
    fi

    if ! mfp_parent=$(mktemp -d "${TMPDIR:-/tmp}/gascity-refinery-merge.XXXXXX"); then
      echo "merge-ff-push: could not create a scratch directory for the merge worktree."
      return 2
    fi
    mfp_wt="$mfp_parent/target"
    if ! git worktree add --detach "$mfp_wt" "$BEFORE_SHA" >/dev/null 2>&1; then
      echo "merge-ff-push: could not create the merge worktree at $BEFORE_SHA."
      merge_ff_push_cleanup_wt
      return 2
    fi

    # Explicit status check. Do NOT reintroduce a `set -e` dependency here:
    # this is the branch that reported a false merge when set -e did not
    # propagate through the execution harness.
    git -C "$mfp_wt" merge --ff-only "$TEMP_SHA"
    mfp_merge_status=$?
    if [ "$mfp_merge_status" -ne 0 ]; then
      merge_ff_push_cleanup_wt
      echo "merge-ff-push: ff-merge of $TEMP_SHA onto $BEFORE_SHA failed (status $mfp_merge_status) — origin/$TARGET moved under this patrol."
      if [ "${APPROVAL_REQUIRED:-0}" -eq 1 ]; then
        echo "merge-ff-push: approval is keyed to the current head; refusing to re-rebase it. Park for review."
        return 4
      fi
      if [ "$mfp_attempt" -ge "$mfp_max" ]; then
        break
      fi
      if ! git checkout temp >/dev/null 2>&1; then
        echo "merge-ff-push: could not check out temp to re-rebase it."
        return 2
      fi
      if ! git rebase "$BEFORE_SHA"; then
        git rebase --abort >/dev/null 2>&1 || true
        echo "merge-ff-push: re-rebase of temp onto $BEFORE_SHA conflicted; aborted. STOP — a later patrol re-runs the rebase step, which rejects the branch back to the pool."
        return 3
      fi
      echo "merge-ff-push: re-rebased temp onto $BEFORE_SHA; retrying (attempt $mfp_attempt of $mfp_max used)."
      continue
    fi

    MERGED_SHA=$(git -C "$mfp_wt" rev-parse HEAD)
    MERGED_SHORT=$(git -C "$mfp_wt" rev-parse --short HEAD)

    # An "Already up to date" ff-merge leaves HEAD at the target tip. Reporting
    # that as merged is precisely the target-tip-for-branch-tip mislabel; the
    # already-merged gate resolves this case from origin/$BRANCH instead.
    if [ "$MERGED_SHA" = "$BEFORE_SHA" ]; then
      merge_ff_push_cleanup_wt
      echo "merge-ff-push: ff-merge was a no-op — origin/$TARGET ($BEFORE_SHA) already contains temp. Nothing to land; not recording a merge."
      return 5
    fi
    # ff-only either fast-forwards HEAD to TEMP_SHA or leaves it alone, so this
    # cannot fire. Asserted anyway: it is the invariant that keeps merged_sha
    # the commit that carried the bead.
    if [ "$MERGED_SHA" != "$TEMP_SHA" ]; then
      merge_ff_push_cleanup_wt
      echo "merge-ff-push: ff-merge left HEAD at $MERGED_SHA, not the branch tip $TEMP_SHA. Refusing to record a merge."
      return 2
    fi

    PUSH_GATE_MAX_WAIT_SECONDS="$mfp_push_wait" git -C "$mfp_wt" push origin "HEAD:$TARGET"
    mfp_push_status=$?
    merge_ff_push_cleanup_wt
    if [ "$mfp_push_status" -ne 0 ]; then
      # MEASURE the cause; do not assert it. A rejection is either "the target
      # advanced under us" — retryable, re-rebase and go again — or "the remote
      # refused this push" (gate veto, receive hook, permissions), which no
      # number of retries can fix and which every retry pays for in gate load:
      # each attempt relaunches the pre-push hook and queues for another slot.
      # The verification below already draws exactly this comparison against the
      # freshly fetched tip; the rejection path never learned it, so every veto
      # was reported as movement and then retried three times (gcp-ileo).
      if ! git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"; then
        echo "merge-ff-push: push to $TARGET was rejected (status $mfp_push_status) and the follow-up fetch failed, so the cause cannot be measured. STOP. Do not mutate bead state."
        return 2
      fi
      if ! mfp_reject_sha=$(git rev-parse "origin/$TARGET"); then
        echo "merge-ff-push: push to $TARGET was rejected (status $mfp_push_status) and origin/$TARGET could not be resolved, so the cause cannot be measured. STOP. Do not mutate bead state."
        return 2
      fi
      if [ "$mfp_reject_sha" = "$BEFORE_SHA" ]; then
        echo "merge-ff-push: push to $TARGET was rejected (status $mfp_push_status) and origin/$TARGET is STILL $BEFORE_SHA — the target did not move, so the remote refused this push (push-gate veto, receive hook, or permissions). This is not a race; retrying re-runs the pre-push gate and cannot succeed. STOP. Do not mutate bead state."
        return 7
      fi
      echo "merge-ff-push: push to $TARGET was rejected (status $mfp_push_status); origin/$TARGET moved $BEFORE_SHA -> $mfp_reject_sha, so the target really did advance between the fetch and the push."
      if [ "${APPROVAL_REQUIRED:-0}" -eq 1 ]; then
        echo "merge-ff-push: approval is keyed to the current head; refusing to re-rebase it. Park for review."
        return 4
      fi
      if [ "$mfp_attempt" -ge "$mfp_max" ]; then
        break
      fi
      continue
    fi

    # Re-fetch and verify against the FRESH tip. The pre-push snapshot proves
    # nothing: a no-op push also exits 0.
    if ! git fetch origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"; then
      echo "merge-ff-push: post-push fetch of $TARGET failed; the merge cannot be verified. STOP. Do not mutate bead state."
      return 2
    fi
    if ! AFTER_SHA=$(git rev-parse "origin/$TARGET"); then
      echo "merge-ff-push: could not resolve origin/$TARGET after the push; the merge cannot be verified."
      return 2
    fi
    if [ "$AFTER_SHA" = "$BEFORE_SHA" ]; then
      echo "merge-ff-push: origin/$TARGET did not advance — still $BEFORE_SHA after a push that exited 0. STOP. Do not mutate bead state."
      return 2
    fi
    if ! git merge-base --is-ancestor "$TEMP_SHA" "$AFTER_SHA"; then
      echo "merge-ff-push: origin/$TARGET advanced to $AFTER_SHA but $TEMP_SHA is not reachable from it — the target moved for some other reason. STOP. Do not mutate bead state."
      return 2
    fi

    echo "merge-ff-push: landed $BRANCH on $TARGET at $MERGED_SHA (target advanced $BEFORE_SHA -> $AFTER_SHA)."
    return 0
  done

  # Only reachable after an attempt MEASURED the target moving — either the
  # ff-merge failed because origin/$TARGET had advanced, or the push was
  # rejected and the re-read tip differed from the one merged onto. A veto
  # against a stationary target returns 7 above and never reaches here, so this
  # message no longer steers the reader toward retrying harder (gcp-ileo).
  echo "merge-ff-push: could not land $BRANCH on $TARGET in $mfp_max attempts; the target moved under every attempt. STOP. Do not mutate bead state."
  return 6
}
# --- merge-ff-push:end ---

merge_ff_push
MERGE_LAND_STATUS=$?
case "$MERGE_LAND_STATUS" in
  0)
    gc bd update "$WORK" --set-metadata merge_result=merged --set-metadata merged_sha="$MERGED_SHA" --set-metadata merged_target="$TARGET" --unset-metadata rejection_reason && gc bd close "$WORK" --reason "Merged to $TARGET at $MERGED_SHORT"
    ;;
  4)
    park_awaiting_review "the approved head no longer fast-forwards $TARGET; the branch must be re-rebased and re-reviewed before it can land"
    ;;
  *)
    echo "merge-ff-push did not land $BRANCH on $TARGET (status $MERGE_LAND_STATUS). STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac
```

If `merge_ff_push` returns anything but 0 or 4: STOP. Debug and retry. Do NOT
write merge metadata, close the bead, or delete the source branch. Status 4 is
not a failure — the bead is parked awaiting review exactly as a refused gate
parks it (see 4b); run **2. Cleanup** and let this step complete.

Status 7 is the one that most invites a wrong next move: the remote refused the
push while `$TARGET` stood still. Re-running the merge immediately just re-runs
the pre-push gate, so if the gate is saturated the retry is what keeps it
saturated. Read the push output for the refusal reason (a busy push-gate lane,
a receive hook, permissions), clear that, and let the next patrol iteration pick
the branch back up. Raise `REFINERY_PUSH_GATE_MAX_WAIT_SECONDS` if the refinery
is losing slots to a genuinely busy gate rather than to a veto.

Both the `--set-metadata` write and the `gc bd close` are required —
`merged_sha` and `merged_target` are the only forensic breadcrumbs tying a
closed bead to its merge commit on `$TARGET`. `--unset-metadata
rejection_reason` clears any stale rejection field from an earlier
rejected/reworked attempt before the successful close.

`gastown/tests/test_refinery_merge_push.sh` extracts the block between the
`merge-ff-push` sentinels out of this file and runs it against real local
repositories, so the behaviour asserted there is the behaviour the refinery
runs. Keep the block self-contained and keep the sentinels intact.

**2. Cleanup:**
```bash
git checkout --detach "origin/$TARGET" >/dev/null 2>&1 || true
git branch -d temp || git branch -D temp || true
```
Run **Successful task-artifact cleanup** below, then leave
`origin/$BRANCH` intact. The exact remote source ref is the durable
recovery copy after local artifact cleanup. `delete_merged_branches` is retained
only for formula compatibility and MUST NOT delete a successfully handed-off
artifact source branch.

**If MERGE_STRATEGY = "mr":**

Refinery does NOT land the branch directly. Instead it publishes a pull
request and records a pending-merge handoff. The work bead remains blocked,
so its dependents remain blocked, until a later patrol verifies the PR merge.

**0. Refuse a 0-diff branch (false-completion guard):**

The same predicate covers the empty-PR / 0-commit concern: do not publish a
pull request for a branch that introduces no change vs its merge-base. An
empty PR cannot satisfy the work bead and must not enter the pending-merge
gate. A tool error (status 2) is not an empty branch — stop without mutating
bead state rather than halt-escalating a healthy branch.
```bash
branch_has_real_change "origin/$TARGET" temp
BHRC_STATUS=$?
case "$BHRC_STATUS" in
  0) : ;;  # verified real change -> continue to publish the PR
  1) halt_false_completion "$BRANCH" "$(git merge-base "origin/$TARGET" temp 2>/dev/null || printf '%s' "origin/$TARGET")" ;;
  *)
    echo "branch_has_real_change could not evaluate temp vs origin/$TARGET (tool error, status $BHRC_STATUS). STOP. Do not mutate bead state."
    gc runtime drain-ack
    exit 1
    ;;
esac
```

**1. Push the branch back to origin:**
```bash
git checkout temp
git push origin HEAD:$BRANCH --force-with-lease
```
If `--force-with-lease` fails, the existing PR branch moved after your fetch and
`temp` is stale. STOP. Do NOT rebase `temp` in place and retry the push: `mr` is
the only path that rewrites `$BRANCH`, and on the skip path `temp` is not a
rebase product — it is `origin/$BRANCH` with its merge topology intact — so
rebasing it here performs exactly the flattening the `rebase` step's ancestry
decision exists to prevent, and then force-pushes the flattened result over the
source branch.

Instead, re-enter the `rebase` step and let its ancestry decision run again on
the moved branch. Clear the tested branch out of the way first — the decision
probes BEFORE any branch exists so that every STOP leaves the worktree clean,
and both its arms materialize `temp` with an exit-checked `git checkout -b`, so a
surviving `temp` makes the re-entry STOP rather than proceed:
```bash
git checkout --detach "origin/$TARGET" && git branch -D temp
```
Then re-enter the step from the top and let it decide. It re-fetches both
tracking refs and re-probes
`git merge-base --is-ancestor "origin/$TARGET" "origin/$BRANCH"` with no `temp`
in the way, and its arms take it from there:
rc=0 re-materializes `temp` at the freshly fetched `origin/$BRANCH`, unrebased;
rc=1 re-materializes it and rebases onto `origin/$TARGET`;
any other status STOPs without mutating bead state.
Do not "re-materialize in place" with `git checkout -B temp` — that leaves the
branch alive across the probe, which is the ordering the decision's own
rationale rejects, and it strands a mutated `temp` behind a probe error.
Deleting and re-materializing replaces the tree that was tested, so this is
a step re-entry and not a push-level fixup: `run-tests` runs again on the new
`temp` before you return here to push. Do not use plain `--force`.

**2. Reuse, create, or discover the pull request:**

Read the bead's description and notes once and stage them into a PR body
file (using `--body-file` avoids quoting/encoding hazards with multi-line
markdown). The body always carries the bead's full description (the
"why"), and includes the polecat's implementation notes (the "what")
when present.

```bash
WORK_JSON=$(gc bd show $WORK --json)
EXISTING_PR=$(printf '%s' "$WORK_JSON" | jq -r '.[0].metadata.existing_pr // empty')
ISSUE_TITLE=$(printf '%s' "$WORK_JSON" | jq -r '.[0].title')
ISSUE_DESC=$(printf '%s' "$WORK_JSON" | jq -r '.[0].description // empty')
ISSUE_NOTES=$(printf '%s' "$WORK_JSON" | jq -r '.[0].notes // empty')
ISSUE_TYPE=$(printf '%s' "$WORK_JSON" | jq -r '.[0].issue_type // "task"')
ISSUE_PRIORITY=$(printf '%s' "$WORK_JSON" | jq -r '.[0].priority // empty')

PR_BODY_FILE=$(mktemp)
{
  echo "## Summary"
  echo
  if [ -n "$ISSUE_DESC" ]; then
    printf '%s\n' "$ISSUE_DESC"
  else
    printf 'Refinery handoff for `%s` (no bead description recorded).\n' "$WORK"
  fi
  if [ -n "$ISSUE_NOTES" ]; then
    echo
    echo "## Implementation notes"
    echo
    printf '%s\n' "$ISSUE_NOTES"
  fi
  echo
  echo "## Refinery handoff"
  echo
  printf -- '- Issue: `%s` (%s%s)\n' "$WORK" "$ISSUE_TYPE" "${ISSUE_PRIORITY:+, P$ISSUE_PRIORITY}"
  printf -- '- Source branch: `%s`\n' "$BRANCH"
  printf -- '- Target: `%s`\n' "$TARGET"
  # "Based on", not "Rebased on": on the skip path temp was never rebased, it is
  # origin/$BRANCH with its merges intact. Both paths end with origin/$TARGET an
  # ancestor of temp, which is exactly what this line now claims.
  printf -- '- Based on `%s` via Gastown Refinery.\n' "$TARGET"
} > "$PR_BODY_FILE"

if [ -n "$EXISTING_PR" ]; then
  PR_REF="$EXISTING_PR"
else
  if command -v gh >/dev/null 2>&1; then
    PR_URL=$(gh pr create \
      --repo "$ORIGIN_REPO" \
      --base "$TARGET" \
      --head "$BRANCH" \
      --title "$ISSUE_TITLE ($WORK)" \
      --body-file "$PR_BODY_FILE" 2>/dev/null || true)

    if [ -z "$PR_URL" ]; then
      PR_URL=$(gh pr view "$BRANCH" --repo "$ORIGIN_REPO" --json url -q '.url')
    fi
  else
    PR_ERR=$(mktemp)
    if ! init_github_rest 2>"$PR_ERR"; then
      cat "$PR_ERR"
      rm -f "$PR_ERR"
      gc runtime drain-ack
      exit 1
    fi
    EXISTING=$(curl_gh_api "$PR_ERR" \
      --get "$API/pulls" \
      --data-urlencode "state=open" \
      --data-urlencode "head=$OWNER:$BRANCH" \
      --data-urlencode "base=$TARGET")
    PR_STATUS=$?
    PR_ERROR=$(cat "$PR_ERR")
    if [ "$PR_STATUS" -ne 0 ]; then
      echo "GitHub API request failed while checking for an existing PR for $BRANCH."
      [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
      rm -f "$PR_ERR"
      gc runtime drain-ack
      exit 1
    fi
    PR_NUMBER=$(printf '%s\n' "$EXISTING" | jq -r '.[0].number // empty')
    if [ -z "$PR_NUMBER" ]; then
      CREATE_PAYLOAD=$(jq -n \
        --arg title "$ISSUE_TITLE ($WORK)" \
        --arg head "$BRANCH" \
        --arg base "$TARGET" \
        --rawfile body "$PR_BODY_FILE" \
        '{title:$title, head:$head, base:$base, body:$body}')
      CREATED=$(curl_gh_api "$PR_ERR" \
        -X POST "$API/pulls" \
        -d "$CREATE_PAYLOAD")
      PR_STATUS=$?
      PR_ERROR=$(cat "$PR_ERR")
      if [ "$PR_STATUS" -ne 0 ]; then
        echo "GitHub API request failed while creating a PR for $BRANCH."
        [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
        rm -f "$PR_ERR"
        gc runtime drain-ack
        exit 1
      fi
      PR_NUMBER=$(printf '%s\n' "$CREATED" | jq -r '.number // empty')
      if [ -z "$PR_NUMBER" ]; then
        echo "GitHub API response did not include a pull request number."
        rm -f "$PR_ERR"
        gc runtime drain-ack
        exit 1
      fi
    fi
    PR_RAW=$(curl_gh_api "$PR_ERR" "$API/pulls/$PR_NUMBER")
    PR_STATUS=$?
    PR_ERROR=$(cat "$PR_ERR")
    rm -f "$PR_ERR"
    if [ "$PR_STATUS" -ne 0 ]; then
      echo "GitHub API request failed while reading PR $PR_NUMBER."
      [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
      gc runtime drain-ack
      exit 1
    fi
    PR_URL=$(printf '%s\n' "$PR_RAW" | jq -r '.html_url // empty')
  fi
  PR_REF="$BRANCH"
fi

rm -f "$PR_BODY_FILE"
```

**3. Verify the pull request exists:**
```bash
PR_ERR=$(mktemp)
PR_INFO=$(lookup_pr_info "$PR_REF" "$PR_ERR")
PR_STATUS=$?
PR_ERROR=$(cat "$PR_ERR")
rm -f "$PR_ERR"
if [ "$PR_STATUS" -ne 0 ] || [ -z "$PR_INFO" ]; then
  if [ -n "$EXISTING_PR" ] && pr_lookup_missing "$PR_ERROR"; then
    block_existing_pr "Existing PR $EXISTING_PR was not found or is not accessible."
  fi
  echo "Pull request $PR_REF was not found."
  [ -n "$PR_ERROR" ] && echo "$PR_ERROR"
  gc runtime drain-ack
  exit 1
fi
PR_URL=$(printf '%s\n' "$PR_INFO" | jq -r '.url')
PR_NUMBER=$(printf '%s\n' "$PR_INFO" | jq -r '.number')
PR_STATE=$(printf '%s\n' "$PR_INFO" | jq -r '.state')
PR_HEAD=$(printf '%s\n' "$PR_INFO" | jq -r '.headRefName')
PR_HEAD_SHA=$(printf '%s\n' "$PR_INFO" | jq -r '.headRefOid')
PR_BASE=$(printf '%s\n' "$PR_INFO" | jq -r '.baseRefName')
PR_REPO=$(printf '%s\n' "$PR_URL" | sed -E 's#^https://github.com/([^/]+/[^/]+)/pull/[0-9]+$#\\1#')
PR_HEAD_REPO=$(printf '%s\n' "$PR_INFO" | jq -r '.headRepositoryOwner.login + "/" + .headRepository.name')
echo "$PR_URL $PR_NUMBER $PR_STATE $PR_HEAD $PR_BASE $PR_REPO $PR_HEAD_REPO"
if [ "$PR_STATE" != "OPEN" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR is $PR_STATE, want OPEN."
  fi
  echo "Pull request $PR_REF is $PR_STATE, want OPEN."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_HEAD" != "$BRANCH" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets branch $PR_HEAD, want $BRANCH."
  fi
  echo "Pull request $PR_REF targets branch $PR_HEAD, want $BRANCH."
  gc runtime drain-ack
  exit 1
fi
EXPECTED_PR_HEAD=$(git rev-parse temp)
if [ "$PR_HEAD_SHA" != "$EXPECTED_PR_HEAD" ]; then
  echo "Pull request $PR_REF head is $PR_HEAD_SHA, want validated branch head $EXPECTED_PR_HEAD."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_BASE" != "$TARGET" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR targets base $PR_BASE, want $TARGET."
  fi
  echo "Pull request $PR_REF targets base $PR_BASE, want $TARGET."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_REPO" != "$ORIGIN_REPO" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR belongs to repo $PR_REPO, want $ORIGIN_REPO."
  fi
  echo "Pull request $PR_REF belongs to repo $PR_REPO, want $ORIGIN_REPO."
  gc runtime drain-ack
  exit 1
fi
if [ "$PR_HEAD_REPO" != "$ORIGIN_REPO" ]; then
  if [ -n "$EXISTING_PR" ]; then
    block_existing_pr "Existing PR $EXISTING_PR head repo $PR_HEAD_REPO, want $ORIGIN_REPO."
  fi
  echo "Pull request $PR_REF head repo $PR_HEAD_REPO, want $ORIGIN_REPO."
  gc runtime drain-ack
  exit 1
fi
```
If this command fails or prints empty output: STOP. Debug and retry. Do NOT continue.

**4. Record the PR, then hand off or gate the merge:**

**4a. Approval gate off (`APPROVAL_REQUIRED` = 0) — record the pending PR
without closing the work bead:**

The command stores the canonical URL, number, validated head SHA, and target;
sets `merge_result=pull_request_pending`; and moves the bead to `blocked`
while retaining refinery ownership. That status is the dependency gate.
It also clears stale rejection/routing metadata so the blocked handoff cannot
be mistaken for pool demand.

```bash
if ! gc gastown pr-merge-reconcile record \
    "$WORK" "$PR_URL" "$PR_NUMBER" "$TARGET" "$PR_HEAD_SHA"; then
  echo "Failed to record pending PR state. STOP. Do not close $WORK."
  gc runtime drain-ack
  exit 1
fi
if ! gc mail send mayor/ \
    -s "PR ready for review: $WORK" \
    -m "Work bead: $WORK
Pull request: $PR_URL
 The bead and its dependents remain blocked until a refinery patrol verifies the merge."; then
  echo "Pending PR state is safe, but mayor notification failed; report the delivery failure."
fi
```

If the metadata transition fails: STOP. Do not close the bead or describe the
work as complete. The retry marker is armed before the multi-step transition;
a validated `existing_pr` hint is armed with it so a resumed validation does
not create a duplicate PR. A later patrol adopts an interrupted open record
and either completes a fully recorded block or returns an incomplete record to
full validation after clearing stale partial PR evidence. A mail failure does
not undo the safe blocked state; report the delivery failure and let a later
patrol retry/escalate.

**4b. Approval gate on (`APPROVAL_REQUIRED` = 1) — the PR is the start of
review, not the handoff.** Do NOT run 4a: a pending-PR record blocks the bead
until someone else merges the PR, while this lane lands the approved head
itself. Record the PR breadcrumbs first, in one update. `pr_url` and
`pr_number` are the only forensic breadcrumbs tying this bead to its pull
request, and the approval gate reads `pr_number` back to check that the
reviewer approved THIS PR — so the write must land before the gate runs.
`--unset-metadata rejection_reason` clears any stale rejection field from an
earlier rejected/reworked attempt.

```bash
gc bd update $WORK \
  --set-metadata pr_url="$PR_URL" \
  --set-metadata pr_number="$PR_NUMBER" \
  --set-metadata merged_target="$TARGET" \
  --unset-metadata rejection_reason
```

Then run the gate:

```bash
APPROVAL_GATE_OUTPUT=$(run_approval_gate "$(git rev-parse temp)" 2>&1)
APPROVAL_GATE_STATUS=$?
echo "$APPROVAL_GATE_OUTPUT"
if [ "$APPROVAL_GATE_STATUS" -ne 0 ]; then
  park_awaiting_review "$APPROVAL_GATE_OUTPUT"
fi
```

If `APPROVAL_GATE_STATUS` is non-zero the bead is parked awaiting review: do
NOT close it, do NOT merge, do NOT drain-ack, do NOT escalate. Run **5.
Cleanup** and let this step complete so patrol-summary and next-iteration pour
the next wisp — the bead stays open and assigned to the refinery, and the next
iteration re-checks the gate. Waiting for a reviewer is the normal state of
this lane, not an incident.

If `APPROVAL_GATE_STATUS` is 0 the live PR head is the exact commit a reviewer
approved. Land it:

```bash
gc bd update "$WORK" \
  --set-metadata merge_approval_state=approved \
  --unset-metadata merge_approval_gate_reason
```

Then run the direct path's **1. Merge, push, verify, and close work bead**
script verbatim. It merges `temp` ff-only into `$TARGET`, verifies against a
freshly fetched tip that the target advanced and that it advanced by this
branch, records `merged_sha`/`merged_target`, and closes the bead as merged.
GitHub marks the pull request merged once its head commits are reachable from
the base, so no separate PR-close call is needed.

`APPROVAL_REQUIRED` is still 1 here, so `merge_ff_push` will NOT re-rebase on a
lost race: an approval authorizes one commit, and re-rebasing would land
something no reviewer read. It returns the park status instead and the script's
`case` parks the bead — the same awaiting-review state a refused gate produces,
re-checked next iteration after the branch is re-rebased, re-tested, and
re-approved at its new head. Any other non-zero status: STOP, do not mutate
bead state, and do not retry the gate — a later patrol iteration re-runs the
whole path.
Do not run the direct-only task-artifact cleanup below: the bead closed as
`merge_result=merged`, so find-work's no-argument
`gc gastown task-artifact-cleanup` sweep removes its pending artifact on the
next patrol.

**5. Cleanup:**
```bash
git checkout "$TARGET"
git branch -d temp
```
Do not invoke task-artifact cleanup on this publication path. The artifact and
its durable `pending` marker remain intact until reconciliation verifies and
closes the MR handoff, then performs cleanup.
Do NOT delete `$BRANCH` in mr mode — GitHub pull requests need the source branch.

**Successful task-artifact cleanup (direct only on this path):**

Use the pack command below after the verified direct-mode close. It is
idempotent and is the only supported destructive cleanup path for a refinery
terminal handoff. MR mode reaches the same command only from reconciliation
after a fresh read proves the verified handoff is closed:

```bash
# BEGIN SUCCESSFUL_ARTIFACT_CLEANUP_COMMAND
if [ "$MERGE_STRATEGY" = "direct" ]; then
  if ! gc gastown task-artifact-cleanup "$WORK"; then
    echo "Task artifact cleanup did not converge. STOP; its durable pending/blocked state remains retryable."
    gc runtime drain-ack
    exit 1
  fi
fi
# END SUCCESSFUL_ARTIFACT_CLEANUP_COMMAND
```

The command accepts only this city's exact canonical artifact path or its exact
historical `$GC_CITY_PATH/.gc/worktrees/$GC_RIG/polecats/<provider>/worktrees/<bead>`
layout. Same-repository paths in another city, rig, or namespace are rejected.
It never force-removes a worktree, and removal additionally requires a clean
HEAD equal to the durable pre-rebase `artifact_source_sha`. Mutable metadata
is not deletion proof by itself: direct/verified merges refresh the recorded
origin target and prove `merged_sha` ancestry as corroboration of terminal
state, but do not mechanically prove a relation from the pre-rebase artifact
source to that merge. Direct mode therefore requires the exact artifact source
SHA at `origin/polecat/<bead>` and retains that source ref after local cleanup
as the durable recovery copy.
The current PR-publication path records GitHub's validated `pr_head_sha`, and
cleanup independently requires that exact source ref to remain at that SHA.

For direct merges and MR records with explicit merged evidence, the bead must
already be closed before the command can clean. The ambiguous historical
`merge_result=pull_request` value proves only publication, so cleanup preserves
that artifact even when the legacy bead is closed; operators must migrate it
through verified-merge reconciliation first. The merge-gated MR workflow does
not invoke cleanup at publication:

- before terminal closure the already-recorded `artifact_cleanup_state=pending`
  marker and artifact paths remain untouched;
- after verified closure it removes a proven-safe artifact and records
  `artifact_cleanup_state=complete`;
- a retry after removal but before the metadata write observes the missing
  path, clears stale path metadata, and records `complete`;
- invalid, dirty, or SHA-mismatched artifacts are preserved and marked
  `artifact_cleanup_state=blocked`.

MR reconciliation MUST record `merge_result=mr_merged`, preserve the exact
`pr_head_sha` and `polecat/<work>` source branch, plus `merged_sha`,
`pr_state=merged`, and the merge timestamp before attempting closure. Only
that complete blocked state is a valid verified-close retry. Reconciliation
confirms the bead is closed and only then runs
`gc gastown task-artifact-cleanup "$WORK"`. It retains
`pr_reconcile_pending` until a fresh bead read proves cleanup complete and both
artifact path fields cleared. A cleanup failure, command crash, or final
metadata-write failure therefore remains discoverable on the closed bead and a
later patrol retries it. Rejections never reach terminal cleanup; a polecat's
next successful submission clears the stale source-SHA proof so refinery
captures a fresh one.

**If MERGE_STRATEGY = "local":**

STOP. Local-only merge handoff is not implemented in the Gastown example pack.
Leave the work bead assigned to refinery and escalate to mayor for manual handling:
```bash
gc mail send mayor/ -s "ESCALATION: unsupported merge_strategy=local" -m "Work bead: $WORK
Branch: $BRANCH
Target: $TARGET
The Gastown example refinery supports direct and mr/pr merge strategies only."
```
Do NOT close the bead, delete the branch, or burn the wisp until a human decides how to proceed.

**GATE**: direct mode requires verified target push. mr mode records a verified
PR handoff but does not close the bead; closure happens only in
`gc gastown pr-merge-reconcile` after a verified merge. When
`require_merge_approval` is on, every merge additionally requires an approval
signal matching the live PR head SHA; anything else — including a gate that
cannot reach a verdict — parks the bead instead of landing it."""

[[steps]]
id = "patrol-summary"
title = "Record patrol cycle summary"
needs = ["merge-push"]
description = """
Summarize this patrol cycle for handoff context. This becomes the
audit trail — the next refinery session can see what happened.

Include:
- Branch merged (name, target)
- Test results (pass/fail, which checks ran)
- Bugs filed (IDs, if any pre-existing failures were tracked)
- Rejections (if the branch was rejected back to pool)
- Any escalations sent

If the cycle ended early (conflict rejection, no work found), note
why and what state was left.

This summary is not stored separately — it lives in the wisp's closing
reason. If the next session needs predecessor context, find it with
`gc bd list --type=molecule --include-infra --status=closed --limit=5`
(`--include-infra` is required — wisp roots live in the wisps table and
are skipped without it)."""

[[steps]]
id = "next-iteration"
title = "Prepare next patrol iteration"
needs = ["patrol-summary"]
description = """
**Config: integration_branch_auto_land = {{integration_branch_auto_land}}**

**1. Integration branch check (only if auto_land = "true"):**

If the merge target was an integration branch, check if the parent
owned convoy is now fully closed:
```bash
gc bd list --type=convoy --status=open
```
For each owned convoy with an integration branch: if ALL children are
closed, assign the convoy bead itself to you with the metadata needed
for a merge:
```bash
gc bd update <convoy-id> --assignee=$GC_AGENT \
  --set-metadata branch=<integration-branch> \
  --set-metadata target={{target_branch}}
```
The next patrol iteration picks up the convoy like any other work bead
and merges the integration branch to {{target_branch}} normally.

**FORBIDDEN**: Landing integration branches via raw `git merge`/`git push`.
The convoy bead assignment is the ONLY path.

If auto_land = "false": skip this entirely.

**2. Resolve the current wisp, pour next iteration, then burn this wisp:**
```bash
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=open,in_progress --type=molecule --include-infra --limit=0 --json | jq -r '.[0].id // empty')
fi
if [ -z "$CURRENT_WISP" ]; then
  echo "ERROR: could not resolve the current refinery wisp: GC_BEAD_ID is unset and no open/in_progress patrol wisp is assigned to $GC_AGENT."
  echo "ERROR: refusing to continue. With CURRENT_WISP empty this cycle would pour a successor and never burn the wisp it is running, leaking one wisp every cycle, while every command still exits 0."
  gc runtime drain-ack
  exit 1
fi
NEXT=$(gc bd mol wisp mol-refinery-patrol --root-only --var target_branch={{target_branch}} --var rig_name={{rig_name}} --var binding_prefix={{binding_prefix}} --json | jq -r '.new_epic_id // empty')
if [ -z "$NEXT" ]; then
  echo "Could not pour next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
# --- session-iteration-stamp:begin ---
# Carry the conversation's iteration count onto NEXT in the same write that
# assigns it, so check-inbox can restart at restart_after_iterations. The count
# continues only while CURRENT was stamped under this GC_CONTINUATION_EPOCH;
# any other epoch was an earlier conversation, so NEXT starts again at 1. With
# the epoch unset nothing is stamped and the cadence check reads "off".
set -- --assignee="$GC_AGENT"
if [ -n "${GC_CONTINUATION_EPOCH:-}" ]; then
  if ! STAMP_JSON=$(gc bd show "$CURRENT_WISP" --json 2>/dev/null); then
    echo "WARN: could not read $CURRENT_WISP; the next wisp's iteration count restarts at 1."
    STAMP_JSON=""
  fi
  STAMP_EPOCH=$(printf '%s' "$STAMP_JSON" | jq -r '.[0].metadata.session_epoch // empty' 2>/dev/null)
  STAMP_K=$(printf '%s' "$STAMP_JSON" | jq -r '.[0].metadata.session_iterations // empty' 2>/dev/null)
  case "$STAMP_K" in ''|*[!0-9]*) STAMP_K=0 ;; esac
  if [ "$STAMP_EPOCH" = "$GC_CONTINUATION_EPOCH" ]; then
    STAMP_K=$((STAMP_K + 1))
  else
    STAMP_K=1
  fi
  set -- "$@" --set-metadata session_epoch="$GC_CONTINUATION_EPOCH" --set-metadata session_iterations="$STAMP_K"
fi
if ! gc bd update "$NEXT" "$@"; then
  echo "Could not assign next refinery wisp; not burning."
  gc runtime drain-ack
  exit 1
fi
# --- session-iteration-stamp:end ---
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "ERROR: could not resolve the current refinery wisp; not burning. The patrol loop cannot advance — this wisp leaks and no successor runs."
  gc runtime drain-ack
  exit 1
fi
```

Close this step. The new wisp is ready — re-read formula steps to begin."""
