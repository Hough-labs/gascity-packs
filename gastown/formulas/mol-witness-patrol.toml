description = """
Witness patrol loop. Poured as a root-only wisp on startup:

  gc bd mol wisp mol-witness-patrol --root-only --var binding_prefix='{{binding_prefix}}'
  gc bd update $WISP --assignee=$GC_AGENT

Each wisp is ONE iteration: check for work, patrol, pour the next
iteration. On crash, re-read the formula steps and determine where
you left off from context (bead state, mail state, last action).

Formula steps are NOT materialized as child beads. Read the step
descriptions below and work through them in order.

The loop mechanism: EVERY step is one leg of the same wisp. Never exit
the wisp from an intermediate step — either continue to the next step
or jump directly to `next-iteration` to pour and burn. Exiting without
burning leaks wisps (see #1884). The prompt only bootstraps the first
wisp.

## Witness Role

The witness is the rig's work-health monitor. It does NOT manage processes
(the controller handles start/stop/restart/zombie detection). The witness
monitors the WORK layer:

1. **Orphaned bead recovery** — beads assigned to agents that won't spawn
   (pool max changed, agent removed from config). This is the core job.
2. **Per-bead worktree teardown** — reap polecat worktrees whose bead has
   closed. The witness owns BOTH ends of the worktree lifecycle: the crash
   path (orphan recovery) and the happy path (post-merge teardown).
3. **Polecat home audit** — the OTHER worktree a polecat has. A home has no
   bead, so the two duties above — and every other guard on the rig — are
   structurally blind to it (gcp-actg); only a roster-vs-disk diff finds one.
4. **Refinery queue health** — work beads assigned to refinery, staleness.
5. **Polecat health** — detect stuck polecats, file warrants for dog pool.
6. **Help mail** — triage HELP/escalation requests from polecats.

Gate checks and convoy/swarm completion are town-wide concerns handled by
the deacon, not the per-rig witness.

## Canonical Work Chain

```
worktree → (push) → branch → (merge) → target branch
```

Each transition moves the canonical location of the work. Once moved,
the previous location is disposable:
- After push: worktree disposable (branch is canonical)
- After merge: branch disposable (target is canonical)

The witness's core recovery job: when a bead is orphaned (agent won't
come back), ensure the work reaches the branch (push), then clean up
the worktree. This makes the work schedulable again.

The same rule applies when nothing went wrong. A CLOSED bead means the
refinery already verified the merge or the PR handoff, so its per-bead
polecat worktree is disposable too. Nobody else is positioned to remove
it — in `direct` mode the refinery and the polecat are both gone by the
time the bead closes, and in `mr`/`pr` mode the bead closes at PR
creation while the polecat is still available for FIX_NEEDED rework.
That teardown is the witness's job: `reap-merged-worktrees`.

## What the witness does NOT do

- Zombie detection (controller reconcile loop handles this)
- Process start/stop (controller handles this)
- Code implementation (polecats do this)
- Gate checks (deacon handles town-wide)
- Convoy/swarm completion (deacon handles cross-rig)
- Kill stuck agents directly (files warrant, dog pool runs shutdown dance)

Read each step's description before acting — Config values override defaults."""
formula = "mol-witness-patrol"

[vars]
[vars.binding_prefix]
description = "Import binding prefix for gastown agent identities, including trailing dot when bound."
default = ""

[vars.event_timeout]
description = "Seconds to sleep before re-checking. Replaces former event-watch loop which hot-spun on cache-reconcile firehose."
default = "60"

[[steps]]
id = "check-inbox"
title = "Context check, then mail"
description = """
**1. Context check (FIRST — before any work):**
```bash
RSS=$(ps -o rss= -p $$ | tr -d ' ')
RSS_MB=$((RSS / 1024))
```

If RSS > 1500 MB or context feels heavy, request a restart:
```bash
gc runtime request-restart
```
This sets `GC_RESTART_REQUESTED` metadata on the session and blocks
forever. The controller will kill and restart the session on the next
reconcile tick. The current wisp stays assigned and the new session
the new session re-reads formula steps and resumes from context.

**2. Check mail:**
```bash
gc mail inbox
```

Handle each message type:

**HELP / Blocked:**
Classify by keyword, then act based on severity:

| Category | Keywords | Severity | Action |
|----------|----------|----------|--------|
| Emergency | crash, data loss, corruption, security | Critical | Mail mayor immediately [HIGH] |
| Failed | failed, error, cannot, broken, exception | High | Investigate; mail mayor if unresolvable |
| Blocked | blocked, waiting, depends on, need access | Medium | Try to unblock (point to docs, suggest approach); escalate if you can't |
| Decision | should I, which approach, trade-off, design | Low | Answer if you can; escalate only if architectural |
| Lifecycle | done, finished, idle, restarting | Info | Acknowledge; no escalation needed |
| General help | help, stuck, confused, how do I | Low | Point to docs/suggest approach; escalate only if truly stuck |

For escalations:
```bash
gc mail send mayor/ -s "ESCALATION: <polecat> needs help [HIGH|MED|LOW]" -m "<category>: <details>"
```
Do NOT escalate routine blocks or lifecycle messages — handle them yourself.
Archive after handling.

**HANDOFF:**
Read predecessor context. Continue from where they left off.
Archive after absorbing context.

**Other / informational:**
Archive after reading.

**Hygiene principle**: Archive messages after they're fully processed.
Inbox should be near-empty after this step.

Close this step and continue to `recover-orphaned-beads` — do NOT exit
the wisp here. The `next-iteration` step is the only place that pours
the next wisp and burns this one."""

[[steps]]
id = "recover-orphaned-beads"
title = "Recover orphaned work beads"
needs = ["check-inbox"]
description = """
**This is the witness's core job.**

Find beads assigned to agents that will never process them, salvage any
unpublished work from the worktree, and return beads to the pool.

This happens when:
- Pool max was reduced (agents that won't spawn anymore)
- An agent was removed from config
- An agent crashed and the controller decided not to restart it (quarantine)

**Step 1: Find orphaned beads via session-ID liveness.**

**Ordering is mandatory: capture the candidate bead list FIRST, build the
liveness map SECOND.** Both reads are snapshots of a city that keeps moving,
and only this order is safe. Sessions can appear between the two reads, but a
session that a bead already names cannot retroactively vanish from a *later*
roster read — so a map built after the bead list is a superset of every
assignee that list can name. Build the map first and the window inverts: a
polecat that spawns and gets assigned work in between is missing from the map,
resolves to `absent`, and has its live worktree force-removed by Step 2. Do not
reorder these two reads.

List beads assigned to agents in YOUR rig (FIRST read):
```bash
gc bd list --status=in_progress --json --limit=0
gc bd list --status=open --json --limit=0
```

Filter for beads with an assignee (skip unassigned beads). This pass does not
solve the controller race where orphaned work may already have been released to
open/unassigned before witness observes it; that requires a separate
worktree-salvage scan keyed by `metadata.work_dir`. Bound Gastown polecat
assignees use the shape `<rig>/{{binding_prefix}}<polecat-suffix>`.

Get the full session roster for liveness checks (SECOND read — only after the
bead list above has been captured):
```bash
gc session list --state=all --json
gc bd list --type=session --label=gc:session --include-infra --include-gates --all --json --limit=0
```

For each bead with an assignee, check **session-ID liveness** — NOT
template pattern matching. Pool instances get new IDs on restart, so
matching against a template pattern (e.g., `worker-3` matches template
`worker`) gives false negatives: the old session ID is dead but the
witness skips it thinking "the pool will restart it." The pool creates
a NEW session with a different ID — the old one never comes back.

**Liveness check procedure:**

1. Build the assignee→state liveness map ONCE per cycle (after the bead list
   is captured, before the per-bead loop), then resolve each bead's assignee
   against it. The map MUST be built after the bead-list snapshot so it stays a
   superset of every assignee that list can name — that is the ordering mandate
   in Step 1, and it is what keeps a session spawned mid-cycle from resolving to
   `absent`. Do not re-invert it. Resolve by
   exact identifier lookup — do NOT extract a session ID with a regex or
   fixed prefix list: rig prefixes are configuration-derived, and assignees
   may be a session bead ID, session name, alias, concrete agent name, or
   configured named identity.

   Two schema facts this recipe depends on (verified live, gc-3tn8g):
   - `gc session list --json` returns an OBJECT `{sessions:[...], ...}`, not
     a top-level array — iterate `.sessions[]`, never the top level (the
     top-level values include booleans, so `$x.id` on them errors).
   - Session fields are lowercase snake_case: `id / name / session_name /
     alias / agent_name / state / closed`. Key the map on `id`, `name`,
     `session_name`, `alias`, and `agent_name` — the exact identifier forms
     an assignee may take.

   Stream both JSON blobs through temp files, never `--argjson` on argv: on a
   busy city the session `command` fields are large and overflow ARG_MAX
   (`argument list too long: jq`). Build the map once:
   ```bash
   SESSIONS_FILE=$(mktemp); SESSION_BEADS_FILE=$(mktemp)
   gc session list --state=all --json > "$SESSIONS_FILE"
   gc bd list --type=session --label=gc:session --include-infra --include-gates --all --json --limit=0 > "$SESSION_BEADS_FILE"

   LIVENESS_MAP=$(jq -n --slurpfile sessions "$SESSIONS_FILE" --slurpfile session_beads "$SESSION_BEADS_FILE" '
     def add($m; $key; $state; $closed):
       if (($key // "") | length) == 0 then $m
       else $m + {($key): (if $closed then "closed" else ($state // "") end)}
       end;
     (reduce ($sessions[0].sessions // [])[] as $s ({};
         add(.; $s.id;         $s.state; ($s.closed // false))
       | add(.; $s.name;       $s.state; ($s.closed // false))
       | add(.; $s.session_name; $s.state; ($s.closed // false))
       | add(.; $s.alias;      $s.state; ($s.closed // false))
       | add(.; $s.agent_name; $s.state; ($s.closed // false))
     )) as $from_sessions
     | reduce ($session_beads[0] // [])[] as $b ($from_sessions;
         add(.; $b.metadata.configured_named_identity; $b.metadata.state; ($b.status == "closed")))')

   SESSION_COUNT=$(jq -r '(.sessions // []) | length' "$SESSIONS_FILE")
   MAP_COUNT=$(printf '%s' "$LIVENESS_MAP" | jq -r 'length')
   rm -f "$SESSIONS_FILE" "$SESSION_BEADS_FILE"
   ```

   **Fail safe — never orphan on an empty map.** If the map is empty while
   sessions exist, the schema has drifted again (the exact failure in
   gc-3tn8g). An empty map resolves every assignee to `absent` and would
   false-orphan live agents. ABORT recovery this cycle — do NOT classify any
   bead as orphaned — escalate, then continue to `check-refinery`:
   ```bash
   if [ "${MAP_COUNT:-0}" -eq 0 ] && [ "${SESSION_COUNT:-0}" -gt 0 ]; then
     echo "FAIL-SAFE: empty liveness map with $SESSION_COUNT live sessions — skipping orphan recovery (treat all assignees as live)."
     gc mail send mayor/ -s "WITNESS: orphan-recovery disabled — empty liveness map" -m "Built an empty assignee->state map from $SESSION_COUNT live sessions. gc session list --json schema likely drifted again (gc-3tn8g); skipping orphan recovery this cycle to avoid false-orphaning live agents. Re-check the recover-orphaned-beads liveness recipe."
     # Skip the rest of this step; proceed to check-refinery.
   fi
   ```

   Resolve each bead's assignee against the prebuilt map:
   ```bash
   STATE=$(printf '%s' "$LIVENESS_MAP" | jq -r --arg a "$ASSIGNEE" '.[$a] // "absent"')
   ```

2. An `absent` lookup (assignee not in the map) is orphaned only for
   pool/ephemeral work identities. If the assignee is a refinery, witness, or
   other configured infrastructure identity, skip it instead of recovering it.

3. **Confirm every `absent` with a targeted live re-query before acting on
   it.** Recovery is destructive — it force-removes a worktree and reopens the
   source bead — so one stale map lookup must never be enough to trigger it.
   The `MAP_COUNT==0` fail-safe above only catches an EMPTY map; a map that is
   merely STALE is fully populated, passes that check, and fails silently on
   exactly the beads whose sessions are newest. Re-read that ONE identity and
   only keep `absent` if the second read agrees:
   ```bash
   if [ "$STATE" = "absent" ]; then
     CONFIRM_SESSIONS=$(mktemp); CONFIRM_BEADS=$(mktemp)
     # Default to unconfirmed and overwrite ONLY on a read that fully
     # succeeded and parsed. Every failure path then falls through to
     # "skip this bead", with no way to reach a destructive `absent`.
     STATE="unconfirmed"
     if gc session list --state=all --json > "$CONFIRM_SESSIONS" \
       && gc bd list --type=session --label=gc:session --include-infra --include-gates --all --json --limit=0 > "$CONFIRM_BEADS" \
       && [ -s "$CONFIRM_SESSIONS" ] && [ -s "$CONFIRM_BEADS" ]; then
       CONFIRMED=$(jq -r -n --arg a "$ASSIGNEE" \
         --slurpfile sessions "$CONFIRM_SESSIONS" --slurpfile session_beads "$CONFIRM_BEADS" '
         ([ ($sessions[0].sessions // [])[]
            | select((.id == $a) or (.name == $a) or (.session_name == $a)
                     or (.alias == $a) or (.agent_name == $a))
            | (if (.closed // false) then "closed" else (.state // "") end) ]
          + [ ($session_beads[0] // [])[]
            | select(.metadata.configured_named_identity == $a)
            | (if (.status == "closed") then "closed" else (.metadata.state // "") end) ])
         | first // "absent"') && STATE="$CONFIRMED"
     fi
     rm -f "$CONFIRM_SESSIONS" "$CONFIRM_BEADS"
   fi
   ```
   A confirmation read that FAILS (non-zero exit, empty file, unparseable JSON)
   is NOT proof of absence — that is what `unconfirmed` means, and an
   `unconfirmed` bead is skipped this cycle, not recovered. The re-read costs
   one roster pair per absent candidate — rare in a healthy city — and it turns
   an ordering race into a confirmed orphan. This is the guard that keeps
   Step 2 safe even if the Step 1 ordering regresses.

4. Classify:
   - `active` or `awake` → **not orphaned** (may be stuck —
     `check-polecat-health` handles that separately)
   - `creating`, `asleep`, `drained`, `suspended`, `draining`, or
     `quarantined` → **not orphaned** (controller or operator state still owns
     the session)
   - `unconfirmed` (the item-3 re-query itself failed) → **not orphaned** —
     skip the bead and let the next cycle re-evaluate it
   - `archived`, `closed`, or an `absent` **confirmed by the item-3 re-query**
     → **orphaned bead** for pool/ephemeral work — the owning session is gone
     and will never come back, regardless of whether the pool template still
     exists

**Important**: Beads assigned to the refinery, witness, or other
infrastructure agents (not pool instances) should be skipped — those
agents have persistent identity and the controller manages their
lifecycle directly.

**Step 2: For each orphaned bead, salvage work from the worktree.**

The canonical work chain: `worktree → (push) → branch → (merge) → target`.
Our job is to ensure work reaches the branch so it's schedulable.

Read the bead metadata to find the worktree and branch:
```bash
META=$(gc bd show <bead> --json | jq '.[0].metadata')
WORKTREE=$(echo "$META" | jq -r '.worktree // empty')
BRANCH=$(echo "$META" | jq -r '.branch // empty')
```

Resolve the rig's default branch before you go any further. Case C and Step 3
both compare against it, and neither may assume `main`: rigs run on `master`
(gauntlet), `dev` (winnow) and `edge-integration` (gascity) too. Against those,
a hardcoded `origin/main` does not resolve at all — git exits 128 and the
caller reads a plain negative, which in Step 3 means "not merged" and sends
finished work back to the pool (gcp-5ddt).

```bash
# Run from the rig root or the bead's worktree — either is inside the repo.
DEFAULT_REF=$(git symbolic-ref --quiet refs/remotes/origin/HEAD 2>/dev/null || true)
DEFAULT_BRANCH=${DEFAULT_REF#refs/remotes/origin/}
if [ -z "$DEFAULT_BRANCH" ]; then
  # origin/HEAD is not set in every clone — a worktree cut with --detach never
  # gets one. Ask the remote instead of guessing a name.
  DEFAULT_BRANCH=$(git ls-remote --symref origin HEAD 2>/dev/null |
    awk '$1 == "ref:" { sub("refs/heads/", "", $2); print $2; exit }')
fi
if [ -n "$DEFAULT_BRANCH" ]; then
  git fetch origin "$DEFAULT_BRANCH" >/dev/null 2>&1 || true
fi
if [ -z "$DEFAULT_BRANCH" ] ||
   ! git rev-parse --verify --quiet "origin/$DEFAULT_BRANCH" >/dev/null; then
  # FAIL CLOSED: skip this bead entirely, do not recover it. Step 3's
  # already-merged guard cannot run without this ref, and the cost of guessing
  # wrong is re-dispatching completed work. Leaving the bead orphaned for one
  # more cycle is cheap; re-dispatching merged work is not.
  echo "SKIP <bead>: cannot resolve origin's default branch in $(pwd)"
  gc mail send mayor/ -s "WITNESS: orphan recovery skipped — unresolvable default branch" \
    -m "Bead <bead>: could not resolve origin's default branch (origin/HEAD unset and git ls-remote --symref gave nothing). Skipped recovery rather than risk re-dispatching already-merged work. Fix by setting origin/HEAD on this rig: git remote set-head origin --auto"
  # Continue with the next orphaned bead.
fi
```

Check the bead and worktree state, then act:

**Case A: Branch exists on origin (work already published).**
Worktree is disposable — canonical work is on the branch.
```bash
git ls-remote --heads origin $BRANCH  # Verify branch exists on remote
```
If branch exists on origin → skip to Step 3 (cleanup).

**Case B: Worktree exists, branch pushed but not on origin yet.**
Branch is recorded in metadata but polecat may have crashed before push.
```bash
cd "$WORKTREE"
git ls-remote --heads origin $BRANCH
```
If branch IS on origin → skip to Step 3.
If branch is NOT on origin → fall through to Case C.

**Case C: Worktree exists with unpushed commits.**
Work is committed locally but never pushed. Branch is not yet canonical.
```bash
cd "$WORKTREE"
BRANCH=$(git branch --show-current)
git log "origin/$DEFAULT_BRANCH"..HEAD --oneline  # Shows unpushed commits
```
Commit any remaining uncommitted/untracked work first (safeguard):
```bash
git status --porcelain
# If any output:
git add -A
git commit -m "witness: salvage uncommitted work (<bead>)"
```
Publish the work to make branch canonical:
```bash
git push origin HEAD
gc bd update <bead> --set-metadata branch=$BRANCH
```
Skip to Step 3 (cleanup).

**Case D: Worktree exists with ONLY uncommitted/untracked changes (no commits).**
Same resolution as Case C. All work is useful work — never discard.
```bash
cd "$WORKTREE"
git add -A
git commit -m "witness: salvage work from orphaned agent (<bead>)"
BRANCH=$(git branch --show-current)
git push origin HEAD
gc bd update <bead> --set-metadata branch=$BRANCH
```
Skip to Step 3 (cleanup).

**Case E: No worktree exists (`metadata.work_dir` missing or directory gone),
no branch on origin.**
Nothing to salvage. The bead goes back to pool and a new polecat
starts fresh.

**Step 3: Verify the work already landed on the default branch before resetting.**

Before resetting the bead to pool, check whether the branch was already merged
into `origin/$DEFAULT_BRANCH` — the polecat finished and pushed, but crashed
before the bead was closed. This is the guard that stops the witness
re-dispatching completed work, so it uses reachability and nothing weaker:
```bash
if ! git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
  # Nothing was ever published under this branch (Case E). There is no merge
  # to detect, so the reset below is the correct outcome.
  MERGED=no
elif git merge-base --is-ancestor "origin/$BRANCH" "origin/$DEFAULT_BRANCH"; then
  MERGED=yes
else
  MERGED=no
fi
```

Both refs are verified before the comparison on purpose. `git merge-base
--is-ancestor` exits 1 for "not an ancestor" and 128 for "no such ref", and a
bare `if` cannot tell those apart. That collapse *is* the bug this guard was
hardened against: with `origin/main` hardcoded, every rig whose default branch
is something else took the 128 path, read it as "not merged", and fell through
to Step 3b — which force-removes the worktree and reopens the source bead,
putting merged work back in the pool (gcp-5ddt). Do not reintroduce a
`git log <branch> | grep -q "$BRANCH"` check alongside this one either: it
matches any commit whose *subject* mentions the branch name, so it fails in the
opposite direction, closing beads whose work never landed.

If `MERGED=yes`:
- **Close the bead** (work is done, don't re-dispatch). Use `--force`: the bead
  is still assigned to the crashed polecat, so this is a cross-actor close and
  bd's close-authority guard (gastownhall/beads#3734) would otherwise refuse it:
```bash
gc bd close <bead> --force
gc mail send mayor/ -s "ORPHAN_CLOSED: <bead> already merged" \
  -m "Branch $BRANCH already on $DEFAULT_BRANCH. Closed instead of resetting."
```
- Clean up worktree and skip to Step 4.

If `MERGED=no`, proceed with reset:

**Step 3b: Clean up worktree and return bead to pool.**

Once the branch is canonical (on origin), the worktree is disposable:
```bash
# Delete worktree if it exists
cd <rig-root>
git worktree remove <worktree-path> --force 2>/dev/null
rm -rf <worktree-path> 2>/dev/null  # Fallback
git worktree prune
```

Close any orphaned workflow subtree, then return the bead to pool:
```bash
gc workflow delete-source <bead> --apply && gc workflow reopen-source <bead>
```

**Step 4: Assess and notify.**

Always log each recovery as an event. Mail the mayor only when the
recovery is unexpected or concerning — use your judgment:

| Situation | Action |
|-----------|--------|
| Pool resize / config change removed agent | Log only. Routine. |
| Agent crashed mid-work, branch already on origin | Log + nudge mayor. Low urgency. |
| Work salvaged from worktree (data was at risk) | Log + mail mayor. Work was nearly lost. |
| Same bead recovered before (check `metadata.recovered`) | Log + mail mayor. Possible crash loop. |

When you do mail:
```bash
gc mail send mayor/ -s "ORPHAN_RECOVERED: <bead>" \
  -m "Bead <bead> was assigned to <agent> which is no longer active.
Recovery: <what was done — branch pushed / metadata set / work salvaged / nothing to salvage>
Branch: <branch name or 'none'>
Status: Reset to open pool for re-dispatch.
Concern: <why this one warrants attention>"
```

Mark recovered beads so spawn storm detection can track patterns:
```bash
gc bd update <bead> --set-metadata recovered=true
```

**Exit criteria:** All orphaned beads recovered, worktrees cleaned.
Or no orphans found. Continue to `reap-merged-worktrees` — do NOT exit
the wisp here. The `next-iteration` step is the only place that pours
the next wisp and burns this one."""

[[steps]]
id = "reap-merged-worktrees"
title = "Review post-merge worktree teardown"
needs = ["recover-orphaned-beads"]
description = """
The previous step cleans up worktrees on the CRASH path. This step covers
the HAPPY path — and the witness owns both ends.

`mol-polecat-work` workspace-setup creates one worktree per work bead at
`<polecat-home>/worktrees/<bead-id>` and records it in `metadata.work_dir`.
Until this teardown existed, nothing removed it once the bead closed, so a
rig accumulated exactly one abandoned worktree — and its full checkout —
per completed bead.

**Why the witness and not the refinery or the polecat:**

| Merge strategy | State when the bead closes | Who could reap |
|---|---|---|
| `direct` | Refinery merged and exited; polecat drained long before | Neither — only a later patrol |
| `mr` / `pr` | Refinery closed the bead at PR creation; the polecat is still available for FIX_NEEDED rework and still needs its worktree | Only an agent that can wait for the polecat to drain |

The witness is the one agent that patrols after both have gone.

**You do not run the reaper by hand.** `assets/scripts/polecat-worktree-reap.sh`
is wired as the witness `pre_start` in `agents/witness/agent.toml`, so it
has already run for this session:

```
<pack-config-dir>/assets/scripts/polecat-worktree-reap.sh <rig-root> --rig <rig>
```

It lives in `pre_start` rather than in a command here because pack assets
are installed into a content-hashed cache directory that a formula step
cannot name; the agent config's config-dir template is the only stable
handle on the script. Your job in this step is to read what it decided and
act on anything that is not routine. Re-run it by hand only when clearing
an incident.

**STAGED ROLLOUT — it is in dry-run today.** Real removal is opt-in
(`--no-dry-run`) and the `pre_start` above does not pass it, so every
would-be reap logs as `worktree_reap_pending` and nothing is removed. Do
NOT flip it from a patrol; the flip is an operator decision. Treat the log
as a report, not as a completed cleanup.

**THE PROMOTION CRITERION — coverage, not a count of clean cycles
(gcp-schs).** The flip is evidenced by a REVIEWED SET, so it is only sound
while the reviewed set is the whole candidate set. A budget-limited cycle
breaks out of the candidate loop and defers the rest, so it reviews a
PREFIX; "several clean cycles" says nothing about the candidates none of
them reached. Under the old fixed cutoff those were always the same
worktrees — and they are exactly what a live reaper, running with a fresh
budget, would reach first. Partial cycles do not add up to a review of the
set.

**AND COVERAGE IS STILL NOT SUFFICIENT (gcp-mves).** Everything above is
about WHICH WORKTREES ARE SELECTED. A dry run never calls the destructive
path at all, so no soak — however complete its coverage — is evidence about
whether a removal COMPLETES. winnow's witness verified the coverage
criterion honestly and still lost all 40 of the rig's per-bead worktrees to
a `pre_start` SIGKILL landing mid-removal, silently, because the failure
report is downstream of the kill (winnow-h0n2o). Selection is necessary;
completion is a separate question the log cannot answer.

So the criterion is stated on coverage AND on the two preconditions the
soak structurally cannot cover:

> Append `--no-dry-run` to the `pre_start` in `agents/witness/agent.toml`
> once ALL of the following hold:
>
> 1. the log carries at least one **`worktree_scan_complete`** cycle
>    (`deferred=0` — every candidate examined in a single run), and no live
>    worktree appears in the `worktree_reap_pending` set of that cycle or
>    of the cycles since;
> 2. `gcp-mves` has landed, so a removal interrupted by the SIGKILL leaves
>    a marked, resumable state instead of an unenumerable orphan;
> 3. `gascity-3z7d` is resolved, so `pre_start`s are not being killed in
>    the first place.
>
> Any one of the three alone is the evidence winnow armed on.

Check it from the log rather than from an impression of how the cycles have
been going:

```bash
LOG="${LOG_DIR:-$GC_CITY/.gc/runtime/logs}/polecat-worktree-reap.log"
# Has any cycle reviewed the WHOLE candidate set? No line here means no, and
# the criterion is not met however clean the recent cycles look.
jq -r 'select(.event == "worktree_scan_complete") | [.ts, .rig, .detail] | @tsv' "$LOG" |
    tail -n 5
# The would-reap set the flip would actually act on.
jq -r 'select(.event == "worktree_reap_pending") | [.ts, .rig, .bead] | @tsv' "$LOG" |
    tail -n 50
```

A `worktree_budget_exhausted` cycle stays honest and non-fatal — it reports
`deferred=N` and the rest carry to the next cycle — but it is not evidence
for the flip. The reaper also ROTATES its enumeration: a truncated cycle
records the last candidate it decided and the next resumes after it,
wrapping at the end, so the deferred remainder is a moving window instead of
a fixed tail and a complete cycle stays reachable on a busy rig. If a
worktree appears in one cycle's would-reap set and not the next, that is the
rotation, not a gate flapping.

**What it will and will not remove.** There are two removal authorities.
On the ordinary one — a worktree under a bead — all four of these must
hold:

1. The path is a per-bead worktree under an agent home
   (`<city>/.gc/worktrees/<rig>/<lane-tree>/<agent>/worktrees/<bead-id>`).
   An agent's persistent home worktree has no `worktrees/` parent segment
   and is never a candidate, nor is the rig root, nor the refinery's merge
   worktree, which keeps its per-bead directories one level higher at
   `<rig>/refinery/worktrees/`. The LANE TREE is not named: `polecats` is
   one, and a rig running view lanes has a second at `<rig>/views/`, whose
   per-bead worktrees are byte-identical in shape. The gate used to test
   for `polecats` and dropped every view worktree before it could emit
   anything at all — `/views/` appeared in 0 of 1293 reap-log entries while
   `/polecats/` accounted for all 1293 (gcp-elv3). If you see a lane tree
   in the log you did not expect, that is the fix working, not a fault.
2. The bead is `closed`. `open`/`in_progress` worktrees belong to a live
   polecat or to the orphan-recovery step above.
3. `git status --porcelain` in the worktree is empty. Uncommitted work is
   never discarded — a dirty worktree is logged as `worktree_dirty_kept`
   and left for you to salvage using the Case C/D recipes above.
4. The session roster confirms no live session owns the bead
   (`metadata.polecat_session`). This is what defers the reap in `mr`/`pr`
   mode until the polecat actually drains. A roster read that fails or does
   not parse is `unconfirmed`, never `absent` — a confirmation read that
   fails is not proof of absence, the same rule the orphan-recovery step
   above applies before it touches a bead.

That path deliberately does NOT require every commit to be on a remote: a
rebase-merging refinery rewrites hashes and then deletes the merged branch,
so a genuinely merged worktree always looks like it holds unpublished
commits. Bead closure is the refinery's own proof that the work landed.

A path whose leaf is not a bead id at all takes the OTHER route. `bd` answers
"no issue found matching" for it forever, so no bead closure will ever
authorise the reap and gates 2 and 4 cannot bind. Treating that as a transient
store failure retried it every cycle for as long as the directory existed, and
an unreapable child pins its parent polecat home open just as long
(`gcp-0u14`). The reaper separates the two on `bd`'s own error class — a
lookup that errors for any reason OTHER than "no issue found matching" stays
transient — logs `worktree_no_such_bead`, and then decides on the worktree's
own evidence: gate 3 above, plus

5. `HEAD` is reachable from a remote-tracking ref, so the commits exist
   somewhere other than that directory. This gate binds ONLY here, where there
   is no bead closure to stand on. A path that CONFIRMEDLY fails it — the probe
   ran and found no containing ref — is kept and reported as
   `worktree_unpublished_kept`, a finding rather than a retry, because that
   condition never resolves itself.

   A probe that could not answer is a THIRD state, not that finding. Blanking
   the probe's output on a budget-spent, timed-out or errored read made an
   unknown byte-identical to a confirmed negative, so a cycle that never ran
   the probe reported "the commits here exist nowhere else" for work that was
   already merged (`gcp-9ql4`) — the same indeterminate-as-definite-negative
   collapse `gcp-5ddt` hardened in the merge-base check. Those read as
   `worktree_publication_unconfirmed`, or as `worktree_budget_truncated` when
   the run's own clock is what stopped it, and the next cycle re-checks.

**Review the log.** Every decision lands in
`$GC_CITY/.gc/runtime/logs/polecat-worktree-reap.log` as one JSON line
(`$LOG_DIR` overrides the location; the reaper never writes inside the rig
repo). Read this cycle's lines:

```bash
tail -n 50 "${LOG_DIR:-$GC_CITY/.gc/runtime/logs}/polecat-worktree-reap.log"
```

**Read `reason` before you read the event name.** Every line carries a
`reason` field naming what actually happened, because an event name alone
cannot separate *the command ran and failed* from *the command never ran*.
Confusing the two has already sent two investigations at a Dolt server that
was healthy the whole time (`gcp-mqu9`). Two more fields make a line readable
on its own:

- `ts` is when THAT event happened, and `run_started` groups lines into
  cycles. (Before `gcp-mqu9` every line carried the run's start time, so a
  cycle that spent eight seconds looked instantaneous.)
- `budget_remaining` is the seconds left in the run's budget when the line was
  written. **A line with `budget_remaining: 0` is the reaper's own clock
  talking, not the subsystem the event names.** Check this field first on any
  event that sounds like an outage.

```bash
# This cycle's noteworthy lines, with the fields that decide who owns them.
jq -r 'select(.reason != "") | [.ts, .event, .reason, .budget_remaining, .bead] | @tsv' \
    "${LOG_DIR:-$GC_CITY/.gc/runtime/logs}/polecat-worktree-reap.log" | tail -n 50
```

| Event | Meaning | Action |
|---|---|---|
| `worktree_reap_pending` | Passed every gate; dry-run, so NOT removed | Routine while the rollout is staged — this is the would-reap set to review |
| `worktree_scan_complete` | The cycle examined every candidate: `deferred=0`, so the reviewed set IS the candidate set | The one line the promotion criterion above stands on. Routine otherwise |
| `worktree_reaped` | Removed. Routine, and only once `--no-dry-run` is wired. | Log only |
| `worktree_dirty_kept` | Closed bead, uncommitted changes on disk | Salvage per Case C/D, then re-run |
| `worktree_owner_live` | Closed bead, polecat still alive (PR rework) | None — expected; next cycle retries |
| `worktree_budget_truncated` | A check was NEVER ATTEMPTED — the run's budget was already spent when it came due. Nothing external failed. `reason` names the check that did not happen (`budget_spent_before_worktree_list` / `_bead_query` / `_roster_read` / `_git_status` / `_publication_probe` / `_publication_check`) | Not an outage; do not chase the named subsystem. Read it as "this cycle was too short", exactly like `worktree_budget_exhausted` below |
| `worktree_owner_unconfirmed` | Liveness is unknown, so the reap was skipped. `reason`: `roster_read_timed_out` (the read did not finish in the budget left), `roster_read_failed` (`gc session list` errored), `roster_unparseable` (it answered with a shape we do not recognise) | **`roster_read_timed_out` → the budget is the suspect first**; the detail names the seconds it got. Only `roster_read_failed`/`roster_unparseable` implicate the roster itself — then check `gc doctor`. Nothing was removed either way |
| `worktree_bead_unreadable` | The bulk `gc bd show` answered, but echoed no row for this bead id AND did not say the id does not exist (`reason: bead_absent_from_batch`) — a fuzzy hit that echoed a different id, or a per-id read failure. TRANSIENT: retried next cycle | If it repeats across many beads, check Dolt health. An id `bd` positively reports as absent is `worktree_no_such_bead` below, not this |
| `worktree_no_such_bead` | `bd` answered "no issue found matching" for this leaf (`reason: no_such_bead`), so it is not a bead worktree at all — typically a scratch directory hand-made under `worktrees/`. PERMANENT, so it is decided once instead of retried forever | Log only. The gate-3 / gate-5 line for the same path is the one that says what actually happened to it |
| `worktree_unpublished_kept` | A no-such-bead path that is clean, whose publication probe RAN, and whose `HEAD` was found on no remote-tracking branch (`reason: no_such_bead_content_unpublished`), so its commits exist nowhere else. Nothing was removed | A real finding, and it will NOT resolve on its own — inspect the worktree by hand. If the commits matter, push them somewhere; if they do not, remove the directory yourself. Mail the mayor if you cannot tell |
| `worktree_publication_unconfirmed` | The publication probe did not answer, so whether the commits exist elsewhere is UNKNOWN. `reason`: `publication_probe_timed_out` (cut short by the budget left) or `publication_probe_failed` (`git rev-parse HEAD` or `git branch --remotes --contains` exited non-zero, or HEAD read back empty). Nothing was removed | **Not a lost-work signal — do not salvage on it.** `publication_probe_timed_out` → budget first; the detail names the seconds it got. `publication_probe_failed` means the rig checkout or the worktree is unhealthy: inspect by hand. Either way the next cycle re-checks (`gcp-9ql4`) |
| `worktree_status_unreadable` | `git status` actually ran inside the worktree and did not answer. `reason`: `git_status_timed_out` (cut short by the budget left) or `git_status_failed` (non-zero exit) | **`git_status_timed_out` → budget first.** `git_status_failed` is the real one: inspect by hand, likely a broken or moved checkout |
| `worktree_reap_failed` | Directory survived removal. `reason`: `reap_rename_failed` (the worktree could not be renamed to its `.reaping` marker, so NOTHING was deleted) or `reap_incomplete` (the marked directory survived the `rm -rf`) | Investigate permissions/mounts, mail mayor. `reap_rename_failed` is the safe one — the worktree is untouched; `reap_incomplete` leaves a `.reaping` directory the next cycle will re-attempt |
| `worktree_bead_reopened` | The bead was `closed` when this cycle enumerated it and is not closed now (`reason: bead_changed_at_point_of_use`). The closure is what authorises the reap, so nothing was removed | None — this is the re-check working. A polecat has almost certainly been slung onto the reopened bead and is using that worktree. It stops being a candidate until the bead closes again |
| `worktree_revalidation_unconfirmed` | A gate could not be RE-CONFIRMED immediately before the removal, so the removal was refused. `reason`: `revalidation_status_unreadable` (the second `git status` did not answer), `revalidation_owner_unconfirmed` (the roster could not confirm the owner), or one of the renew-read reasons (`budget_spent_before_recheck_bead_read`, `recheck_bead_read_timed_out`, `recheck_bead_read_failed`, `recheck_bead_read_unparseable`) | Nothing was removed, which is the correct direction. Budget/timeout reasons → the cycle was too short, same reading as `worktree_budget_truncated`. A `_failed` reason means the store or the checkout is unhealthy — check `gc doctor` |
| `worktree_residue_git_view_absent` | A residue directory the disk walk found that git cannot administer at all — no `.git`, or one pointing at an admin entry that is gone. Gate 3 is UNEVALUABLE for it, and the line says so rather than reporting a clean tree it never inspected. The reap stands on gates 2 and 4 instead | Log only, and expected on any rig that ran an armed reaper before `gcp-mves`. It is the tail of an authorised removal that was killed; the gate-2/gate-4 line for the same path says what actually happened to it |
| `worktree_residue_no_bead_kept` | A residue directory with NO bead (`reason: residue_no_bead_unverifiable`). Gate 5 carries the no-such-bead path and needs a `git rev-parse HEAD` this directory cannot answer, so no evidence exists either way. Nothing was removed | A real finding that will not resolve on its own — inspect by hand, like `worktree_unpublished_kept`. The content is there; git's view of it is not. Mail the mayor if you cannot tell what it was |
| `worktree_list_failed` | `git worktree list` ran and did not answer, so no candidate was enumerated. `reason`: `worktree_list_timed_out` or `worktree_list_failed` | Timed out → budget first. Failed → the rig checkout itself is unhealthy; inspect `$RIG_ROOT` by hand |
| `worktree_bead_query_failed` | The one bulk bead read ran and did not answer. `reason`: `bead_query_timed_out` (slower than the seconds the run had left — the detail names them) or `bead_query_failed` (non-zero exit) | Nothing was examined this cycle. **`bead_query_timed_out` on a small remaining budget is the reaper's clock, not the store** — compare the detail's "Ns left of the Ms budget" before suspecting the endpoint. A `bead_query_failed`, or a timeout with most of the budget still unspent, is the rig's Dolt endpoint |
| `worktree_budget_exhausted` | The run hit its own wall-clock budget and stopped at the top of the loop. The detail carries examined/skipped/deferred counts, the window this cycle covered, and where the next resumes | Routine on a rig with many candidates; the rest are deferred to the next cycle. **Not evidence for the `--no-dry-run` flip** — this cycle reviewed a window, not the set. Persistent + a growing candidate count means the store is too slow for the budget — raise `[session] setup_timeout` AND `GC_REAP_BUDGET_SECONDS` together, or investigate the endpoint |

A `worktree_dirty_kept` that repeats across cycles means real work is
stranded on disk under a bead that is already closed. Mail the mayor —
that is a lost-work signal, not routine housekeeping.

**Why it may stop early.** The reaper is the witness `pre_start`, so gascity
bounds it by `[session] setup_timeout` (10s by default) and SIGKILLs an
overrun — which fails the session start outright and, after six failures in an
hour, latches the supervisor circuit breaker OPEN so the witness is never
respawned (`gcp-ntbf`: winnow lost its witness for 26h that way). So the script
holds itself to a budget inside that limit and exits cleanly when it expires.
Partial cleanup is by design: the work is idempotent, the next cycle resumes
it, and a witness that starts is worth more than a rig reaped in one pass.

**Exit criteria:** Reaper log reviewed and any non-routine event acted on.
Continue to `audit-polecat-homes` — do NOT exit the wisp here. The
`next-iteration` step is the only place that pours the next wisp and burns
this one."""

[[steps]]
id = "audit-polecat-homes"
title = "Audit polecat agent-home worktrees"
needs = ["reap-merged-worktrees"]
description = """
The two steps above cover the per-bead worktree at
`<polecat-home>/worktrees/<bead-id>` — the crash path and the happy path.
This step covers the OTHER worktree an agent has: its persistent agent
home at `<city>/.gc/worktrees/<rig>/<lane-tree>/<agent>`.

**Read the candidate set as wider than "polecats" (gcp-elv3).** The sweep
gates on the home SHAPE — one level under a lane tree, two under the rig's
worktree root — and not on the tree's name, because naming `polecats` made
it blind to every `views/<view-home>` on a rig running view lanes. Two
consequences for you: view homes now appear, which is the point; and so do
`crew/<slot>` homes, which have the same shape and the same respawn hazard
but were never swept before. Removal is still opt-in, so treat the first
few cycles of `home_removal_pending` on a crew slot as something to READ
rather than something that happened.

**Why it needs a step of its own.** A per-bead worktree is found through
its bead. A home has NO bead, so every guard the rig owns is structurally
blind to it (gcp-actg, reported by the gascity witness as gascity-o963):

| Guard | Key | Sees a home? |
|---|---|---|
| `polecat-worktree-reap.sh` | path must have a `worktrees/` parent | No — excluded by construction, correctly |
| `recover-orphaned-beads` | a bead whose `metadata.work_dir` leads there | No — there is no bead |
| the `work_dir` scan | same key | No — same blindness |

Only a roster-vs-disk diff can see a home, and until this step nothing
performed one. So `assets/scripts/polecat-home-audit.sh` issues zero
`gc bd` calls: candidates come from `git worktree list`, ownership from
`gc session list`. **Do not "improve" it by looking up a bead** — bead
keying is the shared root of this whole family of blind spots
(gascity-18kz, gcp-4k6o), and a home's bead lookup can only ever come back
empty and be misread as "nothing owns it".

**Why it is a formula step and NOT a `pre_start`.** `pre_start` is bounded
by `[session] setup_timeout` (10s) and SIGKILLed on overrun, which fails
the whole session start; six of those in an hour latch the supervisor
circuit breaker and the rig loses its witness (gcp-ntbf, and gcp-oo0v on
the deacon). The witness already spends most of that budget on the reaper.
A periodic sweep belongs in a patrol cycle. Do not move it.

**Step 1: Run the sweep.**

Pack assets install into a content-hashed cache directory this step cannot
name, so resolve the script from this formula's OWN resolved source path:
it ships beside this formula in the same pack tree, making that the one
candidate guaranteed present whenever the formula is and version-coherent
with it. `gc formula list --json` reports that path for every formula gc
can see, SHA-pinned packs included.

```bash
CITY="${GC_CITY:-${GC_CITY_PATH:-}}"
if [ -n "$CITY" ]; then
    FORMULA_JSON=$(gc formula list --city "$CITY" --json 2>/dev/null)
else
    FORMULA_JSON=$(gc formula list --json 2>/dev/null)
fi
FORMULA_SRC=$(printf '%s' "$FORMULA_JSON" \
    | jq -r '.formulas[]? | select(.name == "mol-witness-patrol") | .source // empty' 2>/dev/null \
    | head -1)
AUDIT=""
if [ -n "$FORMULA_SRC" ]; then
    # <pack>/formulas/mol-witness-patrol.toml -> <pack>/assets/scripts/<sweep>
    AUDIT="$(dirname "$(dirname "$FORMULA_SRC")")/assets/scripts/polecat-home-audit.sh"
fi
# GC_PACK_DIR is exported only when gc invokes a pack command, so it is a
# fallback and never the primary — depending on it alone is what made the
# refinery's approval gate permanently unresolvable (gcp-amo).
if [ ! -x "$AUDIT" ] && [ -n "${GC_PACK_DIR:-}" ]; then
    AUDIT="$GC_PACK_DIR/assets/scripts/polecat-home-audit.sh"
fi
if [ -x "$AUDIT" ]; then
    "$AUDIT" "$GC_RIG_ROOT" --rig "$GC_RIG"
else
    # A sweep that cannot be resolved is itself the finding. Nothing else in
    # this city watches polecat homes, so say it loudly rather than logging a
    # silent OK — that silence is the exact failure mode this step exists to
    # break.
    echo "polecat-home-audit: sweep not runnable (resolved '$AUDIT'); home worktrees are UNWATCHED this cycle — report it"
fi
```

**STAGED ROLLOUT — it is in dry-run today.** Real removal is opt-in
(`--no-dry-run`) and the invocation above does not pass it, so the sweep
logs what it WOULD remove and removes nothing. That matches the per-bead
reaper and the city's posture for the native gascity reaper. Review the
logged `home_removal_pending` set across several cycles, confirm no live
home ever appears in it, then add `--no-dry-run` above.

**Step 2: Read the verdicts.** One JSON line per decision, appended to
`$GC_CITY/.gc/runtime/logs/polecat-home-audit.log`:

```bash
tail -n 50 "${LOG_DIR:-$GC_CITY/.gc/runtime/logs}/polecat-home-audit.log" | jq -c '{ts,event,agent,reason,detail}'
```

| Event | Meaning | Action |
|---|---|---|
| `home_removal_pending` | Passed every gate; dry-run, so NOT removed | Routine while the rollout is staged — this is the would-remove set to review |
| `home_removed` | Removed. Routine, and only once `--no-dry-run` is wired | Log only. `worktree-setup.sh` recreates the home when the slot next spawns |
| `home_removal_failed` | The directory survived removal | Investigate permissions or mounts, mail the mayor — same as `worktree_reap_failed` above |
| `home_children_kept` | The home holds per-bead worktrees, so removing it would take them too | None on its own — expected. The reaper clears children first; the home becomes eligible on a later cycle. It defers TEARDOWN only and says nothing about the home's contents, so read it alongside any `home_dirty_kept` / `home_unpublished_commits_kept` line for the same agent — one home can carry both |
| `home_dirty_kept` | Uncommitted work in a home nothing owns | **This is the failure this step exists to prevent.** A respawned namepool slot inherits it and fails submit-and-exit's clean-state check (gascity-vst). Salvage or clear it by hand |
| `home_unpublished_commits_kept` | Commits reaching no remote, often on a detached HEAD | Investigate by hand. Whether they are superseded takes a CONTENT check at origin — a rebase/squash-merging refinery rewrites hashes, so `git merge-base --is-ancestor` lies here. The sweep deliberately does not guess |
| `home_owner_unconfirmed` | The roster parsed but this home's liveness query did not answer | Nothing was removed. If it repeats, the roster shape has drifted |
| `home_roster_unreadable` | `gc session list` failed, timed out, or answered in an unrecognised shape. Nothing was examined | `roster_read_timed_out` → the budget is the suspect first; the detail names the seconds it got. `roster_read_failed`/`roster_unparseable` implicate the roster — check `gc doctor` |
| `home_status_unreadable` / `home_commits_unreadable` | `git status` / `git rev-list` actually ran in the home and did not answer. `reason` separates `*_timed_out` from `*_failed` | Timed out → budget first. Failed → that checkout is broken or moved; inspect by hand |
| `home_worktree_list_failed` | `git worktree list` ran and did not answer | Timed out → budget first. Failed → the rig checkout itself is unhealthy |
| `home_budget_truncated` | A check was NEVER ATTEMPTED — the budget was already spent when it came due. Nothing external failed | Not an outage; do not chase the named subsystem. Read it as "this cycle was too short" |
| `home_budget_exhausted` | The run hit its wall clock and stopped at the top of the loop | Routine on a rig with many homes; the rest are deferred to the next cycle |

A home occupied by a live polecat is logged as NOTHING — that is the
healthy state of every working rig, and a line per agent per cycle would
bury the findings above.

**A `home_dirty_kept` or `home_unpublished_commits_kept` that repeats
across cycles is a lost-work signal, not routine housekeeping.** Mail the
mayor, exactly as for `worktree_dirty_kept` in the previous step.

**Exit criteria:** Sweep run, log reviewed, any non-routine event acted on.
Continue to `check-refinery` — do NOT exit the wisp here. The
`next-iteration` step is the only place that pours the next wisp and burns
this one."""

[[steps]]
id = "check-refinery"
title = "Check refinery queue health"
needs = ["audit-polecat-homes"]
description = """
Ensure the refinery is processing work and the queue is healthy.

**Step 1: Check work beads assigned to refinery:**
```bash
gc bd list --assignee=<rig>/{{binding_prefix}}refinery --status=open --json
```

These are work beads with `metadata.branch` and `metadata.target` that
polecats have submitted for merging. Look for:

- **Stale beads**: Assigned to refinery but old `UpdatedAt`. The refinery
  may be stuck or the bead may have been missed.
- **Queue depth**: Many beads waiting may indicate the refinery is
  overwhelmed or down.
- **Empty queue**: No work assigned — refinery is idle, which is fine.

**Step 2: Assess refinery wisp freshness:**

Check when the refinery last completed a patrol cycle by looking at
recent burned wisps. If the refinery has work assigned but its last
wisp is stale, the refinery may be stuck.

**Step 3: Nudge if needed:**
```bash
gc session nudge <rig>/{{binding_prefix}}refinery "Work beads waiting for merge. Please check queue."
```

**Step 4: Escalate if needed:**
```bash
gc mail send mayor/ -s "QUEUE_HEALTH: <summary>" \
  -m "Work bead IDs: <ids>
Observation: <what you found>
Recommendation: <what should happen>"
```

**Exit criteria:** Queue health assessed; nudge sent or escalation
filed if needed. Continue to `check-polecat-health` — do NOT exit the
wisp here. The `next-iteration` step is the only place that pours the
next wisp and burns this one."""

[[steps]]
id = "check-polecat-health"
title = "Check polecat work progress"
needs = ["check-refinery"]
description = """
Detect polecats that are alive but not making progress on their work.

The controller detects dead agents and restarts them. But a polecat can
be alive and stuck — infinite loop, blocked on something, or just not
progressing. The controller can't detect this; it's a work-layer judgment.

**Step 1: Find active polecat work beads:**
```bash
gc bd list --status=in_progress --json --limit=0
```
Filter for beads assigned to polecat-pattern agents in YOUR rig.

**Step 2: For each, assess progress:**

Check the work bead's `UpdatedAt` timestamp and the polecat's molecule
wisp freshness. Consider:

- **Recently updated** → making progress, skip
- **Stale but agent is in a long tool call** → might be fine, use judgment
- **Very stale, no wisp progress** → likely stuck

There are no hardcoded thresholds. Consider the nature of the work, the
time elapsed, and whether the agent shows any signs of activity. This is
judgment work — exactly why an LLM does it, not Go code.

**Step 3: For stuck polecats, file a warrant (deduped).**

Do NOT kill the agent directly. File a warrant bead and let the dog pool
handle the shutdown dance (multi-stage interrogation with due process).

First check for an existing open warrant against the same target — a second
warrant spawns a second shutdown dance racing the first (duplicate kills,
wasted dog cycles). Skip filing if one is already open or in progress:

```bash
TARGET_SESSION="<session-name>"
EXISTING_WARRANT=$(gc bd list --label=warrant --json --limit=0 \
  | jq -r --arg t "$TARGET_SESSION" \
      '[.[] | select((.status == "open" or .status == "in_progress") and (.metadata.target == $t))] | length')
if [ "${EXISTING_WARRANT:-0}" -gt 0 ]; then
  echo "Skipping warrant for $TARGET_SESSION — an open warrant already exists."
else
  gc bd create --type=task \
    --title="Stuck: <session-name>" \
    --metadata '{"target":"<session-name>","reason":"No progress on <bead> for <duration>","requester":"witness","gc.routed_to":"{{binding_prefix}}dog"}' \
    --label=warrant
fi
```

The dog pool picks up the warrant and runs `mol-shutdown-dance`, which
gives the polecat 3 chances to prove it's alive before killing it.

**Step 4: Log assessment:**

Note which polecats were checked and their status for observability.
Don't escalate to mayor for individual stuck polecats — the warrant
system handles it. Only escalate if you see a pattern (many stuck
polecats, systemic issue).

**Exit criteria:** All active polecat work beads assessed. Warrants
filed for stuck agents. Or no stuck polecats found. Continue to
`next-iteration` — do NOT exit the wisp here. The `next-iteration` step
is the only place that pours the next wisp and burns this one."""

[[steps]]
id = "next-iteration"
title = "Pour next iteration and loop"
needs = ["check-polecat-health"]
description = """
**Config: event_timeout = {{event_timeout}}**

End of patrol cycle. Pour the next iteration, then wait or exit.

**1. Context check:**

If context feels heavy or RSS is high:
```bash
gc runtime request-restart
```
This blocks forever. The controller restarts you. The next wisp
is already assigned — the new session resumes from context.

**2. Pour next iteration BEFORE burning (reconcile to exactly one):**

Reuse an already-queued wisp instead of pouring a duplicate. A prior cycle
may have poured a next wisp without burning, or a restart may have raced —
keep one patrol wisp and burn any surplus, so wisps never accumulate.
Wisp roots are `issue_type=molecule` (never `--type=wisp`, which is not a
valid gc bd type and matches nothing), and they live in the wisps table, so
`--include-infra` is REQUIRED — without it the query returns nothing, you
pour a duplicate every cycle, and the prior wisp leaks. Query
`open,in_progress`: a successor a crashed session already claimed is still
yours to resume, and an open-only query leaves it stranded forever. Exclude
the wisp you are on so this reconcile can never burn it out from under you.

Both queries below use the SAME filter — `--status=open,in_progress ...
--limit=0`. That is not cosmetic. Patrol wisps are poured `open` and nothing
transitions them to `in_progress`, so an `--status=in_progress` resolver
matches nothing on a normal cycle and CURRENT_WISP comes back empty; the
surplus exclusion `select(.id != $cur)` then excludes nothing, the wisp you are
running lands in its own surplus set, no successor is poured, and the loop
stops advancing while every command still exits 0 (gcp-ah8h). Matching filters
also guarantee CURRENT_WISP is the same element the surplus query lists first,
so the exclusion always lands. Resolving CURRENT_WISP empty is a hard error,
never a warning to continue past.
```bash
CURRENT_WISP=${GC_BEAD_ID:-}
if [ -z "$CURRENT_WISP" ]; then
  CURRENT_WISP=$(gc bd list --assignee="$GC_AGENT" --status=open,in_progress --type=molecule --include-infra --limit=0 --json | jq -r '.[0].id // empty')
fi
if [ -z "$CURRENT_WISP" ]; then
  echo "ERROR: could not resolve the current witness wisp: GC_BEAD_ID is unset and no open/in_progress patrol wisp is assigned to $GC_AGENT."
  echo "ERROR: refusing to reconcile. With CURRENT_WISP empty the live wisp lands in its own surplus set, no successor is poured, and the patrol loop stops advancing without ever failing."
  gc runtime drain-ack
  exit 1
fi
SURPLUS_WISPS=$(gc bd list --assignee="$GC_AGENT" --status=open,in_progress --type=molecule --include-infra --limit=0 --json \
  | jq -r --arg cur "$CURRENT_WISP" '.[] | select(.id != $cur) | .id')
NEXT=$(printf '%s\n' $SURPLUS_WISPS | sed -n '1p')
for extra in $(printf '%s\n' $SURPLUS_WISPS | sed '1d'); do
  gc bd mol burn "$extra" --force
done
if [ -z "$NEXT" ]; then
  NEXT=$(gc bd mol wisp mol-witness-patrol --root-only --var binding_prefix='{{binding_prefix}}' --json | jq -r '.new_epic_id')
  gc bd update "$NEXT" --assignee="$GC_AGENT"
fi
```

**3. Burn this wisp:**
```bash
if [ -n "$CURRENT_WISP" ]; then
  gc bd mol burn "$CURRENT_WISP" --force
else
  echo "ERROR: could not resolve the current witness wisp; not burning. The patrol loop cannot advance — this wisp leaks and no successor runs."
  gc runtime drain-ack
  exit 1
fi
```

**4. Exit this turn:**
Write exactly:
```
IDLE: no work, exiting turn.
```
Then stop immediately. Do NOT sleep, call ScheduleWakeup, or use Monitor.
The session_sleep policy will restart this session after the configured idle interval;
the next wisp is already assigned and the restarted session resumes from it.

**Exit criteria:** Next wisp poured, this wisp burned, turn ended with IDLE signal."""
