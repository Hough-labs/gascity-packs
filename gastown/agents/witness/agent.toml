scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/witness"
# Post-merge teardown of per-bead polecat worktrees is NOT wired here. It is the
# `reap-merged-worktrees` step of mol-witness-patrol (gcp-d9uj), which resolves
# the reaper script from the formula's own source path.
#
# It used to be a pre_start, and that placement was the whole problem: gascity
# bounds pre_start by [session] setup_timeout and SIGKILLs an overrun, a killed
# pre_start fails the whole session start, and six of those in an hour latch the
# supervisor circuit breaker open (gcp-ntbf: winnow's witness was dead for 26h).
# The reaper therefore had to hold itself to 8s, which on a loaded city was one
# bead read and nothing else, and 63% of cycles ended `budget_exhausted`. A patrol
# step has no start deadline, so the budget is a policy choice there
# (`worktree_reap_budget`, default 120s) and removal mode is a per-rig choice
# (`worktree_reap_mode`, default dry-run) in [rigs.formula_vars].
#
# Do NOT put a reaper back here. Two reapers over one worktree set is a worse
# failure than the one this move fixed, and gastown/tests/
# test_agent_pre_start_budget.sh fails if the witness gains a pre_start again.
#
# The two preconditions for arming real removal (gcp-mves landed; gascity-3z7d
# resolved) are stated in the reap-merged-worktrees step, next to the criterion
# they belong to. Arming is `worktree_reap_mode = "remove"` per rig, an operator
# decision, never a pack default.
nudge = "Run 'gc prime' to check worker status and begin patrol cycle."
idle_timeout = "1h"
# Preemptively cycle the witness before the typical provider cred-cache
# lifetime. Claude Code (Bedrock) caches AWS creds at session start and can
# wedge once the underlying STS/SSO token expires (~8h). Restarting under
# 8h picks up fresh creds without user intervention. Controller gates this
# on idle: a mid-turn witness is left alone until it settles. See gascity#2025.
max_session_age = "5h"
max_session_age_jitter = "15m"
max_active_sessions = 1
