scope = "rig"
wake_mode = "fresh"
work_dir = ".gc/agents/{{.Rig}}/witness"
# Post-merge teardown of per-bead polecat worktrees. The witness owns both ends
# of the worktree lifecycle — the crash path via mol-witness-patrol's
# recover-orphaned-beads step, and the happy path here. Wired as pre_start
# because pack assets live in a content-hashed cache directory that a formula
# step cannot name; {{.ConfigDir}} is the only stable handle on the script.
# The reaper is read-mostly, idempotent, and refuses to touch a worktree that
# is dirty, not closed, or owned by a session it cannot confirm is gone — see
# the script header for all four gates.
#
# BOUNDED: pre_start is killed at [session] setup_timeout (10s by default), and
# a killed pre_start fails the whole start — six of those in an hour latch the
# supervisor circuit breaker open and the rig loses its witness entirely
# (gcp-ntbf). The script therefore holds itself to a budget inside that limit
# (8s; GC_REAP_BUDGET_SECONDS / --budget) and exits 0 when it expires, reaping
# the rest next cycle. Raise one only alongside the other.
#
# STAGED ROLLOUT: no --no-dry-run here, so this reports what it WOULD reap and
# removes nothing. Reviewing the logged would-reap set until no live worktree
# ever appears in it is NECESSARY and it is NOT SUFFICIENT, and reading it as
# sufficient is what cost winnow 40 worktrees (gcp-mves, winnow-h0n2o):
#
#   - The soak evidences SELECTION. It shows which worktrees this script picks,
#     and that no live one is among them. That is a real and useful result.
#   - It cannot evidence REMOVAL COMPLETION. A dry run never calls the
#     destructive path at all, so nothing the soak observes says anything about
#     whether a removal finishes — and the removal is the half that failed.
#     winnow's witness verified the criterion honestly (35/35 beads closed, no
#     live worktree ever logged) and still lost every per-bead worktree on the
#     rig to a pre_start SIGKILL landing mid-removal, silently, because the
#     failure report is downstream of the kill.
#
# TWO PRECONDITIONS, BOTH, before --no-dry-run is appended anywhere:
#   1. gcp-mves has landed — removal is resumable across the SIGKILL and the
#      residue an earlier interrupted run left is enumerable again.
#   2. gascity-3z7d is resolved — pre_starts are not being killed in the first
#      place. This box starts sessions in ~218s against a 180s setup_timeout,
#      which is why the kill happens at all.
# This replaces the earlier hold, which cited gc-zxxy. That reason expired:
# gc-zxxy closed 2026-08-27 and city.toml already sets
# auto_reap_closed_bead_worktrees = true. The hold did not expire with it — a
# stale rationale is not an argument that the hold should lift.
pre_start = ["{{.ConfigDir}}/assets/scripts/polecat-worktree-reap.sh {{.RigRoot}} --rig {{.Rig}}"]
nudge = "Run 'gc prime' to check worker status and begin patrol cycle."
idle_timeout = "1h"
# Preemptively cycle the witness before the typical provider cred-cache
# lifetime. Claude Code (Bedrock) caches AWS creds at session start and can
# wedge once the underlying STS/SSO token expires (~8h). Restarting under
# 8h picks up fresh creds without user intervention. Controller gates this
# on idle: a mid-turn witness is left alone until it settles. See gascity#2025.
max_session_age = "5h"
max_session_age_jitter = "15m"
max_active_sessions = 1
