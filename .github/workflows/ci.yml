name: CI

on:
  pull_request:
    branches: [integration]
  push:
    branches: [integration]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: hough-labs-k3s
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: slack-full/adapter/go.mod
          cache-dependency-path: |
            slack-full/cli/go.sum

      - name: Install Python test dependencies
        run: python3 -m pip install --break-system-packages PyYAML pytest jsonschema

      - name: Validate registry
        # --require-git: without git, no commit or content-hash verification runs at
        # all, so a missing worktree must fail rather than silently downgrade this to
        # a format-only check. (checkout above uses fetch-depth: 0, as it must.)
        run: python3 validate_registry.py --require-git

      - name: Run Python pack tests
        run: python3 -m pytest tests contributing/tests gascity/tests discord/tests github/tests slack-full/tests slack-channel/tests pr-pipeline/tests gauntlet-tdd/tests -q

      # Installed once, from the published release archive, and reused by every
      # step below that needs gc. `go install` of cmd/gc costs 4.46 GiB of
      # ephemeral storage (gcp-m0ei) against the runner container's 4Gi limit --
      # this job survived it only by a margin, and the nightly did not. The
      # script exports the resolved binary as GC_BIN.
      - name: Install Gas City
        run: .github/scripts/install-gascity-archive.sh latest --cache

      - name: Lint and exercise shared role prompt composition
        run: |
          for pack in gascity gascity/roles bmad compound-engineering gstack superpowers; do
            "$GC_BIN" lint "$pack"
          done
          GC_TEST_BIN="$GC_BIN" python3 -m pytest tests/test_gc_role_prompt_integration.py -q

      - name: Run Gastown shell tests
        run: |
          for test_script in gastown/tests/test_*.sh; do
            bash "$test_script"
          done

      - name: Run root module embed tests
        run: go test .

      - name: Run Slack full adapter tests
        working-directory: slack-full/adapter
        run: go test ./...

      - name: Run Slack full CLI tests
        working-directory: slack-full/cli
        run: go test ./...

      - name: Run Slack channel adapter tests
        working-directory: slack-channel/adapter
        run: go test ./...

      - name: Run Slack mini adapter tests
        working-directory: slack-mini/adapter
        run: go test ./...

      - name: Run runtime-cloudflare module tests
        working-directory: runtime-cloudflare/runtime
        run: |
          go vet ./...
          go test ./...

      # RPP conformance gate. Non-blocking until gascity main ships the
      # Runtime Provider Protocol (the runtime-provider-packs PoC branch
      # merges) — `gc runtime check` does not exist on gascity main yet, so
      # `latest` cannot satisfy this today. Flip continue-on-error to false
      # (and pin a version) once RPP lands on gascity main. gc arrives as a
      # prebuilt tool binary, not a Go import, so the pack keeps zero gascity
      # deps; GC_BIN comes from the Install Gas City step above.
      - name: Run runtime-cloudflare RPP conformance
        working-directory: runtime-cloudflare
        continue-on-error: true
        run: ./conformance.sh
